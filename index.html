  {"t": "Rôles et missions de l'agent", "q": "Parmi ces tâches, laquelle fait partie des missions de l'agent SSIAP 1 ?", "o": ["L'entretien élémentaire des moyens concourant à la sécurité incendie", "La réparation du SSI", "La maintenance des ascenseurs", "Le contrôle de l'installation électrique"], "a": [0], "e": "Par exemple : vérifier qu'un extincteur est présent, accessible, plombé et sous pression."},
  {"t": "Rôles et missions de l'agent", "q": "Le but principal d'une ronde est :", "o": ["Prévenir et détecter les anomalies et les risques d'incendie", "Compter les clients", "Surveiller les horaires du personnel", "Faire du sport"], "a": [0], "e": "On vérifie aussi les moyens de secours, les portes coupe-feu et les dégagements."},
  {"t": "Rôles et missions de l'agent", "q": "La main courante est :", "o": ["Un registre où l'on note chronologiquement les événements, rondes et interventions", "Une rampe d'escalier", "Un plan d'évacuation", "Une consigne affichée"], "a": [0], "e": "Elle sert aussi à transmettre les informations entre équipes."},
  {"t": "Rôles et missions de l'agent", "q": "Sur une main courante, on ne doit jamais :", "o": ["Arracher une page ou utiliser du correcteur", "Noter l'heure", "Noter les mesures prises", "Signer"], "a": [0], "e": "C'est un document qui peut servir de preuve : une erreur se barre proprement et se signe."},
  {"t": "Rôles et missions de l'agent", "q": "Lors d'une ronde, vous constatez qu'un extincteur a disparu. Que faites-vous ?", "o": ["Je le signale à ma hiérarchie, je le note sur la main courante et je le fais remplacer", "Je ne dis rien", "J'attends la prochaine visite de la commission", "Je vais en acheter un"], "a": [0], "e": "Toute anomalie est signalée, notée et suivie jusqu'à sa correction."},
  {"t": "Rôles et missions de l'agent", "q": "Lors d'une ronde, une issue de secours est encombrée par des cartons. Que faites-vous ?", "o": ["Je la fais dégager immédiatement et je le note sur la main courante", "Je continue ma ronde", "Je ferme l'issue à clé", "J'attends la fin du service"], "a": [0], "e": "Un dégagement doit être libre en permanence : c'est une anomalie grave."},
  {"t": "Rôles et missions de l'agent", "q": "Lors d'une ronde, une porte coupe-feu est calée ouverte. Que faites-vous ?", "o": ["Je retire la cale, je referme la porte et je le note", "Je la laisse, ça facilite le passage", "Je la démonte", "Je mets une seconde cale"], "a": [0], "e": "Une porte coupe-feu calée ne peut plus arrêter le feu ni les fumées."},
  {"t": "Rôles et missions de l'agent", "q": "La levée de doute consiste à :", "o": ["Aller reconnaître la zone en alarme pour confirmer ou non le sinistre", "Appeler les pompiers sans vérifier", "Réarmer l'ECS immédiatement", "Évacuer tout le bâtiment"], "a": [0], "e": "Elle se fait rapidement, pendant la temporisation de l'alarme générale, en restant joignable."},
  {"t": "Rôles et missions de l'agent", "q": "La levée de doute confirme un feu. Que faites-vous ?", "o": ["Je fais alerter les secours et déclencher l'alarme générale, puis j'attaque le feu si possible", "Je réarme le système", "Je retourne au PC sans rien dire", "J'attends la fin de la temporisation sans agir"], "a": [0], "e": "Alerte, alarme, attaque avec les moyens adaptés, puis accueil des secours."},
  {"t": "Rôles et missions de l'agent", "q": "À l'arrivée des sapeurs-pompiers, l'agent SSIAP 1 :", "o": ["Les accueille, les guide, les informe et se met à leur disposition", "Rentre chez lui", "Leur demande une pièce d'identité", "Continue sa ronde"], "a": [0], "e": "Il donne la localisation, la nature du sinistre, les victimes éventuelles, les plans et les clés."},
  {"t": "Rôles et missions de l'agent", "q": "Le COS est :", "o": ["Le commandant des opérations de secours", "Le chef d'équipe SSIAP 2", "Le directeur de l'établissement", "Le coordinateur de sécurité"], "a": [0], "e": "C'est l'officier sapeur-pompier qui dirige les opérations sur place."},
  {"t": "Rôles et missions de l'agent", "q": "Pour entrer en formation SSIAP 1, il faut notamment :", "o": ["Une attestation de secourisme valide (SST, PSC1 ou PSE)", "Le permis de conduire", "Le baccalauréat", "Avoir 25 ans"], "a": [0], "e": "Il faut aussi un certificat médical d'aptitude et savoir renseigner une main courante."},
  {"t": "Rôles et missions de l'agent", "q": "Le certificat médical exigé pour la formation SSIAP 1 doit dater de moins de :", "o": ["3 mois", "1 an", "6 mois", "1 mois"], "a": [0], "e": "Le médecin se prononce simplement « apte » ou « inapte »."},
  {"t": "Rôles et missions de l'agent", "q": "La formation initiale SSIAP 1 dure au minimum :", "o": ["67 heures (hors examen)", "35 heures", "120 heures", "15 heures"], "a": [0], "e": "Elle est complétée par l'examen (QCM et épreuve pratique)."},
  {"t": "Rôles et missions de l'agent", "q": "L'examen SSIAP 1 comporte :", "o": ["Un QCM de 30 questions et une épreuve pratique de ronde", "Un oral de 1 heure uniquement", "Un mémoire écrit", "Un test sportif"], "a": [0], "e": "La ronde comprend des anomalies et un sinistre, et se termine par une inscription sur la main courante."},
  {"t": "Rôles et missions de l'agent", "q": "Pour réussir le QCM de l'examen SSIAP 1, il faut obtenir au minimum :", "o": ["12 sur 20", "10 sur 20", "15 sur 20", "8 sur 20"], "a": [0], "e": "Soit 18 bonnes réponses sur 30."},
  {"t": "Rôles et missions de l'agent", "q": "Un agent SSIAP 1 doit suivre un recyclage :", "o": ["Tous les 3 ans", "Tous les ans", "Tous les 5 ans", "Jamais"], "a": [0], "e": "Sans recyclage dans les délais, il doit suivre une remise à niveau."},
  {"t": "Rôles et missions de l'agent", "q": "Un agent dont le dernier recyclage date de plus de 3 ans doit suivre :", "o": ["Une remise à niveau", "Rien du tout", "Une formation SSIAP 3", "Un simple entretien"], "a": [0], "e": "La remise à niveau est plus longue que le recyclage."},
  {"t": "Rôles et missions de l'agent", "q": "Le chef d'équipe de sécurité incendie est titulaire du :", "o": ["SSIAP 2", "SSIAP 1", "SSIAP 3", "CQP APS"], "a": [0], "e": "SSIAP 1 : agent. SSIAP 2 : chef d'équipe. SSIAP 3 : chef de service."},
  {"t": "Rôles et missions de l'agent", "q": "Le chef de service de sécurité incendie est titulaire du :", "o": ["SSIAP 3", "SSIAP 2", "SSIAP 1", "PSE 2"], "a": [0], "e": "Il encadre le service et conseille l'exploitant."},
  {"t": "Rôles et missions de l'agent", "q": "Le diplôme SSIAP 1 permet d'exercer :", "o": ["Dans les ERP et les IGH", "Uniquement dans les IGH", "Uniquement dans les hôpitaux", "Uniquement en extérieur"], "a": [0], "e": "L'agent travaille dans les établissements soumis à un service de sécurité incendie."},
  {"t": "Rôles et missions de l'agent", "q": "La sensibilisation des employés consiste notamment à :", "o": ["Leur apprendre à utiliser un extincteur et à réagir lors d'une évacuation", "Les surveiller", "Contrôler leurs horaires", "Leur faire passer le SSIAP"], "a": [0], "e": "C'est une des missions de l'agent : un personnel formé réagit plus vite."},
  {"t": "Rôles et missions de l'agent", "q": "Le PC de sécurité (poste central de sécurité) est :", "o": ["Le local où sont centralisés les reports du SSI et les moyens de communication", "Le bureau du directeur", "Le local de stockage des extincteurs", "Le parking des pompiers"], "a": [0], "e": "C'est le cœur du service : il ne doit pas être utilisé à d'autres fins."},
  {"t": "Rôles et missions de l'agent", "q": "Face à une victime, l'ordre des actions est :", "o": ["Protéger, alerter, secourir", "Secourir, protéger, alerter", "Alerter, secourir, protéger", "Secourir uniquement"], "a": [0], "e": "On évite d'abord le suraccident, puis on alerte, puis on porte secours."},
  {"t": "Rôles et missions de l'agent", "q": "Une consigne particulière concerne :", "o": ["Un local, un poste ou un risque précis", "Tout l'établissement de façon générale", "Uniquement le public", "Uniquement les pompiers"], "a": [0], "e": "La consigne générale, elle, s'applique à l'ensemble de l'établissement."},
  {"t": "Rôles et missions de l'agent", "q": "Lors d'une évacuation, une personne en fauteuil roulant se trouve à l'étage. L'agent :", "o": ["L'accompagne vers un espace d'attente sécurisé et signale sa position aux secours", "La laisse sur place sans rien dire", "La fait descendre par l'ascenseur", "Lui demande d'attendre la fin de l'alerte"], "a": [0], "e": "Les secours doivent savoir où se trouvent les personnes qui attendent une évacuation différée."},
  {"t": "Rôles et missions de l'agent", "q": "L'assistance à personnes consiste à :", "o": ["Porter secours aux victimes en attendant les secours spécialisés", "Servir de guide touristique", "Remplacer le médecin", "Transporter les blessés à l'hôpital"], "a": [0], "e": "D'où l'obligation d'une formation de secourisme valide."},
  {"t": "Le feu et ses conséquences", "q": "La pyrolyse, c'est :", "o": ["La décomposition d'un matériau par la chaleur, qui libère des gaz combustibles", "L'extinction par l'eau", "La propagation par les gaines", "Un type d'extincteur"], "a": [0], "e": "Un matériau chauffé dégage des gaz inflammables avant même de s'enflammer : c'est ce qui alimente les flammes."},
  {"t": "Le feu et ses conséquences", "q": "Une combustion lente (rouille, feu couvant) se caractérise par :", "o": ["Peu ou pas de flammes et un dégagement de chaleur faible", "De grandes flammes", "Une explosion", "L'absence totale de fumée"], "a": [0], "e": "La combustion vive produit des flammes ; l'explosion est une combustion extrêmement rapide."},
  {"t": "Le feu et ses conséquences", "q": "Une explosion est :", "o": ["Une combustion extrêmement rapide avec une onde de pression", "Une combustion lente", "Un feu de classe A", "Un feu couvant"], "a": [0], "e": "Elle survient notamment quand un mélange gaz-air est entre sa LIE et sa LSE."},
  {"t": "Le feu et ses conséquences", "q": "Sous l'effet d'un incendie, une structure en acier :", "o": ["Se dilate et perd sa résistance mécanique", "Devient plus solide", "Ne subit aucun effet", "Devient incombustible puis combustible"], "a": [0], "e": "L'acier ne brûle pas, mais il se déforme et perd sa résistance avec la chaleur, d'où les risques d'effondrement."},
  {"t": "Le feu et ses conséquences", "q": "Quels sont les produits de la combustion ?", "o": ["Des flammes", "De la chaleur", "Des fumées et des gaz", "De l'oxygène pur"], "a": [0, 1, 2], "e": "La combustion consomme de l'oxygène, elle n'en produit pas."},
  {"t": "Le feu et ses conséquences", "q": "Pour utiliser un extincteur à pression auxiliaire, l'ordre correct est :", "o": ["Dégoupiller, percuter, attendre quelques secondes, attaquer à la base des flammes", "Percuter, attaquer, puis dégoupiller", "Attaquer, puis dégoupiller", "Retourner l'extincteur puis secouer"], "a": [0], "e": "On s'approche progressivement et on éteint par balayage."},
  {"t": "Le feu et ses conséquences", "q": "Après avoir utilisé un extincteur, même partiellement :", "o": ["On ne le remet pas en place : on le signale pour le faire recharger", "On le remet à sa place", "On le jette", "On le revisse simplement"], "a": [0], "e": "Un extincteur entamé peut être vide au prochain feu."},
  {"t": "Le feu et ses conséquences", "q": "Une fois le feu éteint, l'agent :", "o": ["Surveille les lieux pour éviter une reprise de feu", "Part immédiatement", "Rouvre toutes les portes", "Réarme le SSI sans prévenir"], "a": [0], "e": "Un feu peut couver et repartir, surtout dans les matériaux de classe A."},
  {"t": "Sécurité incendie", "q": "Une voie engins est :", "o": ["Une voie accessible aux véhicules de secours, d'une hauteur libre d'au moins 3,50 m", "Une voie piétonne", "Un couloir intérieur", "Un escalier de secours"], "a": [0], "e": "Elle doit rester libre en permanence : aucun stationnement gênant."},
  {"t": "Sécurité incendie", "q": "La largeur minimale de la chaussée d'une voie échelles est de :", "o": ["4 mètres", "2 mètres", "8 mètres", "10 mètres"], "a": [0], "e": "La voie échelles est une partie de voie engins renforcée pour mettre en station les échelles aériennes."},
  {"t": "Sécurité incendie", "q": "Au sujet des voies réservées aux secours, l'agent SSIAP 1 doit :", "o": ["Veiller à ce qu'elles restent libres (pas de véhicules, pas d'obstacles)", "Y garer les véhicules de livraison", "Les fermer la nuit", "Les utiliser comme parking du personnel"], "a": [0], "e": "C'est la vacuité des dessertes : un camion de pompiers bloqué, ce sont des minutes perdues."},
  {"t": "Sécurité incendie", "q": "Une façade accessible comporte :", "o": ["Des baies permettant aux pompiers de pénétrer dans le bâtiment", "Uniquement des murs pleins", "Des fenêtres condamnées", "Des panneaux publicitaires"], "a": [0], "e": "Les baies accessibles ne doivent pas être obstruées (grilles, stores fixes, enseignes)."},
  {"t": "Sécurité incendie", "q": "Un poteau d'incendie normalisé de 100 mm fournit classiquement :", "o": ["60 m³/h pendant 2 heures", "10 m³/h pendant 1 heure", "200 m³/h pendant 10 minutes", "1 m³/h"], "a": [0], "e": "C'est la valeur de référence enseignée pour la défense extérieure contre l'incendie."},
  {"t": "Sécurité incendie", "q": "Un local à risques importants (chaufferie, grande réserve…) est isolé par :", "o": ["Des parois coupe-feu 2 heures et une porte coupe-feu 1 heure avec ferme-porte", "Une simple cloison", "Un rideau", "Une porte vitrée"], "a": [0], "e": "Parois REI/EI 120 et bloc-porte EI 60 muni d'un ferme-porte."},
  {"t": "Sécurité incendie", "q": "Un local à risques moyens est isolé par :", "o": ["Des parois coupe-feu 1 heure et une porte coupe-feu 1/2 heure avec ferme-porte", "Des parois coupe-feu 2 heures", "Aucune paroi particulière", "Un rideau métallique"], "a": [0], "e": "Parois REI/EI 60 et bloc-porte EI 30 muni d'un ferme-porte."},
  {"t": "Sécurité incendie", "q": "Quel local est généralement classé à risques ?", "o": ["Une chaufferie", "Un bureau", "Un couloir", "Un hall d'accueil"], "a": [0], "e": "Chaufferies, réserves, locaux poubelles, ateliers… Leurs portes doivent rester fermées."},
  {"t": "Sécurité incendie", "q": "Le cloisonnement traditionnel consiste à :", "o": ["Séparer les locaux des circulations par des parois et portes résistant au feu", "Supprimer toutes les cloisons", "Mettre des rideaux entre les locaux", "Ouvrir les portes en grand"], "a": [0], "e": "Il protège les circulations, qui servent à l'évacuation."},
  {"t": "Sécurité incendie", "q": "Un escalier encloisonné est :", "o": ["Un escalier protégé par des parois et des portes résistant au feu", "Un escalier extérieur", "Un escalier mécanique", "Un escalier sans porte"], "a": [0], "e": "Il reste praticable pendant l'évacuation et sert aux pompiers pour l'attaque."},
  {"t": "Sécurité incendie", "q": "Les escaliers encloisonnés sont désenfumés grâce à :", "o": ["Un ouvrant en partie haute d'au moins 1 m²", "Un ventilateur au rez-de-chaussée", "Des fenêtres fermées", "Un sprinkler"], "a": [0], "e": "L'ouvrant se commande depuis le niveau d'accès des secours."},
  {"t": "Sécurité incendie", "q": "La règle du « C + D » sert à limiter :", "o": ["La propagation du feu d'un étage à l'autre par la façade", "Le nombre de clients", "La largeur des couloirs", "La durée des rondes"], "a": [0], "e": "C = distance verticale entre deux baies, D = saillie (balcon, auvent) qui casse les flammes."},
  {"t": "Sécurité incendie", "q": "Un local accessible au public doit être désenfumé lorsqu'il dépasse :", "o": ["300 m² en rez-de-chaussée ou en étage, 100 m² en sous-sol", "50 m² partout", "1 000 m² en étage", "Il n'est jamais désenfumé"], "a": [0], "e": "Le sous-sol est plus pénalisant : les fumées s'y évacuent mal."},
  {"t": "Sécurité incendie", "q": "Les dégagements doivent être :", "o": ["Répartis, signalés, éclairés et libres en permanence", "Fermés à clé hors des heures d'ouverture même avec du public", "Encombrés si le magasin est plein", "Réservés au personnel"], "a": [0], "e": "Pendant la présence du public, les portes de sortie doivent s'ouvrir par une manœuvre simple."},
  {"t": "Sécurité incendie", "q": "Un dégagement accessoire est :", "o": ["Un dégagement supplémentaire, non pris en compte dans le calcul réglementaire", "Un dégagement interdit au public", "Le dégagement principal", "Un local de rangement"], "a": [0], "e": "Les dégagements normaux sont ceux qui comptent dans le calcul du nombre et de la largeur."},
  {"t": "Sécurité incendie", "q": "L'évacuation différée concerne surtout :", "o": ["Les établissements où le public ne peut pas évacuer seul (soins, personnes âgées)", "Les magasins", "Les bureaux", "Les restaurants"], "a": [0], "e": "Dans les types U et J, on transfère les personnes vers une zone protégée plutôt que de tout évacuer d'un coup."},
  {"t": "Sécurité incendie", "q": "Le signal sonore d'alarme générale est :", "o": ["Un son d'évacuation normalisé, différent des autres signaux", "Une sonnerie de téléphone", "Une musique d'ambiance", "Laissé au choix de l'agent"], "a": [0], "e": "Tout le monde doit pouvoir le reconnaître comme un ordre d'évacuer."},
  {"t": "Sécurité incendie", "q": "Dans un ERP, il faut au minimum un extincteur à eau pulvérisée de 6 litres pour :", "o": ["200 m² et par niveau", "1 000 m²", "Chaque local", "500 m² par bâtiment"], "a": [0], "e": "Plus des extincteurs adaptés aux risques particuliers (CO2 près des armoires électriques…)."},
  {"t": "Sécurité incendie", "q": "Un extincteur doit être vérifié au minimum :", "o": ["Une fois par an", "Une fois tous les 10 ans", "Une fois par mois par un organisme agréé", "Jamais"], "a": [0], "e": "La vérification est faite par un technicien compétent et notée dans le registre de sécurité."},
  {"t": "Sécurité incendie", "q": "Un extincteur mural est fixé de sorte que sa poignée soit au maximum à :", "o": ["1,20 mètre du sol", "2 mètres du sol", "0,20 mètre du sol", "1,80 mètre du sol"], "a": [0], "e": "Il doit être visible, signalé, accessible et facile à décrocher."},
  {"t": "Sécurité incendie", "q": "Le flux lumineux minimal d'un BAES d'évacuation est de :", "o": ["45 lumens", "5 lumens", "500 lumens", "1 lumen"], "a": [0], "e": "Les BAES d'ambiance, eux, assurent au moins 5 lumens par m² de surface."},
  {"t": "Sécurité incendie", "q": "Le système SATI sur des BAES permet :", "o": ["De tester automatiquement le bon fonctionnement des blocs", "D'éteindre le feu", "De diffuser l'alarme", "De désenfumer"], "a": [0], "e": "SATI : système automatique de test intégré. L'agent relève les défauts signalés par les voyants."},
  {"t": "Sécurité incendie", "q": "Le plan d'intervention est destiné :", "o": ["Aux sapeurs-pompiers", "Au public", "Aux clients", "Aux fournisseurs"], "a": [0], "e": "Il indique les accès, les locaux à risques, les organes de coupure et les moyens de secours."},
  {"t": "Installations techniques", "q": "Une personne est bloquée dans un ascenseur. L'agent :", "o": ["La rassure, reste en contact et fait appel à l'ascensoriste (ou aux pompiers si besoin)", "Force les portes palières lui-même", "Coupe l'électricité générale du bâtiment", "La laisse attendre sans contact"], "a": [0], "e": "Une manœuvre de dépannage ne peut être faite que par une personne formée et autorisée."},
  {"t": "Installations techniques", "q": "Un ascenseur doit être équipé :", "o": ["D'un dispositif d'alarme permettant de communiquer avec l'extérieur", "D'un extincteur dans la cabine", "D'un sprinkler", "D'un détecteur de flammes"], "a": [0], "e": "La téléalarme relie la cabine à un service d'intervention 24 h sur 24."},
  {"t": "Installations techniques", "q": "En cas d'incendie, les escaliers mécaniques :", "o": ["Sont arrêtés", "Accélèrent pour évacuer plus vite", "Changent de sens", "Restent en marche normale"], "a": [0], "e": "Un bouton d'arrêt d'urgence permet aussi de les stopper en cas d'accident."},
  {"t": "Installations techniques", "q": "Une nacelle d'entretien de façade, hors utilisation :", "o": ["Est garée à sa position de repos sans gêner l'évacuation ni les secours", "Peut rester devant les baies accessibles", "Sert de parking", "Reste au dernier étage en permanence"], "a": [0], "e": "Elle ne doit pas obstruer les baies que les pompiers utilisent."},
  {"t": "Installations techniques", "q": "L'électrocution désigne :", "o": ["Une électrisation qui entraîne la mort", "Une simple décharge sans conséquence", "Une coupure de courant", "Un court-circuit"], "a": [0], "e": "L'électrisation est le passage du courant dans le corps ; l'électrocution est une électrisation mortelle."},
  {"t": "Installations techniques", "q": "Face à une victime électrisée encore en contact avec le courant, on :", "o": ["Coupe le courant avant de la toucher", "La tire immédiatement à mains nues", "L'arrose d'eau", "Attend qu'elle se dégage seule"], "a": [0], "e": "Sinon, le sauveteur devient la deuxième victime."},
  {"t": "Installations techniques", "q": "Le dispositif de coupure générale électrique doit être :", "o": ["Accessible et signalé", "Caché au public et au personnel", "Fermé à clé sans double", "Placé sur le toit"], "a": [0], "e": "Les pompiers doivent pouvoir le trouver et l'actionner rapidement."},
  {"t": "Installations techniques", "q": "Un local de transformateur haute tension :", "o": ["Est interdit d'accès aux personnes non habilitées", "Peut servir de réserve", "Peut rester ouvert", "Doit être arrosé en cas de feu"], "a": [0], "e": "Danger électrique majeur : on n'y entre pas et on ne l'arrose jamais."},
  {"t": "Installations techniques", "q": "Sur une installation sprinkler, la vanne principale du poste de contrôle doit être :", "o": ["Ouverte en permanence (cadenassée ou plombée)", "Fermée hors des heures d'ouverture", "Ouverte seulement en cas de feu", "Démontée la nuit"], "a": [0], "e": "Une vanne fermée rend toute l'installation inutile. C'est un point de ronde."},
  {"t": "Installations techniques", "q": "Après un déclenchement de sprinkler, la vanne d'alimentation :", "o": ["N'est refermée que sur ordre des sapeurs-pompiers", "Est refermée tout de suite par l'agent", "Est refermée par le public", "Ne se referme jamais"], "a": [0], "e": "Fermer trop tôt peut laisser le feu repartir."},
  {"t": "Installations techniques", "q": "Quand un sprinkler fonctionne, l'alarme est souvent donnée par :", "o": ["Un gong hydraulique", "Un sifflet", "Une sonnerie de téléphone", "Rien du tout"], "a": [0], "e": "L'écoulement d'eau actionne le gong et un report d'alarme vers le poste de sécurité."},
  {"t": "Installations techniques", "q": "Lors de travaux, des détecteurs sont mis hors service. L'agent :", "o": ["Renforce la surveillance de la zone et veille à leur remise en service à la fin", "Laisse les détecteurs coupés", "Coupe tout le SSI", "Ne fait rien"], "a": [0], "e": "La mise hors service se note sur la main courante, comme la remise en service."},
  {"t": "Rôles et missions de l'agent", "q": "Pendant des travaux par points chauds, il faut :", "o": ["Un extincteur adapté à proximité immédiate", "Couper tous les BAES", "Retirer les extincteurs", "Ouvrir les portes coupe-feu"], "a": [0], "e": "On protège aussi les matériaux combustibles proches et on surveille après la fin des travaux."},
  {"t": "Rôles et missions de l'agent", "q": "Le permis de feu est signé par :", "o": ["Le donneur d'ordre et l'entreprise qui réalise les travaux", "Uniquement le public", "Le maire", "Personne"], "a": [0], "e": "Il est établi avant les travaux et précise les précautions de chaque partie."},
  {"t": "Rôles et missions de l'agent", "q": "Pour faciliter l'arrivée des secours, l'agent :", "o": ["Fait ouvrir les accès, dégage les voies et envoie quelqu'un au-devant d'eux", "Ferme le portail", "Attend au PC sans bouger", "Fait évacuer par les voies pompiers en voiture"], "a": [0], "e": "Chaque minute gagnée à l'accueil est une minute gagnée sur le feu."},
  {"t": "Rôles et missions de l'agent", "q": "On trouve notamment au poste de sécurité :", "o": ["Les plans, les consignes et les clés", "Le registre de sécurité ou les moyens de le consulter", "Les reports du SSI", "Le stock de marchandises"], "a": [0, 1, 2], "e": "Le PC doit aussi disposer d'un téléphone pour appeler les secours."},
  {"t": "Rôles et missions de l'agent", "q": "Le poste de sécurité doit disposer :", "o": ["D'une liaison téléphonique pour appeler les sapeurs-pompiers", "D'une télévision", "D'une caisse enregistreuse", "D'un accès réservé au public"], "a": [0], "e": "L'appel des secours doit pouvoir se faire sans délai."},
  {"t": "Rôles et missions de l'agent", "q": "Dans un IGH, le poste central de sécurité est :", "o": ["Occupé en permanence", "Occupé seulement la journée", "Fermé le week-end", "Facultatif"], "a": [0], "e": "L'IGH dispose toujours d'un service de sécurité incendie."},
  {"t": "Rôles et missions de l'agent", "q": "Les vêtements de travail de l'agent du service de sécurité incendie portent au niveau du buste la mention :", "o": ["« Sécurité incendie »", "« Police »", "« Pompier »", "« Surveillance »"], "a": [0], "e": "Le public et les secours doivent pouvoir l'identifier rapidement."},
  {"t": "Rôles et missions de l'agent", "q": "Un agent SSIAP qui n'a pas exercé au moins 1 607 heures sur les 36 derniers mois doit :", "o": ["Suivre une remise à niveau", "Repasser tout le SSIAP 1", "Ne rien faire", "Passer le SSIAP 2"], "a": [0], "e": "C'est la condition fixée par l'arrêté du 2 mai 2005 pour reprendre un poste."},
  {"t": "Rôles et missions de l'agent", "q": "Le personnel du service de sécurité incendie :", "o": ["Ne peut pas être distrait de ses missions spécifiques", "Peut tenir la caisse en même temps", "Peut être affecté au rayon", "Peut s'absenter du PC librement"], "a": [0], "e": "Ses missions de sécurité passent avant tout."},
  {"t": "Rôles et missions de l'agent", "q": "Face à une hémorragie externe, le premier geste est :", "o": ["La compression directe de la plaie", "Donner à boire", "Mettre la victime debout", "Attendre les secours sans agir"], "a": [0], "e": "On appuie fort sur la plaie, on allonge la victime et on alerte."},
  {"t": "Rôles et missions de l'agent", "q": "Une victime inconsciente qui respire est placée :", "o": ["En position latérale de sécurité (PLS)", "Sur le dos, jambes surélevées", "Assise", "Debout"], "a": [0], "e": "La PLS évite que la langue ou des vomissements bloquent les voies aériennes."},
  {"t": "Rôles et missions de l'agent", "q": "Une victime inconsciente qui ne respire pas :", "o": ["On alerte, on commence la réanimation cardio-pulmonaire et on utilise un défibrillateur", "On la met en PLS", "On attend", "On lui donne à boire"], "a": [0], "e": "Le défibrillateur automatisé externe (DAE) peut être utilisé par n'importe qui : il guide vocalement."},
  {"t": "Rôles et missions de l'agent", "q": "Face à une brûlure thermique, on :", "o": ["Refroidit immédiatement la zone à l'eau tempérée", "Applique de la glace directement", "Met du beurre ou de la crème", "Perce les cloques"], "a": [0], "e": "On refroidit le plus vite possible, puis on alerte selon la gravité."},
  {"t": "Rôles et missions de l'agent", "q": "Un adulte conscient s'étouffe et ne peut plus parler ni tousser. On :", "o": ["Donne des claques dans le dos puis des compressions abdominales", "Lui donne à boire", "L'allonge sur le dos", "Attend qu'il se dégage seul"], "a": [0], "e": "On alterne 5 claques dans le dos et 5 compressions abdominales jusqu'à la désobstruction."},
  {"t": "Rôles et missions de l'agent", "q": "Lors de l'épreuve pratique de ronde, le candidat doit à la fin :", "o": ["Renseigner la main courante sur une anomalie constatée", "Rédiger un mémoire", "Passer un oral de 30 minutes", "Éteindre un feu réel"], "a": [0], "e": "La ronde comporte des anomalies, la découverte d'un sinistre et des questions du jury."}
] };
</script>
<script>
const META = window.SSIAP_META || [];
const DATA = window.SSIAP_MODULES || {};
const KEY_STATS="ssiap1c_stats", KEY_EX="ssiap1c_exams", KEY_SES="ssiap1c_session", KEY_SET="ssiap1c_settings", KEY_DAY="ssiap1c_days";
const EXAM_N=30, EXAM_MIN=30, PASS=12, SMART_N=20, PAUSE_MIN=45;
const NONE=/^aucune?s? (des |de ces )?réponses? précédentes?\.?$/i;

function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function drop(k){try{localStorage.removeItem(k)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const plural=(n,w)=>n+" "+w+(n>1?"s":"");
const bonnes=n=>n+" bonne"+(n>1?"s":"")+" réponse"+(n>1?"s":"");
const n20txt=v=>String(v).replace(".",",");
function same(a,b){return [...a].sort().join()===[...b].sort().join()}
function dayKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

/* ---------- Réglages ---------- */
const SET=Object.assign({size:1,auto:true,exam:""},load(KEY_SET,{}));
function saveSet(){save(KEY_SET,SET)}
function applySize(){document.documentElement.className=SET.size>1?"t"+SET.size:""}
applySize();
function daysLeft(){
  if(!SET.exam)return null;
  const [y,m,d]=SET.exam.split("-").map(Number);if(!y)return null;
  const t=new Date();t.setHours(0,0,0,0);
  return Math.round((new Date(y,m-1,d)-t)/86400000);
}

/* ---------- Questions ---------- */
const QS=[], problems=[], seenIds=new Set();
const isComp=id=>{const m=META.find(x=>x.id===id);return !!(m&&m.complement)};
META.forEach(m=>{
  const d=DATA[m.id];if(!d||!Array.isArray(d.questions))return;
  d.questions.forEach((r,i)=>{
    const ok=r&&typeof r.q==="string"&&Array.isArray(r.o)&&r.o.length>=2&&Array.isArray(r.a)&&r.a.length>0&&r.a.every(x=>Number.isInteger(x)&&x>=0&&x<r.o.length);
    if(!ok){problems.push(m.id+" n°"+(i+1));return}
    const id=hash(r.q+"|"+[...r.o].sort().join("|"));
    if(seenIds.has(id))return;seenIds.add(id);
    QS.push({id,mod:m.id,t:r.t||"",q:r.q,o:r.o,a:r.a,e:r.e||""});
  });
});
const BY_ID=Object.fromEntries(QS.map(q=>[q.id,q]));
const OFFICIAL=QS.filter(q=>!isComp(q.mod));
const metaOf=id=>META.find(x=>x.id===id)||{id,title:id,short:id};
function errorIds(){const st=load(KEY_STATS,{});return Object.keys(st).filter(id=>st[id].last===0&&BY_ID[id])}
function optionOrder(q){
  const idx=q.o.map((_,i)=>i),none=idx.filter(i=>NONE.test(q.o[i].trim()));
  return shuffle(idx.filter(i=>!none.includes(i))).concat(none);
}
function record(q,ok){
  const st=load(KEY_STATS,{}),s=st[q.id]||{ok:0,ko:0,last:0};
  if(ok)s.ok++;else s.ko++;s.last=ok?1:0;s.t=Date.now();st[q.id]=s;save(KEY_STATS,st);
  const days=load(KEY_DAY,{}),k=dayKey();days[k]=(days[k]||0)+1;save(KEY_DAY,days);
}
function streak(){
  const days=load(KEY_DAY,{}),d=new Date();let n=0;
  if(!days[dayKey(d)])d.setDate(d.getDate()-1);
  while(days[dayKey(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}

/* ---------- Rendu ---------- */
const app=document.getElementById("app");
function paint(html,top){app.innerHTML=html;if(top&&window.scrollTo)window.scrollTo(0,0)}
let S=null,tick=null,armed=false,resetArmed=false,confirmOpen=false,autoT=null,wake=null;
async function keepAwake(on){
  try{
    if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}
    if(!on&&wake){await wake.release();wake=null}
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S)keepAwake(true)});
function stopAll(){clearInterval(tick);clearTimeout(autoT);keepAwake(false)}

/* ---------- Accueil ---------- */
function home(){
  S=null;stopAll();armed=false;resetArmed=false;confirmOpen=false;
  const st=load(KEY_STATS,{}),exams=load(KEY_EX,[]),errs=errorIds().length,days=load(KEY_DAY,{});
  const nOff=OFFICIAL.length,nAll=QS.length,nComp=nAll-nOff;
  let mastered=0,seen=0;OFFICIAL.forEach(q=>{const s=st[q.id];if(s){seen++;if(s.last===1)mastered++}});
  const today=days[dayKey()]||0,str=streak(),left=daysLeft();
  const toGo=nOff-mastered;
  const perDay=left!==null&&left>0?Math.ceil(toGo/left):null;

  let chip;
  if(left===null||left<0)chip=`<button class="chip" id="chip">Date d'examen</button>`;
  else if(left===0)chip=`<button class="chip set" id="chip"><b>Jour J</b></button>`;
  else chip=`<button class="chip set" id="chip">J-<b>${left}</b></button>`;

  const goal=perDay!==null
    ?`<div class="fact"><b class="num">${perDay}</b><span>à maîtriser par jour d'ici l'examen</span></div>`
    :`<div class="fact"><b>${left===0?"Jour J":"–"}</b><span>${left===0?"Bon courage":"Fixe ta date d'examen en bas"}</span></div>`;

  const last=exams[exams.length-1];
  let sheet="",cap="Aucun examen blanc pour l'instant.";
  for(let i=0;i<EXAM_N;i++){const v=last&&last.r?last.r[i]:undefined;sheet+=`<i class="${v===1?"r":v===0?"w":""}"></i>`}
  if(last){const v=Math.round(last.c/last.n*200)/10;cap=`Dernier examen : <b class="num">${n20txt(v)}/20</b>, le ${new Date(last.d).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}.`}

  const ses=load(KEY_SES,null);
  const sesOk=ses&&Array.isArray(ses.items)&&ses.items.length&&ses.items.every(x=>BY_ID[x.id]);
  const resume=sesOk?`<div class="resume"><div><b>Reprendre : ${esc(ses.label)}</b><small class="num">${ses.master.length}/${ses.total} réussies</small></div>
    <button class="btn" id="resume">Reprendre</button><button class="x" id="drop">Abandonner</button></div>`:"";

  const rows=META.map(m=>{
    const qs=QS.filter(q=>q.mod===m.id),n=qs.length;if(m.complement&&!n)return "";
    let sn=0,ok=0;qs.forEach(q=>{const s=st[q.id];if(s){sn++;if(s.last===1)ok++}});
    const pct=n?Math.round(ok/n*100):0;
    return `<button class="mod${m.complement?" comp":""}${pct===100?" done":""}" ${n?`data-mod="${esc(m.id)}"`:"disabled"}>
      <span class="id">${m.complement?"+":esc(m.id)}</span>
      <span><span class="tl">${esc(m.title)}</span><span class="mm num">${ok}/${n} maîtrisées${m.complement?", à vérifier avec ton formateur":""}</span></span>
      <span class="st">${sn?`<span class="pc num">${pct} %</span><span class="bar"><span style="width:${pct}%"></span></span>`:`<span class="pc none">À faire</span>`}</span>
    </button>`}).join("");

  const hist=exams.slice(-5).reverse().map(x=>{const v=Math.round(x.c/x.n*200)/10;
    return `<li><span>${new Date(x.d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}, ${new Date(x.d).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</span><span class="num ${v>=PASS?"ok":"ko"}">${n20txt(v)}/20</span></li>`}).join("");

  paint(`
  <header class="brand"><h1>SSIAP 1</h1>${chip}</header>
  ${problems.length?`<p class="warn">Questions ignorées car mal formées : ${esc(problems.join(", "))}.</p>`:""}
  <section class="today">
    <div class="big"><strong class="num">${mastered}</strong><span class="num">sur ${nOff} questions maîtrisées</span></div>
    <div class="track" aria-hidden="true"><i class="m" style="width:${mastered/nOff*100}%"></i><i class="s" style="width:${(seen-mastered)/nOff*100}%"></i></div>
    <div class="facts">
      <div class="fact"><b class="num">${today}</b><span>réponses aujourd'hui</span></div>
      <div class="fact"><b class="num">${str}</b><span>jour${str>1?"s":""} d'affilée</span></div>
      ${goal}
    </div>
    <button class="btn" id="go-smart" ${nOff?"":"disabled"}>Séance de ${SMART_N} questions</button>
    <p class="hint">${errs?"Tes erreurs d'abord, puis":"D'abord"} les questions jamais vues, puis celles revues il y a le plus longtemps.</p>
  </section>
  ${resume}
  <section class="block">
    <div class="exam">
      <div class="t"><h4>Examen blanc</h4><p>${EXAM_N} questions tirées dans tous les modules, ${EXAM_MIN} minutes, correction à la fin. Il faut ${PASS}/20 pour valider.</p></div>
      <div class="sheet" aria-hidden="true">${sheet}</div>
      <div class="sheet-cap">${cap}</div>
      <button class="btn" id="go-exam" ${nAll?"":"disabled"}>Commencer l'examen</button>
    </div>
  </section>
  <section class="block">
    <h3>Tout réviser</h3>
    <div class="modes">
      <button class="mode" id="go-off" ${nOff?"":"disabled"}><span class="n num">${nOff}</span><span class="tt">Toutes les questions</span><span class="s">Les 9 modules, sans le complément</span></button>
      <button class="mode" id="go-all" ${nComp?"":"disabled"}><span class="n num">${nAll}</span><span class="tt">Questions + complément</span><span class="s">Avec les ${nComp} questions en plus</span></button>
      <button class="mode wide" id="go-err" ${errs?"":"disabled"}><span class="n num">${errs}</span><span class="tt">Revoir mes erreurs</span><span class="s">${errs?"Les questions ratées la dernière fois":"Rien à revoir pour l'instant"}</span></button>
    </div>
  </section>
  <section class="block">
    <h3>Par module</h3>
    <div class="mods">${rows||'<p style="padding:16px;margin:0">Aucun module chargé.</p>'}</div>
  </section>
  ${hist?`<section class="block"><h3>Derniers examens blancs</h3><ul class="hist">${hist}</ul></section>`:""}
  <section class="block" id="settings">
    <h3>Réglages</h3>
    <div class="settings">
      <div class="set"><span>Taille du texte</span><div class="seg" role="group" aria-label="Taille du texte">
        ${[1,2,3].map(n=>`<button class="a${n}" data-size="${n}" aria-pressed="${SET.size===n}" aria-label="Taille ${n}">A</button>`).join("")}</div></div>
      <div class="set"><span>Passer à la suite après une bonne réponse<small>La correction reste affichée quand tu te trompes</small></span>
        <button class="sw" id="auto" role="switch" aria-checked="${SET.auto}" aria-label="Passage automatique"></button></div>
      <div class="set"><label for="exam-date">Date de l'examen<small>Pour le compte à rebours et l'objectif du jour</small></label>
        <input type="date" id="exam-date" value="${esc(SET.exam)}"></div>
    </div>
  </section>
  <p class="foot">En révision, la bonne réponse s'affiche tout de suite et une question ratée revient jusqu'à ce que tu la réussisses. En cas de doute, c'est le cours de ton formateur qui fait foi.<br>
  <button id="reset">Effacer ma progression</button></p>`,true);

  app.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>startModule(b.dataset.mod));
  document.getElementById("go-smart").onclick=startSmart;
  document.getElementById("go-exam").onclick=startExam;
  document.getElementById("go-off").onclick=startOfficial;
  document.getElementById("go-all").onclick=startEverything;
  document.getElementById("go-err").onclick=startErrors;
  document.getElementById("chip").onclick=()=>{const i=document.getElementById("exam-date");i.scrollIntoView({block:"center",behavior:"smooth"});setTimeout(()=>{i.focus();if(i.showPicker)try{i.showPicker()}catch(e){}},350)};
  if(sesOk){document.getElementById("resume").onclick=()=>resumeSession(ses);document.getElementById("drop").onclick=()=>{drop(KEY_SES);home()}}
  app.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{SET.size=+b.dataset.size;saveSet();applySize();
    app.querySelectorAll("[data-size]").forEach(x=>x.setAttribute("aria-pressed",String(+x.dataset.size===SET.size)))});
  const sw=document.getElementById("auto");sw.onclick=()=>{SET.auto=!SET.auto;saveSet();sw.setAttribute("aria-checked",String(SET.auto))};
  document.getElementById("exam-date").onchange=e=>{SET.exam=e.target.value;saveSet();const y=window.scrollY;home();window.scrollTo(0,y)};
  const r=document.getElementById("reset");
  r.onclick=()=>{if(!resetArmed){resetArmed=true;r.textContent="Confirmer : tout effacer";r.style.color="var(--bad)";return}
    drop(KEY_STATS);drop(KEY_EX);drop(KEY_SES);drop(KEY_DAY);home()};
}

/* ---------- Lancement ---------- */
function startModule(id){const m=metaOf(id);train(shuffle(QS.filter(q=>q.mod===id)),m.complement?"Complément":"Module "+id+" : "+(m.short||m.title),{kind:"module",id})}
function startOfficial(){train(shuffle(OFFICIAL),"Toutes les questions",{kind:"official"})}
function startEverything(){train(shuffle(QS),"Questions + complément",{kind:"everything"})}
function startErrors(){const ids=errorIds();if(ids.length)train(shuffle(ids.map(id=>BY_ID[id])),"Mes erreurs",{kind:"errors"})}
function startSmart(){
  const st=load(KEY_STATS,{});
  const err=[],fresh=[],old=[];
  OFFICIAL.forEach(q=>{const s=st[q.id];if(!s)fresh.push(q);else if(s.last===0)err.push(q);else old.push(q)});
  old.sort((a,b)=>(st[a.id].t||0)-(st[b.id].t||0));
  const list=shuffle(err).concat(shuffle(fresh),old).slice(0,SMART_N);
  train(shuffle(list),"Séance de "+SMART_N+" questions",{kind:"smart"});
}
function restart(src){
  const k=src&&src.kind;
  if(k==="module")startModule(src.id);else if(k==="official")startOfficial();else if(k==="everything")startEverything();
  else if(k==="errors")startErrors();else if(k==="smart")startSmart();else if(k==="exam")startExam();else home();
}
function drawExam(){
  const pool=OFFICIAL.length?OFFICIAL:QS,by={};
  pool.forEach(q=>(by[q.mod]=by[q.mod]||[]).push(q));
  const N=Math.min(EXAM_N,pool.length);
  const alloc=Object.keys(by).map(m=>{const x=by[m].length/pool.length*N;return {m,n:Math.floor(x),r:x-Math.floor(x)}});
  let rest=N-alloc.reduce((s,a)=>s+a.n,0);
  shuffle(alloc).sort((a,b)=>b.r-a.r).forEach(a=>{if(rest>0){a.n++;rest--}});
  let list=[];alloc.forEach(a=>{list=list.concat(shuffle(by[a.m]).slice(0,a.n))});
  if(list.length<EXAM_N){const ids=new Set(list.map(q=>q.id));list=list.concat(shuffle(QS.filter(q=>!ids.has(q.id))).slice(0,EXAM_N-list.length))}
  return shuffle(list);
}

/* ---------- Révision ---------- */
function train(list,label,src){
  if(!list.length){home();return}
  S={mode:"train",label,src,i:0,total:list.length,master:new Set(),combo:0,start:Date.now(),brk:Date.now(),
    items:list.map(q=>({q,order:optionOrder(q),sel:[],done:false,ok:false,retry:false}))};
  persist();beginTicks();showTrain(true);
}
function beginTicks(){stopAll();armed=false;keepAwake(true);tick=setInterval(()=>S&&(S.mode==="train"?updClock():updTimer()),1000)}
function persist(){
  if(!S||S.mode!=="train")return;
  save(KEY_SES,{label:S.label,src:S.src,i:S.i,total:S.total,master:[...S.master],
    items:S.items.map(x=>({id:x.q.id,order:x.order,sel:x.sel,done:x.done,ok:x.ok,retry:x.retry}))});
}
function resumeSession(s){
  S={mode:"train",label:s.label,src:s.src,i:Math.min(s.i,s.items.length-1),total:s.total,master:new Set(s.master),combo:0,start:Date.now(),brk:Date.now(),
    items:s.items.map(x=>({q:BY_ID[x.id],order:x.order,sel:x.sel||[],done:!!x.done,ok:!!x.ok,retry:!!x.retry}))};
  beginTicks();showTrain(true);
}
function clockTxt(){const s=Math.floor((Date.now()-S.start)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?h+" h "+String(m).padStart(2,"0"):m+":"+String(x).padStart(2,"0")}
function updClock(){
  const el=document.getElementById("clock");if(el)el.textContent=clockTxt();
  if(Date.now()-S.brk>PAUSE_MIN*60000&&!document.getElementById("pause"))showTrain(false);
}
function optionsHtml(it,reveal){
  const q=it.q,multi=q.a.length>1;
  return `<div class="opts${multi?" multi":""}" role="${multi?"group":"radiogroup"}">`+it.order.map((oi,k)=>{
    let cls="opt",g="";
    if(reveal){if(q.a.includes(oi)){cls+=" good";g="✓"}else if(it.sel.includes(oi)){cls+=" bad";g="✕"}else cls+=" dim"}
    else if(it.sel.includes(oi)){cls+=" sel";g="✓"}
    return `<button class="${cls}" data-oi="${oi}" role="${multi?"checkbox":"radio"}" aria-checked="${it.sel.includes(oi)}" ${reveal?"disabled":""}><span class="mk">${g}</span><span class="txt">${esc(q.o[oi])}</span>${k<7?`<span class="key">${k+1}</span>`:""}</button>`;
  }).join("")+`</div>`;
}
function showTrain(top){
  const it=S.items[S.i],q=it.q,multi=q.a.length>1,last=S.i===S.items.length-1;
  const m=metaOf(q.mod);
  const tired=Date.now()-S.brk>PAUSE_MIN*60000;
  let fb="",nav="";
  if(it.done){
    fb=`<div class="fb ${it.ok?"ok":"ko"}"><div class="v">${it.ok?"✓ Bonne réponse":"✕ Ce n'est pas ça"}</div>
      ${it.ok?"":`<p>À retenir : <b>${esc(q.a.map(i=>q.o[i]).join(" · "))}</b>. Cette question revient juste après.</p>`}
      ${q.e?`<p>${esc(q.e)}</p>`:""}</div>`;
    nav=`<button class="btn" id="next">${last?"Voir mon résultat":"Question suivante"}</button>`;
  }else if(multi){nav=`<button class="btn" id="validate" ${it.sel.length?"":"disabled"}>Valider</button>`}
  paint(`
  <div class="bar-top"><button class="quit" id="quit">Accueil</button><span class="where num"><b>${S.master.size}</b>/${S.total} réussies</span><span class="clock num" id="clock">${clockTxt()}</span></div>
  <div class="prog"><span style="width:${S.master.size/S.total*100}%"></span></div>
  ${tired?`<div class="pause" id="pause"><span>Ça fait ${PAUSE_MIN} minutes d'affilée. Une pause de 5 minutes aide à mieux retenir.</span><button id="pause-ok">C'est noté</button></div>`:""}
  <p class="qmeta"><span>${m.complement?"Complément":"Module "+esc(q.mod)}</span><span>${multi?"Plusieurs réponses possibles":"Une seule réponse"}${it.retry?", deuxième essai":""}</span>${S.combo>=3?`<span class="streak num">${S.combo} de suite</span>`:""}</p>
  <h2 class="qtext">${esc(q.q)}</h2>
  ${optionsHtml(it,it.done)}
  ${fb}
  ${nav?`<div class="act">${nav}</div>`:""}`,top);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickTrain(+b.dataset.oi));
  const v=document.getElementById("validate");if(v)v.onclick=validateTrain;
  const n=document.getElementById("next");if(n){n.onclick=nextTrain;n.focus({preventScroll:true});const f=app.querySelector(".fb");if(f&&f.scrollIntoView&&!(it.ok&&SET.auto))f.scrollIntoView({block:"nearest",behavior:"smooth"})}
  const p=document.getElementById("pause-ok");if(p)p.onclick=()=>{S.brk=Date.now();showTrain(false)};
  document.getElementById("quit").onclick=home;
}
function pickTrain(oi){
  const it=S.items[S.i];if(it.done)return;
  if(it.q.a.length>1){it.sel=it.sel.includes(oi)?it.sel.filter(x=>x!==oi):[...it.sel,oi];showTrain(false)}
  else{it.sel=[oi];validateTrain()}
}
function validateTrain(){
  const it=S.items[S.i];if(!it.sel.length||it.done)return;
  it.done=true;it.ok=same(it.q.a,it.sel);record(it.q,it.ok);
  if(it.ok){S.master.add(it.q.id);S.combo++}
  else{S.combo=0;S.items.splice(S.i+1,0,{q:it.q,order:optionOrder(it.q),sel:[],done:false,ok:false,retry:true})}
  persist();showTrain(false);
  if(it.ok&&SET.auto){clearTimeout(autoT);autoT=setTimeout(()=>{if(S&&S.mode==="train"&&S.items[S.i]===it)nextTrain()},700)}
}
function nextTrain(){clearTimeout(autoT);if(S.i>=S.items.length-1)finishTrain();else{S.i++;persist();showTrain(true)}}
function finishTrain(){
  drop(KEY_SES);stopAll();
  const base=S.items.filter(x=>!x.retry),N=base.length,c=base.filter(x=>x.ok).length,pct=Math.round(c/N*100);
  const wrong=base.filter(x=>!x.ok),src=S.src,label=S.label,time=clockTxt();
  S=null;
  paint(`
  <div class="res">
    <p class="lbl">${esc(label)}</p>
    <div class="score num">${c}<small>/${N}</small></div>
    <span class="verdict ${pct>=60?"":"ko"}">${pct>=60?"Bon niveau":"À retravailler"}</span>
    <p class="sum">${bonnes(c)} du premier coup, soit ${pct} %, en ${time}. Toutes les questions sont maintenant réussies.</p>
    ${wrong.length?`<section class="corr"><h3>Ratées au premier essai</h3>${wrong.map((x,k)=>corrItem(x,k+1)).join("")}</section>`:""}
    <div class="act"><button class="btn" id="again">${src.kind==="smart"?"Encore "+SMART_N+" questions":"Recommencer"}</button><button class="btn ghost" id="home">Accueil</button></div>
  </div>`,true);
  document.getElementById("again").onclick=()=>restart(src);
  document.getElementById("home").onclick=home;
}

/* ---------- Examen blanc ---------- */
function startExam(){
  const list=drawExam();if(!list.length)return;
  S={mode:"exam",label:"Examen blanc",src:{kind:"exam"},i:0,deadline:Date.now()+EXAM_MIN*60000,items:list.map(q=>({q,order:optionOrder(q),sel:[]}))};
  confirmOpen=false;beginTicks();showExam(true);
}
function fmt(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+":"+String(s).padStart(2,"0")}
function updTimer(){
  if(!S||S.mode!=="exam")return;
  const left=S.deadline-Date.now(),el=document.getElementById("timer");
  if(el){el.textContent=fmt(left);el.classList.toggle("low",left<5*60000)}
  if(left<=0)finishExam(true);
}
function openConfirm(){confirmOpen=true;showExam(false);const c=document.getElementById("confirm");if(c&&c.scrollIntoView)c.scrollIntoView({block:"center",behavior:"smooth"})}
function showExam(top){
  const N=S.items.length,it=S.items[S.i],q=it.q,multi=q.a.length>1;
  const answered=S.items.filter(x=>x.sel.length).length,blank=N-answered;
  const cells=S.items.map((x,k)=>`<button class="cell num${x.sel.length?" on":""}${k===S.i?" cur":""}" data-go="${k}" aria-label="Question ${k+1}${x.sel.length?", répondue":""}">${k+1}</button>`).join("");
  paint(`
  <div class="bar-top"><button class="quit${armed?" armed":""}" id="quit">${armed?"Confirmer l'abandon":"Quitter"}</button>
    <span class="where num">Question <b>${S.i+1}</b>/${N}</span><span class="timer num" id="timer" aria-label="Temps restant">${fmt(S.deadline-Date.now())}</span></div>
  <div class="prog"><span style="width:${answered/N*100}%"></span></div>
  <p class="qmeta"><span>${multi?"Plusieurs réponses possibles":"Une seule réponse"}</span></p>
  <h2 class="qtext">${esc(q.q)}</h2>
  ${optionsHtml(it,false)}
  <div class="act"><button class="btn ghost" id="prev" ${S.i?"":"disabled"}>Précédente</button><button class="btn" id="nxt">${S.i===N-1?"Terminer":"Suivante"}</button></div>
  <div class="grid30">${cells}</div>
  <div class="legend"><span><i class="l-on"></i>Répondue</span><span><i></i>Sans réponse</span><span class="num">${answered}/${N} répondues</span></div>
  ${confirmOpen?`<div class="confirm" id="confirm">${blank?`Il reste ${plural(blank,"question")} sans réponse. Une question sans réponse compte comme fausse.`:"Toutes les questions ont une réponse."} Rendre la copie maintenant ?
    <div class="act"><button class="btn ghost" id="cancel">Continuer</button><button class="btn" id="hand">Rendre la copie</button></div></div>`
    :`<button class="btn ghost submit" id="submit">Rendre la copie</button>`}`,top);
  updTimer();
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickExam(+b.dataset.oi));
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  document.getElementById("prev").onclick=()=>go(S.i-1);
  document.getElementById("nxt").onclick=()=>{if(S.i===N-1)openConfirm();else go(S.i+1)};
  const sb=document.getElementById("submit");if(sb)sb.onclick=openConfirm;
  const cc=document.getElementById("cancel");if(cc)cc.onclick=()=>{confirmOpen=false;showExam(false)};
  const h=document.getElementById("hand");if(h)h.onclick=()=>finishExam(false);
  document.getElementById("quit").onclick=()=>{if(!armed){armed=true;showExam(false);return}home()};
}
function pickExam(oi){
  const it=S.items[S.i];armed=false;
  if(it.q.a.length>1)it.sel=it.sel.includes(oi)?it.sel.filter(x=>x!==oi):[...it.sel,oi];else it.sel=[oi];
  showExam(false);
}
function go(k){if(!S||k<0||k>=S.items.length)return;armed=false;confirmOpen=false;S.i=k;showExam(true)}
function finishExam(timeout){
  if(!S||S.mode!=="exam")return;
  stopAll();
  const items=S.items,N=items.length;
  items.forEach(x=>{x.ok=x.sel.length>0&&same(x.q.a,x.sel);if(x.sel.length)record(x.q,x.ok)});
  const c=items.filter(x=>x.ok).length,v=Math.round(c/N*200)/10,pass=v>=PASS;
  const ex=load(KEY_EX,[]);ex.push({d:Date.now(),c,n:N,r:items.map(x=>x.ok?1:0)});save(KEY_EX,ex.slice(-30));
  const need=Math.max(0,Math.ceil(N*PASS/20)-c),blank=items.filter(x=>!x.sel.length).length;
  const per=META.map(m=>{const its=items.filter(x=>x.q.mod===m.id);if(!its.length)return "";const ok=its.filter(x=>x.ok).length;
    return `<div><span>${m.complement?"Complément":esc(m.id)+". "+esc(m.short||m.title)}</span><b class="num${ok/its.length<.6?" low":""}">${ok}/${its.length}</b></div>`}).join("");
  const cells=items.map((x,k)=>x.ok?`<span class="cell num r">${k+1}</span>`:`<a class="cell num w${x.sel.length?"":" e"}" href="#c${k+1}">${k+1}</a>`).join("");
  const wrong=items.map((x,k)=>({x,k})).filter(o=>!o.x.ok);
  S=null;
  paint(`
  <div class="res">
    <p class="lbl">Examen blanc${timeout?", temps écoulé":""}</p>
    <div class="score num">${n20txt(v)}<small>/20</small></div>
    <span class="verdict ${pass?"":"ko"}">${pass?"Examen réussi":"Pas encore validé"}</span>
    <p class="sum">${bonnes(c)} sur ${N}.${pass?"":` Il manquait ${bonnes(need)} pour atteindre ${PASS}/20.`}${blank?` ${plural(blank,"question")} sans réponse.`:""}</p>
    <div class="grid30">${cells}</div>
    <div class="legend"><span><i class="l-r"></i>Juste</span><span><i class="l-w"></i>Faux, touche pour voir la correction</span></div>
    <div class="break">${per}</div>
    ${wrong.length?`<section class="corr"><h3>Correction</h3>${wrong.map(o=>corrItem(o.x,o.k+1)).join("")}</section>`:""}
    <div class="act"><button class="btn" id="again">Nouvel examen</button><button class="btn ghost" id="home">Accueil</button></div>
  </div>`,true);
  document.getElementById("again").onclick=startExam;
  document.getElementById("home").onclick=home;
  app.querySelectorAll("a.cell").forEach(a=>a.onclick=()=>{const d=document.querySelector(a.getAttribute("href"));if(d)d.open=true});
}
function corrItem(x,num){
  const q=x.q;
  return `<details id="c${num}"><summary><span class="q num">${num}</span><span>${esc(q.q)}</span></summary><div class="in">
    <p class="you">${x.sel.length?"Ta réponse : "+esc(x.sel.map(i=>q.o[i]).join(" · ")):"Pas de réponse"}</p>
    <p class="ans">Bonne réponse : ${esc(q.a.map(i=>q.o[i]).join(" · "))}</p>
    ${q.e?`<p class="ex">${esc(q.e)}</p>`:""}</div></details>`;
}

/* ---------- Clavier : 1 à 7 pour répondre, Entrée pour valider ou continuer, flèches en examen ---------- */
document.addEventListener("keydown",e=>{
  if(!S||e.metaKey||e.ctrlKey||e.altKey)return;
  const it=S.items[S.i];if(!it)return;
  const map={"1":0,"2":1,"3":2,"4":3,"5":4,"6":5,"7":6};
  if(e.key in map&&it.order[map[e.key]]!==undefined&&!it.done){
    e.preventDefault();const oi=it.order[map[e.key]];
    if(S.mode==="train")pickTrain(oi);else pickExam(oi);
  }else if(e.key==="Enter"&&(document.activeElement===document.body||document.activeElement===null)){
    if(S.mode==="train"){if(it.done){e.preventDefault();nextTrain()}else if(it.sel.length){e.preventDefault();validateTrain()}}
    else if(S.i<S.items.length-1){e.preventDefault();go(S.i+1)}
  }else if(S.mode==="exam"&&e.key==="ArrowRight")go(S.i+1);
  else if(S.mode==="exam"&&e.key==="ArrowLeft")go(S.i-1);
});
home();
</script>
</body>
</html>
