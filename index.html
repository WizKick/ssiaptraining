<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>QCM SSIAP 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Fond noir, textes blanc cassé : moins de fatigue visuelle sur de longues séances qu'un blanc pur. */
:root{
  --page:#000; --s1:#121212; --s2:#1B1B1B; --s3:#262626;
  --line:#242424; --line-2:#383838;
  --text:#ECECEC; --dim:#B4B4B4; --mute:#8A8A8A; --soft:#5C5C5C;
  --hi:#FFFFFF; --on-hi:#000;
  --bad:#F0605B; --bad-bg:#2A1312;
  --q:22px; --o:16.5px;
  --font:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
}
html.t2{--q:25px;--o:18.5px}
html.t3{--q:28px;--o:20.5px}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);background:var(--page)}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--hi);outline-offset:3px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 64px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Boutons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;
  font-weight:700;font-size:16px;background:var(--hi);color:var(--on-hi);text-align:center;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn.ghost:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--dim)}
.btn:disabled{opacity:.3}

/* ---------- Accueil ---------- */
.brand{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
.brand h1{margin:0 auto 0 0;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--hi)}
.chip{display:inline-flex;align-items:center;gap:1px;height:34px;line-height:1;padding:0 14px;border-radius:999px;background:var(--s2);color:var(--dim);font-size:14px;font-weight:600}
.chip b{color:var(--hi);font-weight:800}
.chip.set{background:var(--hi);color:var(--on-hi)}
.chip.set b{color:var(--on-hi)}

.today{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:22px}
.today .big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.today .big strong{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--hi)}
.today .big span{color:var(--mute);font-size:15px}
.track{height:8px;border-radius:8px;background:var(--s3);overflow:hidden;margin:14px 0 14px;display:flex}
.track i{display:block;height:100%}
.track .m{background:var(--hi)}
.track .s{background:#5A5A5A}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.fact{background:var(--s2);border-radius:14px;padding:10px 12px}
.fact b{display:block;font-size:20px;font-weight:800;color:var(--hi);letter-spacing:-.02em}
.fact span{font-size:12.5px;color:var(--mute);line-height:1.3;display:block}
.today .btn{width:100%}
.today .hint{margin:10px 0 0;font-size:13.5px;color:var(--mute);text-align:center}
.resume{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--s1);border:1.5px solid var(--dim);border-radius:18px;padding:14px 16px;margin-top:12px}
.resume div{flex:1 1 100%;min-width:0}
.resume b{display:block;font-size:15.5px;color:var(--hi)}
.resume small{color:var(--mute);font-size:13.5px}
.resume .btn{min-height:42px;padding:0 18px;font-size:15px}
.resume .x{color:var(--mute);font-size:13.5px;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}

.block{margin-top:30px}
.block h3{margin:0 0 10px;font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--hi)}
.block .sub{margin:-6px 0 12px;color:var(--mute);font-size:14.5px}

.exam{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;grid-template-areas:"t" "s" "c" "b"}
.exam .t{grid-area:t}
.exam h4{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--hi)}
.exam p{margin:0;color:var(--dim);font-size:15px;max-width:44ch}
.sheet{grid-area:s;display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:16px 0 10px}
.sheet i{aspect-ratio:1;border-radius:5px;border:1.5px solid var(--line-2)}
.sheet i.r{background:var(--hi);border-color:var(--hi)}
.sheet i.w{border-color:var(--bad);background:var(--bad-bg)}
.sheet-cap{grid-area:c;font-size:14px;color:var(--mute);min-height:21px}
.sheet-cap b{color:var(--hi)}
.exam .btn{grid-area:b;margin-top:14px;width:100%}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;min-height:120px;transition:border-color .15s}
.mode:hover:not(:disabled){border-color:var(--line-2)}
.mode .n{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:auto;color:var(--hi)}
.mode .tt{font-weight:700;font-size:15.5px;margin-top:10px;line-height:1.25;color:var(--hi)}
.mode .s{font-size:13.5px;color:var(--mute);line-height:1.35}
.mode.wide{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center}
.mode.wide .n{font-size:28px;margin:0;grid-row:span 2;min-width:1.6ch}
.mode.wide .tt{margin:0}
.mode:disabled{opacity:.45}

.mods{background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mod{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;width:100%;padding:13px 16px;border-top:1px solid var(--line)}
.mod:first-child{border-top:0}
.mod:hover:not(:disabled){background:var(--s2)}
.mod .id{width:40px;height:40px;border-radius:11px;background:var(--s3);color:var(--hi);display:grid;place-items:center;font-weight:800;font-size:15px}
.mod.done .id{background:var(--hi);color:var(--on-hi)}
.mod.comp .id{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.mod .tl{font-weight:600;font-size:15.5px;line-height:1.3;display:block;color:var(--text)}
.mod .mm{font-size:13px;color:var(--mute);display:block;margin-top:1px}
.mod .st{text-align:right;min-width:60px}
.mod .pc{font-weight:700;font-size:15px;display:block;color:var(--hi)}
.mod .pc.none{color:var(--soft);font-weight:500;font-size:13px}
.bar{display:block;height:4px;border-radius:4px;background:var(--s3);margin-top:6px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--hi);border-radius:4px}

.hist{list-style:none;margin:0;padding:0;background:var(--s1);border:1px solid var(--line);border-radius:18px}
.hist li{display:flex;justify-content:space-between;padding:11px 16px;border-top:1px solid var(--line);font-size:15px;color:var(--dim)}
.hist li:first-child{border-top:0}
.hist .ok{font-weight:700;color:var(--hi)}
.hist .ko{color:var(--bad)}

.settings{background:var(--s1);border:1px solid var(--line);border-radius:18px}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-top:1px solid var(--line);font-size:15.5px}
.set:first-child{border-top:0}
.set small{display:block;color:var(--mute);font-size:13px}
.sound-buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sound-buttons .chip{font-size:12px;padding:0 10px;min-height:34px}
.sound-preview{flex-wrap:wrap}
.seg{display:flex;background:var(--s2);border-radius:999px;padding:3px;flex:none}
.seg button{min-width:42px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--mute);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--hi);color:var(--on-hi)}
.seg .a1{font-size:13px}.seg .a2{font-size:16px}.seg .a3{font-size:19px}
.sw{flex:none;width:50px;height:30px;border-radius:999px;background:var(--s3);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mute);transition:transform .15s,background .15s}
.sw[aria-checked="true"]{background:var(--hi)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-hi)}
input[type=date]{background:var(--s2);border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;color-scheme:dark;flex:none}
.foot{margin-top:30px;color:var(--mute);font-size:13.5px;text-align:center}
.foot button{color:var(--mute);text-decoration:underline;text-underline-offset:3px;padding:8px;font-size:13.5px}
.warn{background:var(--bad-bg);border:1px solid var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}

/* ---------- Séance ---------- */
.bar-top{position:sticky;top:0;z-index:5;background:var(--page);padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px;margin:-20px 0 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.quit{font-size:15px;font-weight:600;padding:8px 2px;min-height:40px;color:var(--dim)}
.quit.armed{color:var(--bad)}
.where{font-size:15px;color:var(--mute)}
.where b{color:var(--hi)}
.clock{font-size:14px;color:var(--mute);min-width:44px;text-align:right}
.timer{font-weight:800;font-size:19px;letter-spacing:-.01em;background:var(--hi);color:var(--on-hi);border-radius:999px;padding:4px 12px}
.timer.low{background:var(--bad);color:#000}
.prog{height:4px;background:var(--s3);border-radius:4px;overflow:hidden;margin:4px 0 20px}
.prog span{display:block;height:100%;background:var(--hi);transition:width .25s}
.qmeta{font-size:13.5px;color:var(--mute);margin:0 0 8px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.streak{color:var(--hi);font-weight:700}
.qtext{font-size:var(--q);line-height:1.32;font-weight:700;letter-spacing:-.015em;margin:0 0 20px;max-width:34em;color:var(--hi)}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:flex-start;gap:13px;width:100%;min-height:54px;padding:14px 16px;background:var(--s1);
  border:1.5px solid var(--line);border-radius:14px;font-size:var(--o);line-height:1.42;color:var(--text);transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--line-2);background:var(--s2)}
.mk{flex:none;width:22px;height:22px;margin-top:2px;border:1.75px solid var(--line-2);border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;line-height:1}
.multi .mk{border-radius:6px}
.key{display:none;flex:none;margin-left:auto;color:var(--soft);font-size:13px;font-weight:600;padding-top:3px}
@media (hover:hover) and (pointer:fine){.key{display:block}}
.opt.sel{border-color:var(--hi);background:var(--s2)}
.opt.sel .mk{background:var(--hi);border-color:var(--hi);color:var(--on-hi)}
.opt.good{background:#22c55e;border-color:#22c55e;color:#031b0b}
.opt.good .mk{background:#031b0b;border-color:#031b0b;color:#22c55e}
.opt.good .key{color:#134e25}
.opt.bad{border-color:#dc2626;background:#dc2626;color:#fff}
.opt.bad .txt{text-decoration:line-through;text-decoration-color:#fff;color:#fff}
.opt.bad .mk{border-color:#fff;background:#fff;color:#dc2626}
.opt.bad .key{color:#fff}
.opt.dim{opacity:.4}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;background:var(--s1);border:1px solid var(--line)}
.fb .v{font-weight:800;font-size:17px;color:var(--hi)}
.fb.ko{border-color:var(--bad)}
.fb.ko .v{color:var(--bad)}
.fb p{margin:6px 0 0;font-size:15.5px;color:var(--dim)}
.fb p b{color:var(--hi)}
.act{display:flex;gap:10px;margin-top:18px}
.act .btn{flex:1}
.pause{display:flex;gap:12px;align-items:center;background:var(--s2);border-radius:14px;padding:12px 14px;margin:0 0 16px;font-size:14.5px;color:var(--dim)}
.pause span{flex:1}
.pause button{color:var(--hi);font-weight:700;padding:6px 4px}

.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:26px}
.cell{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line-2);background:transparent;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--mute)}
.cell.on{background:var(--s3);border-color:var(--s3);color:var(--text)}
.cell.cur{border-color:var(--hi);color:var(--hi)}
.cell.r{background:var(--hi);border-color:var(--hi);color:var(--on-hi)}
.cell.w{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.cell.e{border-style:dashed}
a.cell{text-decoration:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:1.5px solid var(--line-2)}
.legend .l-on{background:var(--s3);border-color:var(--s3)}
.legend .l-r{background:var(--hi);border-color:var(--hi)}
.legend .l-w{border-color:var(--bad);background:var(--bad-bg)}
.submit{width:100%;margin-top:16px}
.confirm{background:var(--s1);border:1.5px solid var(--dim);border-radius:14px;padding:14px 16px;margin-top:14px;font-size:15px;color:var(--dim)}
.confirm .act{margin-top:12px}

/* ---------- Résultat ---------- */
.res .lbl{color:var(--mute);font-size:15px;margin:10px 0 0}
.score{font-size:84px;font-weight:800;letter-spacing:-.05em;line-height:1;margin:6px 0 6px;color:var(--hi)}
.score small{font-size:32px;color:var(--soft);letter-spacing:-.02em;font-weight:700}
.verdict{display:inline-flex;align-items:center;font-weight:700;font-size:16px;border-radius:999px;padding:6px 14px;background:var(--hi);color:var(--on-hi)}
.verdict.ko{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.res .sum{color:var(--dim);margin:14px 0 0;max-width:52ch}
.break{background:var(--s1);border:1px solid var(--line);border-radius:18px;margin-top:24px}
.break div{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:15px;color:var(--dim)}
.break div:first-child{border-top:0}
.break b{font-weight:700;color:var(--hi)}
.break b.low{color:var(--bad)}
.corr{margin-top:26px}
.corr h3{font-size:18px;margin:0 0 10px;color:var(--hi)}
.corr details{background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.corr summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;gap:10px;color:var(--text)}
.corr summary::-webkit-details-marker{display:none}
.corr summary .q{color:var(--mute);font-weight:700;min-width:2.2ch}
.corr .in{padding:0 16px 14px;font-size:15px}
.corr .in p{margin:6px 0 0}
.corr .you{color:var(--bad)}
.corr .ans{font-weight:700;color:var(--hi)}
.corr .ex{color:var(--dim)}

@media (min-width:640px){
  .wrap{padding:28px 24px 72px}
  .brand h1{font-size:32px}
  .today{padding:26px 28px}
  .today .btn{width:auto;min-width:280px}
  .today .hint{text-align:left}
  .exam{padding:24px 26px;grid-template-columns:1fr 260px;grid-template-areas:"t s" "c s" "b s";column-gap:32px;align-items:start}
  .exam .sheet{margin:2px 0 0;align-self:center}
  .exam .sheet-cap{margin-top:12px}
  .exam .btn{justify-self:start;width:auto;min-width:240px}
  .modes{grid-template-columns:1fr 1fr 1fr}
  .mode.wide{grid-column:auto;display:flex;flex-direction:column;align-items:stretch;min-height:120px}
  .mode.wide .n{font-size:32px;margin-bottom:auto}
  .mode.wide .tt{margin-top:10px}
  .cell{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.terrain-intro{margin:-4px 0 8px;color:var(--mute);font-size:15px;max-width:60ch}

/* ---------- OFFICIEL 2026 ---------- */
.official-2026{border:1px solid var(--line-2);border-radius:22px;padding:20px;background:var(--s1)}
.official-2026 .mode{background:var(--s2)}
.pdf-intro,.pdf-source{color:var(--mute);font-size:14px}
.pdf-tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.pdf-tools .btn{min-height:44px;padding:0 16px;font-size:14px}
.pdf-tools form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.pdf-tools input{width:72px;background:var(--s2);border:1px solid var(--line-2);border-radius:8px;padding:8px;color:var(--text)}
.pdf-chapters{display:flex;gap:8px;flex-wrap:wrap}
.pdf-chapters a{height:auto;min-height:34px;line-height:1.3;padding:8px 12px;text-decoration:none;font-size:12px}
.pdf-chapter{margin:30px 0 12px;font-size:18px;color:var(--hi)}
.pdf-card{background:var(--s1);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
.pdf-card summary{cursor:pointer;display:flex;gap:12px;padding:16px;align-items:flex-start;font-size:15px;list-style:none}
.pdf-card summary::-webkit-details-marker{display:none}
.pdf-card summary::after{content:"+";margin-left:auto;color:var(--mute);flex-shrink:0}
.pdf-card[open] summary::after{content:"−"}
.pdf-number{font-weight:800;color:var(--hi);flex-shrink:0;min-width:40px}
.pdf-answer{border-top:1px solid var(--line);padding:10px 16px 16px}
.pdf-options{list-style:none;padding:0;margin:0;font-size:15px}
.pdf-options li{display:flex;gap:10px;padding:8px 10px;margin:4px 0;border-radius:8px;color:var(--dim)}
.pdf-options .pdf-correct{background:#22c55e;color:#031b0b;font-weight:700}
.pdf-source{font-size:12px;margin:10px 0 0}

/* ---------- Suivi OFFICIEL 2026 ---------- */
:root{--pdf-green:#58d68d;--pdf-orange:#ffb454;--pdf-red:#ff7474}
.pdf-scoreboard{margin:14px 0}
.pdf-counter-label{font-size:12px;color:var(--dim);margin:0 0 8px}
.pdf-counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.pdf-count{border:1px solid var(--line-2);border-radius:12px;padding:11px 8px;background:var(--s2);min-width:0}
.pdf-count strong{display:block;font-size:21px;line-height:1.2;white-space:nowrap}
.pdf-count span{display:block;font-size:11px;color:var(--dim);line-height:1.3;margin-top:5px;overflow-wrap:anywhere}
.green{color:var(--pdf-green)}.orange{color:var(--pdf-orange)}.red{color:var(--pdf-red)}.unseen{color:var(--mute)}
.pdf-count.green,.pdf-result-cell.green{background:#10271b;border-color:#2e7650}
.pdf-count.orange,.pdf-result-cell.orange{background:#2d2112;border-color:#8a6230}
.pdf-count.red,.pdf-result-cell.red{background:#2d1515;border-color:#8b4040}
.pdf-session-panel{margin:0 0 20px;padding:0 0 12px;border-bottom:1px solid var(--line)}
.pdf-live-note{font-size:12px;color:var(--dim);margin:5px 0}
.pdf-map summary{font-size:12px;color:var(--dim);cursor:pointer;padding:6px 0}
.pdf-result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:5px;margin:14px 0}
.pdf-result-cell{display:flex;align-items:center;justify-content:center;min-height:30px;font-size:11px;border:1px solid var(--line-2);border-radius:5px;background:var(--s2)}
.pdf-result-cell.current{outline:2px solid var(--hi);outline-offset:1px}
.fb.pdf-feedback.green{border-color:var(--pdf-green);background:#10271b}
.fb.pdf-feedback.orange{border-color:var(--pdf-orange);background:#2d2112}
.fb.pdf-feedback.red{border-color:var(--pdf-red);background:#2d1515}
.fb.pdf-feedback .v{color:inherit}
.res .act{flex-wrap:wrap}
.res .act .btn{flex:1 1 160px}

  {"id": "B1", "title": "Le classement des ERP", "short": "Le classement des ERP", "tags": "Type & catégorie · Sécurité Incendie", "min": 18, "expected": 10, "desc": "Identifier un établissement recevant du public par son type et sa catégorie, et en déduire le règlement qui s'y applique."},

  {"id": "C", "title": "Les IGH : compartimentage, dégagements et désenfumage", "short": "Les IGH", "tags": "Sécurité Incendie · Agent de service", "min": 24, "expected": 38, "desc": "Pourquoi on n'évacue pas une tour, et comment le compartimentage, le SAS et le désenfumage organisent la sécurité en hauteur."},

<!-- MODULE A : Le feu et ses conséquences (49 questions) -->
<script>
// Module A : Le feu et ses conséquences — questions de l'ancien site.
// Format d'une question : q = énoncé, o = options, a = numéros des bonnes options (0 = première), e = explication.
(window.SSIAP_MODULES = window.SSIAP_MODULES || {}).A = { questions: [
  {"q": "Parmi ces substances, indiquez celles qui sont considérées comme étant un comburant ?", "o": ["l'huile hydraulique", "les flammes", "l'essence", "l'oxygène", "aucune des réponses précédentes", "le propane"], "a": [3], "e": "Le comburant est le corps qui permet la combustion en s'associant au combustible : dans la quasi-totalité des incendies, c'est l'oxygène de l'air. En dessous de 15 % d'oxygène, la combustion ne s'entretient plus."},
  {"q": "Comment se propage la chaleur par rayonnement ?", "o": ["par déplacement de la fumée", "par l'intermédiaire d'ondes électromagnétiques", "par mouvement des gaz chauds", "aucune des réponses précédentes", "par la masse du matériau", "par projection de particules incandescentes"], "a": [1], "e": "Le rayonnement transmet la chaleur par ondes électromagnétiques, sans contact ni support matériel : on ressent la chaleur d'un foyer à distance. Repère : rayonnement = ondes, convection = gaz chauds, conduction = masse du matériau."},
  {"q": "Le phénomène d'embrasement généralisé instantané d'un local s'appelle :", "o": ["Le flashover", "L'épandage", "Le backdraft léger", "La convection"], "a": [0], "e": "Le flashover est l'inflammation quasi simultanée de tous les matériaux d'un local, par accumulation de chaleur. Après lui, plus d'intervention possible aux moyens de première intervention."},
  {"q": "Pour qu'un feu soit inhibé, il faut ?", "o": ["aucune des réponses précédentes", "refroidir le combustible", "utiliser un RIA", "disperser le combustible", "arroser les flammes"], "a": [0], "e": "L'inhibition consiste à interrompre chimiquement la réaction de combustion (par un agent inhibiteur) : aucune proposition ne décrit cela. Disperser, refroidir ou arroser relèvent d'autres principes (isolement, refroidissement). Repère : inhibition = action sur la réaction chimique elle-même."},
  {"q": "Un incendie peut être d'origine :", "o": ["aucune des réponses précédentes", "naturelle", "hydraulique", "alimentaire", "électrique", "humaine"], "a": [1, 4, 5], "e": "Le cours classe les causes d'incendie en trois familles : techniques, humaines et naturelles. L'origine électrique est une cause technique. « alimentaire » et « hydraulique » ne figurent pas parmi les causes d'incendie."},
  {"q": "Le classement M5 correspond à :", "o": ["Facilement inflammable", "Moyennement inflammable", "aucune des réponses précédentes", "Difficilement inflammable", "Inimflammable", "Incombustible"], "a": [2], "e": "Le classement français de réaction au feu s'arrête à M4 : M0 incombustible, M1 non inflammable, M2 difficilement inflammable, M3 moyennement inflammable, M4 facilement inflammable. Il n'existe pas de M5."},
  {"q": "Qu'est-ce que la conduction dans un feu ?", "o": ["c'est la transmission de la chaleur par l'intermédiaire de particules incandescentes", "c'est la transmission de la chaleur par l'intermédiaire d'ondes électromagnétiques", "c'est la transmission de la chaleur par la masse même du matériau", "aucune des réponses précédentes", "c'est la transmission de la chaleur par l'intermédiaire de l'air"], "a": [2], "e": "La conduction est la transmission de la chaleur à travers la masse même du matériau (ex. poutre métallique qui s'échauffe de proche en proche). À distinguer de la convection (air et gaz) et du rayonnement (ondes)."},
  {"q": "Quel(s) danger(s) représente(nt) les fumées lors d'un incendie ?", "o": ["aucun si les pompiers sont alertés", "le déclenchement de la détection incendie", "aucune des réponses précédentes", "le phénomène de panique", "le risque d'inondation", "le risque d'intoxication", "le manque de visibilité pour évacuer"], "a": [3, 5, 6], "e": "Trois dangers majeurs : l'intoxication (gaz toxiques), la perte de visibilité qui gêne l'évacuation, et la panique. Les fumées restent dangereuses même les secours prévenus, et n'ont rien à voir avec une inondation."},
  {"q": "Le sigle CF (coupe-feu) correspond en Eurocode à :", "o": ["EI (REI)", "E (RE)", "R", "M1"], "a": [0], "e": "CF = Coupe-Feu = REI (stabilité + étanchéité aux flammes/gaz + isolation thermique). SF = R (stabilité), PF = E (pare-flammes)."},
  {"q": "La combustion est une réaction :", "o": ["Oxydable", "Exothérique", "aucune des réponses précédentes", "Extra-thermique", "Exothermocimètrique", "Exothermique"], "a": [5], "e": "Le feu est une réaction chimique exothermique : elle libère de la chaleur vers l'extérieur. Les autres propositions sont des mots déformés ou inventés."},
  {"q": "Quelle est la meilleure façon d'éteindre un feu sur une conduite de gaz ?", "o": ["aucune des réponses précédentes", "arroser la flamme (eau+additif)", "fermer la vanne de barrage", "appeler les services Gaz de France", "recouvrir la fuite avec de la poudre", "refroidir avec du CO2"], "a": [2], "e": "Pour un feu de gaz, l'extinction s'effectue d'abord par la fermeture du dispositif d'alimentation, donc la vanne de barrage. Éteindre la flamme sans couper l'arrivée laisse le gaz s'accumuler et expose à l'explosion."},
  {"q": "Quels combustibles forment des braises au cours de leur combustion ?", "o": ["les gaz", "les fumées", "les liquides", "les solides", "aucune des réponses précédentes"], "a": [3], "e": "Seuls les combustibles solides forment des braises : c'est la définition de la classe A. La braise rend le feu difficile à éteindre définitivement, d'où l'usage de l'eau, qui refroidit en profondeur."},
  {"q": "Outre la toxicité, les fumées sont susceptibles de provoquer :", "o": ["un effet de panique pour les personnes", "une diminution de la visibilité pour les personnes en cas d'évacuation", "L'étouffement du feu", "aucune réponse précédente"], "a": [0, 1], "e": "Au-delà de leur toxicité, les fumées désorientent : panique et réduction de la visibilité, ce qui gêne l'évacuation. « L'étouffement du feu » est un principe d'extinction, pas un danger des fumées."},
  {"q": "Pour éteindre un feu dans une armoire électrique, l'agent extincteur le plus efficace est ?", "o": ["l'eau avec additif", "le dioxyde de carbone", "Le carbone", "l'eau", "le sable", "aucune des réponses précédentes", "l'azote"], "a": [1], "e": "Le CO2 ne conduit pas l'électricité et ne laisse aucun résidu sur le matériel. Tout agent contenant de l'eau est proscrit sur une installation sous tension."},
  {"q": "Le classement A1 FL s'applique aux :", "o": ["aucune des réponses précédentes", "Revêtements de parois", "Clapets coupe-feu", "Revêtement de sol", "Faux plafonds", "Rideaux de scène ou d'estrade"], "a": [3], "e": "Dans les euroclasses, le suffixe FL signifie « floorings » : revêtements de sol. A1 FL est la meilleure performance possible pour un sol. FL pour les sols, L pour les conduits linéaires, rien pour les parois et plafonds."},
  {"q": "Quels sont les éléments qui constituent le triangle du feu ?", "o": ["aucune des réponses précédentes", "le gaz carbonique", "le comburant", "l'eau avec additif", "la poudre", "l'énergie d'activation", "le combustible"], "a": [2, 5, 6], "e": "Le triangle du feu réunit trois éléments indissociables : combustible (ce qui brûle), comburant (l'oxygène) et énergie d'activation (ce qui déclenche). Retirer un seul des trois éteint le feu."},
  {"q": "Un feu d'huile de friteuse est de classe :", "o": ["A", "D", "B", "F"], "a": [3], "e": "Classe F = huiles et graisses de cuisson. Jamais d'eau (projection enflammée) : on étouffe ou on utilise un extincteur classe F."},
  {"q": "Un feu de gaz (butane, propane) est de classe :", "o": ["C", "B", "D", "A"], "a": [0], "e": "Classe C = gaz. La meilleure façon d'éteindre un feu de gaz est de fermer la vanne d'alimentation (barrage)."},
  {"q": "Un feu d'hydrocarbures (essence, huile) est de classe :", "o": ["A", "B", "F", "C"], "a": [1], "e": "Classe B = liquides inflammables et solides liquéfiables (essence, alcool, plastiques). Risque d'épandage."},
  {"q": "Éteindre un feu en le privant d'oxygène s'appelle :", "o": ["L'isolement", "L'étouffement", "L'inhibition", "Le refroidissement"], "a": [1], "e": "L'étouffement supprime le comburant (couverture, CO2). Le refroidissement supprime l'énergie (eau), l'inhibition casse la réaction en chaîne (poudre)."},
  {"q": "Quels sont les agents d'extinction contenus dans les extincteurs portatifs ?", "o": ["aucune des réponses précédentes", "le CO2", "le halon", "la poudre", "l'azote", "la mousse", "l'eau"], "a": [1, 3, 6], "e": "Le cours retient l'eau (avec ou sans additif), la poudre et le CO2 comme agents des extincteurs portatifs courants. Le halon est interdit et l'azote sert aux installations fixes d'inertage."},
  {"q": "Quels sont les éléments ci-dessous pour lesquels un classement de réaction au feu est demandé ?", "o": ["aucune des réponses précédentes", "un revetement mural", "un rétroprojecteur", "un revêtement de sol", "Un gros mobilier"], "a": [1, 3, 4], "e": "Le classement de réaction au feu concerne les matériaux et aménagements susceptibles d'alimenter un feu : revêtement mural, revêtement de sol et gros mobilier. Un rétroprojecteur est un appareil, pas un matériau d'aménagement."},
  {"q": "Qu'est-ce que la convection dans un feu ?", "o": ["c'est la transmission de la chaleur par la masse même du matériau", "c'est la transmission de la chaleur par l'intermédiaire de l'air", "c'est la transmission de la chaleur par l'intermédiaire de particules incandescentes", "aucune des réponses précédentes", "c'est la transmission de la chaleur par l'intermédiaire d'ondes électromagnétiques"], "a": [1], "e": "La convection est la transmission de la chaleur par l'intermédiaire de l'air et des gaz : les fumées chaudes montent et propagent le feu vers le haut. À distinguer de la conduction (masse du matériau) et du rayonnement (ondes)."},
  {"q": "Le mode d'extinction d'un feu par étouffement consiste à", "o": ["empêcher l'apport d'air", "disperser le combustible", "aucune des réponses précédentes", "se rapprocher très près des flammes", "faire baisser la température"], "a": [0], "e": "L'étouffement supprime le comburant : on empêche l'apport d'air, donc d'oxygène, au foyer. À distinguer du refroidissement (baisse de la température) et de l'isolement (retrait du combustible)."},
  {"q": "Un feu de bois et de papier est de classe :", "o": ["C", "B", "D", "A"], "a": [3], "e": "Classe A = solides formant des braises (bois, papier, carton, tissu). Ce sont les feux les plus courants."},
  {"q": "Le pouvoir calorifique inférieur d'un matériau est :", "o": ["Aucune des réponses précédentes", "L'énergie produite par la combustion complète d'un kilo de ce matériau", "La capacité à produire de la chaleur à travers un matériau", "L'unité de mesure pour établir le niveau de réaction au feu d'un matériau"], "a": [1], "e": "Le pouvoir calorifique est la chaleur dégagée par la combustion complète d'un kilo de matériau. Il se rapporte à une masse (par kilo), à ne pas confondre avec le potentiel calorifique, ramené au mètre carré d'un local."},
  {"q": "la réaction au feu peut être notée :", "o": ["aucune des réponses précédentes", "M0", "M2", "CF", "A1", "SF"], "a": [1, 2, 4], "e": "La réaction au feu des matériaux se note par le classement M (M0 à M4) et par les euroclasses (A1, A2, B, C…). SF, PF et CF relèvent de la résistance au feu des éléments de construction."},
  {"q": "La résistance au feu s'applique :", "o": ["aux éléments de construction", "aux objets", "aucune des réponses précédentes", "aux meubles", "aux sapins de noël"], "a": [0], "e": "La résistance au feu s'applique aux éléments de construction (murs, planchers, poteaux, portes…), qui doivent tenir un certain temps. Meubles, sapins et objets relèvent de la réaction au feu."},
  {"q": "A quoi s'applique la résistance au feu ?", "o": ["aucune des réponses précédentes", "Aux matériaux utilisés pour l'ameublement", "Aux revêtements de sol", "Aux éléments de construction", "A la quantité de chaleur dégagée", "Aux piliers"], "a": [3, 5], "e": "La résistance au feu s'applique aux éléments de construction : aptitude à conserver stabilité et étanchéité pendant une durée donnée. Les piliers (élément porteur) sont concernés."},
  {"q": "Quels sont les modes d'action des agents extincteurs ?", "o": ["le réchauffement", "aucune des réponses précédentes", "l'étouffement", "l'inhibition", "la conduction", "le refroidissement"], "a": [2, 3, 5], "e": "Trois modes d'action, un par sommet du triangle du feu : l'étouffement prive de comburant, le refroidissement retire l'énergie, l'inhibition casse la réaction chimique en chaîne."},
  {"q": "Quels sont les dangers des fumées ?", "o": ["de provoquer l'effondrement du bâtiment", "de désorienter les personnes par manque de visibilité", "aucune des réponses précédentes", "d'engendrer des intoxications", "de favoriser le phénomène de panique"], "a": [1, 3, 4], "e": "Outre leur toxicité, les fumées font perdre la visibilité (ce qui gêne l'évacuation) et favorisent la panique. L'effondrement d'un bâtiment relève de l'action de la chaleur sur la structure (résistance au feu), pas des fumées."},
  {"q": "Afin de déterminer les agents extincteurs à utiliser, comment classe-t-on les familles de combustibles ?", "o": ["en fonction du type de combustion (lente, vive, spontanée)", "en fonction de leurs états (solide, liquide, gaz)", "aucune des réponses précédentes", "en fonction de leurs points éclairs", "en fonction de leur dangerosité"], "a": [1], "e": "Les classes de feux (A solides, B liquides, C gaz…) sont bâties sur l'état et la nature du combustible, et c'est cette classe qui commande l'agent extincteur à employer."},
  {"q": "La convection dans un incendie, c'est la propagation par :", "o": ["Les fumées et gaz chauds qui montent", "Les ondes électromagnétiques", "Un liquide enflammé", "La masse du matériau"], "a": [0], "e": "La convection = déplacement des gaz et fumées chauds (de bas en haut). C'est le mode le plus rapide en bâtiment (cages d'escalier, gaines)."},
  {"q": "SF-PF-CF correspondent à :", "o": ["la réaction au feu des matériaux de construction", "aucune des réponses précédentes", "les niveaux d'accès du S.S.I", "aux classements d'E.R.P", "la résistance au feu des éléments de construction"], "a": [4], "e": "SF (stable au feu), PF (pare-flammes) et CF (coupe-feu) sont les notations de la résistance au feu des éléments de construction, à ne pas confondre avec la réaction au feu des matériaux (classement M)."},
  {"q": "Un feu de métaux (magnésium, sodium) est de classe :", "o": ["B", "D", "F", "C"], "a": [1], "e": "Classe D = métaux. On utilise une poudre spéciale (jamais d'eau, qui aggraverait la réaction)."},
  {"q": "Quels sont les modes de propagation d'un incendie ?", "o": ["le rayonnement", "la conduction", "les projections", "aucune des réponses précédentes", "la fragmentation", "la conviction", "la convection"], "a": [0, 1, 2, 6], "e": "Quatre modes de propagation : rayonnement (chaleur à distance), conduction (à travers les matériaux), convection (par les fumées chaudes qui montent) et projections (escarbilles)."},
  {"q": "Le comburant le plus répandu est :", "o": ["L'hydrogène", "L'oxygène de l'air", "L'azote", "Le gaz carbonique"], "a": [1], "e": "L'oxygène de l'air (≈ 21 %) est le comburant habituel. L'azote (78 %) ne fait pas brûler : c'est un piège classique d'examen."},
  {"q": "Le 4e élément qui, ajouté au triangle, forme le tétraèdre du feu est :", "o": ["Le vent", "La chaleur", "La fumée", "La réaction en chaîne"], "a": [3], "e": "La réaction en chaîne (radicaux libres) entretient la combustion. Les poudres agissent en la cassant : c'est l'inhibition."},
  {"q": "Quels sont les dangers des fumées ?", "o": ["La toxicité (CO)", "Le froid", "L'inondation", "L'opacité", "La chaleur"], "a": [0, 3, 4], "e": "Les fumées sont toxiques (monoxyde de carbone mortel), opaques (perte de visibilité, panique) et chaudes. Elles tuent davantage que les flammes."},
  {"q": "Quels sont les combustibles qui appartiennent à la classe de feu B ?", "o": ["la paille", "certains plastiques", "l'oxygène", "l'alcool", "aucune des réponses précédentes", "l'huile moteur"], "a": [1, 3, 5], "e": "La classe B regroupe les liquides inflammables et les solides liquéfiables dérivés du pétrole. La paille est un solide dérivé de l'arbre (classe A) et l'oxygène n'est pas un combustible mais un comburant."},

<script>

  {"t": "Le feu et ses conséquences", "q": "Quels sont les trois éléments du triangle du feu ?", "o": ["Le combustible", "Le comburant", "L'énergie d'activation", "L'eau"], "a": [0, 1, 2], "e": "Il faut les trois réunis. Supprimer un seul côté du triangle suffit à éteindre le feu."},
  {"t": "Le feu et ses conséquences", "q": "Quel est le comburant le plus courant ?", "o": ["L'oxygène de l'air", "L'azote", "Le dioxyde de carbone", "La vapeur d'eau"], "a": [0], "e": "L'air contient environ 21 % d'oxygène : c'est le comburant de la quasi-totalité des feux."},
  {"t": "Le feu et ses conséquences", "q": "Un feu de classe A est un feu de :", "o": ["Matériaux solides formant des braises", "Liquides ou solides liquéfiables", "Gaz", "Métaux"], "a": [0], "e": "Classe A : bois, papier, carton, tissus… Ce sont des feux « secs » qui laissent des braises."},
  {"t": "Le feu et ses conséquences", "q": "Un feu de classe B est un feu de :", "o": ["Liquides ou solides liquéfiables", "Matériaux solides formant des braises", "Métaux", "Huiles de cuisson"], "a": [0], "e": "Classe B : essence, alcool, solvants, mais aussi plastiques ou cire qui fondent."},
  {"t": "Le feu et ses conséquences", "q": "Un feu de classe C est un feu de :", "o": ["Gaz", "Métaux", "Liquides", "Auxiliaires de cuisson"], "a": [0], "e": "Classe C : butane, propane, gaz naturel…"},
  {"t": "Le feu et ses conséquences", "q": "Un feu de classe D est un feu de :", "o": ["Métaux", "Gaz", "Solides", "Matériel électrique"], "a": [0], "e": "Classe D : sodium, magnésium, aluminium en poudre… Ils demandent une poudre spéciale."},
  {"t": "Le feu et ses conséquences", "q": "Un feu de classe F concerne :", "o": ["Les huiles et graisses de cuisson", "Les feux de forêt", "Les métaux", "Les feux d'origine électrique"], "a": [0], "e": "Classe F : friteuses et appareils de cuisson. On n'y met jamais d'eau."},
  {"t": "Le feu et ses conséquences", "q": "Dans la norme NF EN 2, la classe E (feux électriques) :", "o": ["N'existe pas : le risque électrique est une mention à part sur l'extincteur", "Regroupe tous les feux d'origine électrique", "Regroupe les feux de véhicules", "Regroupe les feux de métaux"], "a": [0], "e": "La norme compte les classes A, B, C, D et F. L'aptitude au risque électrique est indiquée en plus sur l'étiquette."},
  {"t": "Le feu et ses conséquences", "q": "La propagation par conduction se fait :", "o": ["À travers les matériaux, par exemple le long d'une poutre métallique", "Par le déplacement des gaz chauds", "Par ondes de chaleur à travers l'air", "Par chute de matières enflammées"], "a": [0], "e": "La chaleur traverse les matériaux conducteurs et peut enflammer un local voisin."},
  {"t": "Le feu et ses conséquences", "q": "La propagation par convection se fait :", "o": ["Par le déplacement des gaz chauds et des fumées", "À travers une cloison métallique", "Par chute de gouttelettes enflammées", "Uniquement vers le bas"], "a": [0], "e": "Les gaz chauds montent et se propagent par les cages d'escalier, gaines et circulations."},
  {"t": "Le feu et ses conséquences", "q": "La propagation par rayonnement correspond :", "o": ["À la transmission de chaleur à distance, par ondes", "Au déplacement des fumées", "À la conduction dans le métal", "À une projection d'étincelles"], "a": [0], "e": "Comme la chaleur du soleil : un objet proche du feu peut s'enflammer sans contact."},
  {"t": "Le feu et ses conséquences", "q": "La propagation par projection correspond :", "o": ["Au déplacement ou à la chute de particules enflammées", "À la chaleur transmise par un mur", "Au mouvement des gaz chauds", "À la transmission par ondes"], "a": [0], "e": "Brandons, gouttelettes de plastique fondu, étincelles : ils allument un nouveau foyer plus loin."},
  {"t": "Le feu et ses conséquences", "q": "Quelle est la principale cause de décès lors d'un incendie ?", "o": ["Les fumées", "Les brûlures", "L'effondrement du bâtiment", "Les chutes"], "a": [0], "e": "La majorité des victimes meurent intoxiquées par les fumées, souvent avant d'avoir vu les flammes."},
  {"t": "Le feu et ses conséquences", "q": "Quels sont les dangers des fumées ?", "o": ["Elles sont opaques", "Elles sont toxiques", "Elles sont chaudes", "Elles sont sans danger si on reste debout"], "a": [0, 1, 2], "e": "Opacité, toxicité, chaleur, et elles sont aussi corrosives et inflammables."},
  {"t": "Le feu et ses conséquences", "q": "Le monoxyde de carbone (CO) est un gaz :", "o": ["Incolore, inodore et très toxique", "Jaune et à l'odeur piquante", "Sans danger à faible dose", "Qui éteint le feu"], "a": [0], "e": "Le CO est indétectable par nos sens, d'où son danger."},
  {"t": "Le feu et ses conséquences", "q": "Dans un local enfumé, il faut se déplacer :", "o": ["Baissé, près du sol", "Debout et en courant", "En longeant le plafond", "Les yeux fermés sans s'arrêter"], "a": [0], "e": "Les fumées chaudes montent : l'air le plus respirable et le plus frais est au ras du sol."},
  {"t": "Le feu et ses conséquences", "q": "Le point éclair d'un liquide est la température minimale à laquelle :", "o": ["Il émet assez de vapeurs pour s'enflammer au contact d'une flamme", "Il s'enflamme seul, sans flamme", "Il se met à bouillir", "Il gèle"], "a": [0], "e": "Au point éclair, les vapeurs s'enflamment au contact d'une flamme, sans forcément continuer à brûler."},
  {"t": "Le feu et ses conséquences", "q": "Le point d'auto-inflammation est la température à laquelle :", "o": ["Les vapeurs s'enflamment spontanément, sans flamme", "Le liquide commence à s'évaporer", "Le feu s'éteint seul", "La fumée devient visible"], "a": [0], "e": "Aucune flamme ni étincelle n'est nécessaire : la chaleur seule suffit."},
  {"t": "Le feu et ses conséquences", "q": "Le flash-over (embrasement généralisé éclair), c'est :", "o": ["L'inflammation brutale de tout le contenu d'un local sous l'effet du rayonnement", "Une explosion de fumées provoquée par un apport d'air", "Un feu qui s'éteint tout seul", "Un feu de cheminée"], "a": [0], "e": "La chaleur accumulée sous le plafond fait s'enflammer d'un coup tous les matériaux de la pièce."},
  {"t": "Le feu et ses conséquences", "q": "Le backdraft, c'est :", "o": ["Une explosion de fumées due à un apport brutal d'air dans un local sous-ventilé", "L'inflammation progressive d'un local", "Un retour de flamme dans une bouteille de gaz", "Une fumée blanche sans danger"], "a": [0], "e": "Un local fermé plein de gaz imbrûlés explose quand on ouvre la porte. D'où la prudence avant d'ouvrir."},
  {"t": "Le feu et ses conséquences", "q": "Le refroidissement agit sur quel élément du triangle du feu ?", "o": ["L'énergie d'activation (la chaleur)", "Le comburant", "Le combustible", "Aucun"], "a": [0], "e": "L'eau absorbe la chaleur et fait descendre la température sous le seuil d'inflammation."},
  {"t": "Le feu et ses conséquences", "q": "L'étouffement agit sur :", "o": ["Le comburant", "Le combustible", "L'énergie d'activation", "La fumée"], "a": [0], "e": "On prive le feu d'oxygène : couverture anti-feu, couvercle, CO2."},
  {"t": "Le feu et ses conséquences", "q": "Fermer la vanne d'alimentation d'une fuite de gaz enflammée agit sur :", "o": ["Le combustible", "Le comburant", "L'énergie d'activation", "La propagation"], "a": [0], "e": "On supprime ce qui brûle : c'est l'extinction par suppression du combustible."},
  {"t": "Le feu et ses conséquences", "q": "La poudre agit principalement par :", "o": ["Inhibition, c'est-à-dire en bloquant la réaction chimique", "Refroidissement", "Dilution du combustible", "Absorption des fumées"], "a": [0], "e": "La poudre casse la réaction en chaîne de la combustion (et étouffe en partie)."},
  {"t": "Le feu et ses conséquences", "q": "L'extincteur au CO2 est particulièrement adapté :", "o": ["Aux feux de liquides et aux feux à proximité d'appareils électriques", "Aux feux de bois en profondeur", "Aux feux de métaux", "Aux feux de friteuse"], "a": [0], "e": "Le CO2 ne laisse pas de résidu et ne conduit pas l'électricité. Il refroidit peu, donc risque de reprise sur un feu de classe A."},
  {"t": "Le feu et ses conséquences", "q": "Quels sont les dangers liés à l'extincteur au CO2 ?", "o": ["Brûlure par le froid si l'on tient le diffuseur", "Risque d'asphyxie dans un petit local fermé", "Il laisse un résidu corrosif", "Il conduit l'électricité"], "a": [0, 1], "e": "Le gaz sort à environ −78 °C et chasse l'oxygène. On tient l'extincteur par la poignée, pas par le diffuseur."},
  {"t": "Le feu et ses conséquences", "q": "La poudre ABC est utilisable sur :", "o": ["Les feux de classes A, B et C", "Uniquement les feux de classe A", "Uniquement les feux de métaux", "Uniquement les feux de gaz"], "a": [0], "e": "C'est la poudre polyvalente. Elle salit beaucoup et gêne la visibilité dans un local."},
  {"t": "Le feu et ses conséquences", "q": "Face à un feu de friteuse, il faut :", "o": ["Couvrir (couvercle ou couverture anti-feu) et couper l'alimentation", "Jeter un verre d'eau", "Déplacer la friteuse dehors", "Souffler sur les flammes"], "a": [0], "e": "On étouffe et on supprime la source de chaleur, sans jamais utiliser d'eau."},
  {"t": "Le feu et ses conséquences", "q": "Pourquoi ne jamais projeter d'eau sur de l'huile enflammée ?", "o": ["L'eau se vaporise d'un coup et projette l'huile en feu", "L'eau rend l'huile plus lourde", "L'eau n'a aucun effet", "L'eau produit du CO"], "a": [0], "e": "La vaporisation instantanée provoque une boule de feu très dangereuse."},
  {"t": "Le feu et ses conséquences", "q": "Avec un extincteur, on vise :", "o": ["La base des flammes", "Le haut des flammes", "La fumée", "Le plafond"], "a": [0], "e": "C'est à la base que se trouve le combustible en train de brûler. On balaie la zone."},
  {"t": "Le feu et ses conséquences", "q": "En extérieur, on attaque un feu :", "o": ["Dos au vent", "Face au vent", "Vent de côté uniquement", "Le vent n'a pas d'importance"], "a": [0], "e": "Dos au vent, le produit va vers le feu et la chaleur et les fumées partent loin de l'opérateur."},
  {"t": "Le feu et ses conséquences", "q": "Sur un extincteur à pression auxiliaire :", "o": ["Le gaz propulseur est dans une cartouche qu'il faut percuter", "L'appareil est toujours sous pression", "On lit la pression sur un manomètre", "Il n'y a pas de gaz propulseur"], "a": [0], "e": "On percute la cartouche, on attend quelques secondes, puis on appuie sur la poignée."},
  {"t": "Le feu et ses conséquences", "q": "Un extincteur à pression permanente se reconnaît le plus souvent :", "o": ["À son manomètre", "À sa cartouche extérieure", "À sa couleur bleue", "À l'absence de goupille"], "a": [0], "e": "Le manomètre indique si l'appareil est sous pression (aiguille dans le vert). Exception : le CO2."},
  {"t": "Le feu et ses conséquences", "q": "La réaction au feu d'un matériau désigne :", "o": ["Sa capacité à alimenter le feu et à participer à la combustion", "Le temps pendant lequel un élément conserve son rôle", "Son poids", "Sa couleur sous la chaleur"], "a": [0], "e": "Réaction au feu = matériau (est-ce que ça brûle ?). Résistance au feu = élément de construction (combien de temps ça tient ?)."},
  {"t": "Le feu et ses conséquences", "q": "La résistance au feu d'un élément de construction désigne :", "o": ["Le temps pendant lequel il conserve ses fonctions", "Sa capacité à s'enflammer", "Sa température de fusion", "Sa toxicité"], "a": [0], "e": "Elle s'exprime en minutes : 30, 60, 90, 120…"},
  {"t": "Le feu et ses conséquences", "q": "Un matériau classé A1 en Euroclasses est :", "o": ["Incombustible", "Facilement inflammable", "Moyennement inflammable", "Non classé"], "a": [0], "e": "Échelle de A1 (incombustible) à F (non classé). A1 correspond à l'ancien M0."},
  {"t": "Le feu et ses conséquences", "q": "Dans un classement « B-s1, d0 », la mention d0 signifie :", "o": ["Aucune gouttelette ou particule enflammée", "Une forte production de fumée", "Un matériau incombustible", "Une durée de 0 minute"], "a": [0], "e": "« s » concerne la fumée (s1 = faible), « d » les gouttelettes enflammées (d0 = aucune)."},
  {"t": "Le feu et ses conséquences", "q": "L'ancien classement M0 correspond à un matériau :", "o": ["Incombustible", "Non inflammable", "Facilement inflammable", "Difficilement inflammable"], "a": [0], "e": "M0 incombustible, M1 non inflammable, M2 difficilement, M3 moyennement, M4 facilement inflammable."},
  {"t": "Le feu et ses conséquences", "q": "Le critère R de résistance au feu correspond à :", "o": ["La résistance mécanique (stabilité au feu)", "L'étanchéité aux flammes", "L'isolation thermique", "La réaction au feu"], "a": [0], "e": "R = ancien « stable au feu » (SF)."},
  {"t": "Le feu et ses conséquences", "q": "Le critère E de résistance au feu correspond à :", "o": ["L'étanchéité aux flammes et aux gaz chauds", "La stabilité", "L'isolation thermique", "L'évacuation"], "a": [0], "e": "E = ancien « pare-flammes » (PF)."},
  {"t": "Le feu et ses conséquences", "q": "Un élément classé REI 60 est :", "o": ["Coupe-feu 1 heure", "Pare-flammes 30 minutes", "Stable au feu 2 heures", "Incombustible"], "a": [0], "e": "R + E + I = coupe-feu (ancien CF). 60 = 60 minutes."},
  {"t": "Le feu et ses conséquences", "q": "Une personne dont les vêtements prennent feu :", "o": ["On l'empêche de courir, on l'allonge et on étouffe les flammes", "On la laisse courir vers l'extérieur", "On l'asperge au CO2 au visage", "On attend les secours sans agir"], "a": [0], "e": "Courir attise les flammes. On l'allonge et on l'enveloppe (couverture, vêtement) ou on la fait rouler au sol."},
  {"t": "Le feu et ses conséquences", "q": "Un court-circuit est une cause d'incendie d'origine :", "o": ["Électrique", "Naturelle", "Chimique", "Humaine volontaire"], "a": [0], "e": "Les causes électriques (surcharge, court-circuit, échauffement) sont parmi les plus fréquentes."},
  {"t": "Le feu et ses conséquences", "q": "Avant d'ouvrir la porte d'un local où l'on suspecte un feu :", "o": ["On touche la porte avec le dos de la main pour sentir la chaleur", "On l'ouvre en grand d'un coup", "On se place face à la porte", "On casse la vitre"], "a": [0], "e": "Une porte chaude signale un feu derrière. On ouvre prudemment, en se protégeant derrière le battant."},
  {"t": "Le feu et ses conséquences", "q": "L'eau pulvérisée est plus efficace que le jet droit sur un feu de classe A car :", "o": ["Les fines gouttelettes absorbent mieux la chaleur", "Elle porte plus loin", "Elle consomme plus d'eau", "Elle fait plus de bruit"], "a": [0], "e": "Plus la surface d'échange est grande, plus le refroidissement est rapide."},
  {"t": "Le feu et ses conséquences", "q": "Un mélange gaz-air ne peut s'enflammer que :", "o": ["Entre sa limite inférieure (LIE) et sa limite supérieure (LSE) d'inflammabilité", "Au-dessus de sa LSE", "En dessous de sa LIE", "À n'importe quelle concentration"], "a": [0], "e": "Trop peu de gaz (mélange pauvre) ou trop de gaz (mélange riche) : pas d'inflammation."},
  {"t": "Sécurité incendie", "q": "Un ERP (établissement recevant du public) est :", "o": ["Tout bâtiment ou local où des personnes sont admises librement, moyennant rétribution ou sur invitation", "Uniquement un bâtiment public de l'État", "Tout immeuble de plus de 28 mètres", "Uniquement un magasin"], "a": [0], "e": "Est considérée comme public toute personne admise dans l'établissement en plus du personnel."},
  {"t": "Sécurité incendie", "q": "Un ERP de 1re catégorie accueille :", "o": ["Plus de 1 500 personnes", "De 701 à 1 500 personnes", "De 301 à 700 personnes", "300 personnes et moins"], "a": [0], "e": "1re > 1 500 ; 2e de 701 à 1 500 ; 3e de 301 à 700 ; 4e 300 et moins ; 5e sous le seuil du type."},
  {"t": "Sécurité incendie", "q": "Un ERP de 2e catégorie accueille :", "o": ["De 701 à 1 500 personnes", "Plus de 1 500 personnes", "De 301 à 700 personnes", "Moins de 100 personnes"], "a": [0], "e": "Retiens la suite : 1 500, 700, 300."},
  {"t": "Sécurité incendie", "q": "Un ERP de 3e catégorie accueille :", "o": ["De 301 à 700 personnes", "De 701 à 1 500 personnes", "300 personnes et moins", "Plus de 1 500 personnes"], "a": [0], "e": "3e catégorie : de 301 à 700 personnes."},
  {"t": "Sécurité incendie", "q": "Un ERP de 4e catégorie accueille :", "o": ["300 personnes et moins, au-dessus du seuil de la 5e catégorie", "De 301 à 700 personnes", "Moins de 50 personnes, quel que soit le type", "Plus de 1 500 personnes"], "a": [0], "e": "La 4e catégorie s'arrête là où commence la 5e, qui dépend du type d'établissement."},
  {"t": "Sécurité incendie", "q": "Un ERP de 5e catégorie est un établissement :", "o": ["Dont l'effectif est inférieur au seuil fixé pour son type", "De plus de 1 500 personnes", "Sans aucun public", "De plus de 28 mètres de haut"], "a": [0], "e": "Le seuil varie selon le type (M, N, L…). Ce sont les « petits établissements »."},
  {"t": "Sécurité incendie", "q": "Pour classer un ERP de la 1re à la 4e catégorie, on compte :", "o": ["Le public et le personnel", "Le public uniquement", "Le personnel uniquement", "Le nombre de places de parking"], "a": [0], "e": "Pour la 5e catégorie, on ne compte que le public."},
  {"t": "Sécurité incendie", "q": "Les ERP de 1re à 4e catégorie forment :", "o": ["Le 1er groupe", "Le 2e groupe", "Le 3e groupe", "Les établissements spéciaux"], "a": [0], "e": "1er groupe = 1re à 4e catégorie ; 2e groupe = 5e catégorie."},
  {"t": "Sécurité incendie", "q": "Un magasin de vente ou un centre commercial est un ERP de type :", "o": ["M", "N", "W", "T"], "a": [0], "e": "M comme magasin."},
  {"t": "Sécurité incendie", "q": "Un restaurant ou un bar est un ERP de type :", "o": ["N", "M", "O", "R"], "a": [0], "e": "N : restaurants et débits de boissons."},
  {"t": "Sécurité incendie", "q": "Un hôtel est un ERP de type :", "o": ["O", "N", "U", "J"], "a": [0], "e": "O : hôtels et pensions de famille. (En IGH, l'hôtel est classé GHO.)"},
  {"t": "Sécurité incendie", "q": "Un établissement de soins (hôpital, clinique) est un ERP de type :", "o": ["U", "J", "R", "S"], "a": [0], "e": "U : établissements sanitaires. J : structures d'accueil pour personnes âgées ou handicapées."},
  {"t": "Sécurité incendie", "q": "Une structure d'accueil pour personnes âgées ou handicapées est un ERP de type :", "o": ["J", "U", "P", "V"], "a": [0], "e": "J : public particulièrement vulnérable, souvent avec évacuation différée."},
  {"t": "Sécurité incendie", "q": "Une salle de spectacles, de conférences ou de réunions est un ERP de type :", "o": ["L", "T", "S", "X"], "a": [0], "e": "L : salles d'audition, de conférences, de réunions, de spectacles."},
  {"t": "Sécurité incendie", "q": "Des bureaux, une administration ou une banque sont un ERP de type :", "o": ["W", "Y", "M", "GA"], "a": [0], "e": "W : administrations, banques, bureaux. (En IGH, ce sont les GHW.)"},
  {"t": "Sécurité incendie", "q": "Un établissement d'enseignement est un ERP de type :", "o": ["R", "S", "L", "O"], "a": [0], "e": "R : enseignement, colonies de vacances."},
  {"t": "Sécurité incendie", "q": "Un musée est un ERP de type :", "o": ["Y", "T", "S", "V"], "a": [0], "e": "Y : musées. T : salles d'exposition. S : bibliothèques."},
  {"t": "Sécurité incendie", "q": "Un établissement sportif couvert est un ERP de type :", "o": ["X", "PA", "P", "CTS"], "a": [0], "e": "X : sportif couvert. PA : établissement de plein air."},
  {"t": "Sécurité incendie", "q": "Un parc de stationnement couvert est un ERP de type :", "o": ["PS", "GA", "PA", "SG"], "a": [0], "e": "PS est un type d'établissement spécial, comme GA (gares) ou CTS (chapiteaux)."},
  {"t": "Sécurité incendie", "q": "Un chapiteau ou une tente accueillant du public est classé :", "o": ["CTS", "SG", "PA", "L"], "a": [0], "e": "CTS : chapiteaux, tentes et structures. SG : structures gonflables."},
  {"t": "Sécurité incendie", "q": "Une salle de danse ou une salle de jeux est un ERP de type :", "o": ["P", "L", "X", "N"], "a": [0], "e": "P : salles de danse et salles de jeux."},
  {"t": "Sécurité incendie", "q": "Un lieu de culte est un ERP de type :", "o": ["V", "U", "Y", "R"], "a": [0], "e": "V : établissements de culte."},
  {"t": "Sécurité incendie", "q": "Un immeuble d'habitation est un IGH lorsque le plancher bas de son dernier niveau est situé à :", "o": ["Plus de 50 mètres", "Plus de 28 mètres", "Plus de 8 mètres", "Plus de 100 mètres"], "a": [0], "e": "Habitation : > 50 m. Autres usages : > 28 m."},
  {"t": "Sécurité incendie", "q": "Un immeuble de bureaux est un IGH lorsque le plancher bas de son dernier niveau est situé à :", "o": ["Plus de 28 mètres", "Plus de 50 mètres", "Plus de 18 mètres", "Plus de 200 mètres"], "a": [0], "e": "Pour tous les usages autres que l'habitation, le seuil est 28 m."},
  {"t": "Sécurité incendie", "q": "La hauteur d'un IGH se mesure :", "o": ["Du sol le plus haut utilisable par les engins de secours au plancher bas du dernier niveau", "Du sous-sol au toit", "Du trottoir au sommet de l'antenne", "Du rez-de-chaussée au plafond du dernier niveau"], "a": [0], "e": "C'est la hauteur qui compte pour les échelles des pompiers."},
  {"t": "Sécurité incendie", "q": "Un IGH à usage de bureaux de plus de 50 mètres est classé :", "o": ["GHW2", "GHW1", "GHA", "GHZ"], "a": [0], "e": "GHW1 : bureaux de 28 à 50 m. GHW2 : bureaux de plus de 50 m."},
  {"t": "Sécurité incendie", "q": "Un IGH à usage d'hôtel est classé :", "o": ["GHO", "GHA", "GHU", "GHR"], "a": [0], "e": "GHA habitation, GHO hôtel, GHR enseignement, GHS archives, GHU sanitaire, GHW bureaux, GHZ mixte."},
  {"t": "Sécurité incendie", "q": "Un IGH à usage sanitaire est classé :", "o": ["GHU", "GHS", "GHR", "GHO"], "a": [0], "e": "U comme pour les ERP de soins."},
  {"t": "Sécurité incendie", "q": "Un ITGH (immeuble de très grande hauteur) dépasse :", "o": ["200 mètres", "100 mètres", "150 mètres", "300 mètres"], "a": [0], "e": "Au-delà de 200 m, des règles renforcées s'appliquent."},
  {"t": "Sécurité incendie", "q": "Quelle est la largeur d'un dégagement de 1 unité de passage (UP) ?", "o": ["0,90 mètre", "0,60 mètre", "1,20 mètre", "1,40 mètre"], "a": [0], "e": "1 UP = 0,90 m ; 2 UP = 1,40 m ; au-delà, 0,60 m par UP."},
  {"t": "Sécurité incendie", "q": "Quelle est la largeur d'un dégagement de 2 UP ?", "o": ["1,40 mètre", "1,20 mètre", "1,80 mètre", "1,00 mètre"], "a": [0], "e": "À partir de 3 UP : nombre d'UP × 0,60 m (3 UP = 1,80 m)."},
  {"t": "Sécurité incendie", "q": "La longueur maximale d'un cul-de-sac dans un ERP est de :", "o": ["10 mètres", "20 mètres", "30 mètres", "5 mètres"], "a": [0], "e": "Au-delà, le public risquerait d'être piégé sans autre issue."},
  {"t": "Sécurité incendie", "q": "La distance maximale à parcourir pour rejoindre un escalier, lorsqu'on a le choix entre plusieurs, est de :", "o": ["40 mètres", "30 mètres", "10 mètres", "60 mètres"], "a": [0], "e": "40 m s'il y a un choix entre plusieurs issues, 30 m dans le cas contraire."},
  {"t": "Sécurité incendie", "q": "Les portes des locaux pouvant recevoir plus de 50 personnes doivent :", "o": ["S'ouvrir dans le sens de la sortie", "S'ouvrir vers l'intérieur", "Être coulissantes", "Rester fermées à clé"], "a": [0], "e": "Une foule qui pousse ne doit pas bloquer la porte."},
  {"t": "Sécurité incendie", "q": "Un dégagement, c'est :", "o": ["Toute partie de la construction permettant l'évacuation (porte, couloir, escalier…)", "Un local de stockage", "Uniquement la porte d'entrée", "Un espace vert extérieur"], "a": [0], "e": "Les dégagements doivent rester libres et praticables en permanence."},
  {"t": "Sécurité incendie", "q": "Le compartimentage a pour but :", "o": ["De limiter la propagation du feu en divisant le bâtiment en volumes protégés", "D'augmenter l'effectif autorisé", "De faciliter le ménage", "De supprimer le désenfumage"], "a": [0], "e": "Parois et portes coupe-feu cantonnent le sinistre dans un volume limité."},
  {"t": "Sécurité incendie", "q": "Quels sont les objectifs du désenfumage ?", "o": ["Rendre les cheminements d'évacuation praticables", "Limiter la propagation du feu", "Faciliter l'intervention des secours", "Éteindre le feu"], "a": [0, 1, 2], "e": "Le désenfumage n'éteint pas le feu : il évacue fumées et chaleur."},
  {"t": "Sécurité incendie", "q": "En désenfumage naturel, le principe est :", "o": ["Amenées d'air en partie basse, évacuation des fumées en partie haute", "Amenées d'air en partie haute, évacuation en partie basse", "Tout fermer pour étouffer le feu", "Souffler la fumée vers le bas"], "a": [0], "e": "Les fumées chaudes montent : on les sort par le haut et on fait entrer l'air frais par le bas."},
  {"t": "Sécurité incendie", "q": "Le désenfumage mécanique utilise :", "o": ["Des ventilateurs et extracteurs", "Uniquement des fenêtres", "Des extincteurs", "Des sprinklers"], "a": [0], "e": "Il est utilisé quand l'évacuation naturelle n'est pas possible (sous-sols, locaux aveugles…)."},
  {"t": "Sécurité incendie", "q": "L'autonomie minimale d'un BAES (bloc autonome d'éclairage de sécurité) est de :", "o": ["1 heure", "15 minutes", "30 minutes", "4 heures"], "a": [0], "e": "En cas de coupure de courant, il doit éclairer au moins 1 heure."},
  {"t": "Sécurité incendie", "q": "L'éclairage d'évacuation permet :", "o": ["De reconnaître et d'utiliser les cheminements jusqu'aux sorties", "D'éclairer la façade", "De remplacer l'éclairage normal en journée", "De signaler les extincteurs"], "a": [0], "e": "L'éclairage d'ambiance (anti-panique) évite, lui, que les gens se retrouvent dans le noir complet."},
  {"t": "Sécurité incendie", "q": "Un panneau de signalisation vert indique :", "o": ["L'évacuation et les secours", "Le matériel d'incendie", "Une interdiction", "Un danger"], "a": [0], "e": "Vert : évacuation, premiers secours. Rouge : matériel incendie et interdiction. Jaune : danger. Bleu : obligation."},
  {"t": "Sécurité incendie", "q": "Un panneau rectangulaire rouge indique :", "o": ["Un matériel de lutte contre l'incendie", "Une sortie de secours", "Une obligation", "Un local à risque"], "a": [0], "e": "Extincteur, RIA, déclencheur manuel, couverture anti-feu…"},
  {"t": "Sécurité incendie", "q": "Donner l'alarme, c'est :", "o": ["Prévenir les occupants qu'ils doivent évacuer", "Appeler les sapeurs-pompiers", "Éteindre le feu", "Couper le courant"], "a": [0], "e": "Alarme = les occupants. Alerte = les secours."},
  {"t": "Sécurité incendie", "q": "Donner l'alerte, c'est :", "o": ["Prévenir les sapeurs-pompiers", "Faire évacuer le public", "Déclencher le sprinkler", "Fermer les portes coupe-feu"], "a": [0], "e": "Par le 18 ou le 112, ou par une liaison directe avec les pompiers."},
  {"t": "Sécurité incendie", "q": "Le numéro d'appel des sapeurs-pompiers est le :", "o": ["18", "15", "17", "114"], "a": [0], "e": "15 : SAMU. 17 : police. 112 : numéro d'urgence européen. 114 : pour les personnes sourdes ou malentendantes (SMS)."},
  {"t": "Sécurité incendie", "q": "Le numéro d'urgence européen, utilisable partout dans l'Union européenne, est le :", "o": ["112", "114", "911", "118"], "a": [0], "e": "Il fonctionne depuis n'importe quel téléphone, y compris à l'étranger."},
  {"t": "Sécurité incendie", "q": "Que doit contenir un message d'alerte ?", "o": ["L'adresse précise", "La nature du sinistre", "Le nombre et l'état des victimes", "Les horaires d'ouverture de l'établissement"], "a": [0, 1, 2], "e": "On ajoute son identité et un numéro de rappel, et on ne raccroche que lorsque l'opérateur le dit."},
  {"t": "Sécurité incendie", "q": "Lors d'une évacuation, le rôle du guide-file est :", "o": ["De conduire les personnes vers la sortie", "De vérifier que personne n'est resté en arrière", "D'appeler les pompiers", "De couper le gaz"], "a": [0], "e": "Il ouvre la marche et emmène le groupe jusqu'au point de rassemblement."},
  {"t": "Sécurité incendie", "q": "Lors d'une évacuation, le rôle du serre-file est :", "o": ["De fermer la marche, vérifier que personne ne reste et fermer les portes", "De passer devant le groupe", "D'attendre les pompiers dans la rue", "D'éteindre le feu"], "a": [0], "e": "Il contrôle les locaux (toilettes, réserves…) et ferme les portes derrière lui."},
  {"t": "Sécurité incendie", "q": "Le point de rassemblement sert à :", "o": ["Regrouper et compter les personnes évacuées", "Stocker le matériel", "Garer les véhicules de secours", "Former le personnel"], "a": [0], "e": "Il permet de savoir rapidement s'il manque quelqu'un."},
  {"t": "Sécurité incendie", "q": "Un espace d'attente sécurisé (EAS) permet :", "o": ["Aux personnes qui ne peuvent pas évacuer seules d'attendre les secours à l'abri", "De stocker du matériel", "Au personnel de faire une pause", "Aux pompiers de garer leurs engins"], "a": [0], "e": "C'est la base de l'évacuation différée des personnes à mobilité réduite."},
  {"t": "Sécurité incendie", "q": "Pendant une évacuation, les ascenseurs :", "o": ["Ne doivent pas être utilisés", "Doivent être utilisés en priorité", "Sont réservés au public", "Servent à accélérer l'évacuation"], "a": [0], "e": "Risque de blocage en cabine et d'aspiration des fumées dans la gaine."},
  {"t": "Sécurité incendie", "q": "Une façade doit être desservie par une voie échelles lorsque le plancher bas du dernier niveau est à plus de :", "o": ["8 mètres", "28 mètres", "50 mètres", "3 mètres"], "a": [0], "e": "Au-delà de 8 m, les pompiers doivent pouvoir mettre en station leurs échelles."},
  {"t": "Sécurité incendie", "q": "Que trouve-t-on dans le registre de sécurité d'un ERP ?", "o": ["Les vérifications périodiques", "Les travaux réalisés", "Les formations et exercices du personnel", "Le planning des congés"], "a": [0, 1, 2], "e": "Il est présenté à la commission de sécurité lors de ses visites."},
  {"t": "Sécurité incendie", "q": "Dans un ERP, le responsable de la sécurité est :", "o": ["L'exploitant", "Le maire", "L'agent SSIAP 1", "Le commandant des pompiers"], "a": [0], "e": "L'exploitant est responsable du respect des règles. Le maire exerce la police administrative."},
  {"t": "Sécurité incendie", "q": "La commission de sécurité :", "o": ["Émet un avis ; la décision (ouverture, fermeture) revient au maire", "Décide seule de fermer un établissement", "Vérifie les extincteurs chaque mois", "Remplace l'exploitant"], "a": [0], "e": "Elle est consultative : c'est l'autorité de police qui décide."},
  {"t": "Sécurité incendie", "q": "Le permis de feu est obligatoire pour :", "o": ["Les travaux par points chauds (soudure, meulage, découpe…)", "Allumer une cigarette", "Utiliser un ordinateur", "Faire une ronde"], "a": [0], "e": "Il fixe les précautions avant, pendant et après les travaux."},
  {"t": "Sécurité incendie", "q": "Après des travaux par points chauds, il faut :", "o": ["Surveiller la zone, car un feu couvant peut se déclarer plusieurs heures après", "Fermer à clé et partir", "Arroser tout le bâtiment", "Couper le SSI"], "a": [0], "e": "Une étincelle peut couver longtemps dans un isolant ou un faux plafond."},
  {"t": "Sécurité incendie", "q": "Un plan d'évacuation affiche notamment :", "o": ["« Vous êtes ici », les cheminements et les sorties", "Le salaire des agents", "Les horaires des rondes", "Le plan de toute la ville"], "a": [0], "e": "Il indique aussi les moyens d'alarme et d'extinction proches."},
  {"t": "Installations techniques", "q": "Le SSI (système de sécurité incendie) est composé :", "o": ["D'un SDI et d'un SMSI", "Uniquement de détecteurs", "Uniquement d'extincteurs", "D'un groupe électrogène"], "a": [0], "e": "SDI : système de détection incendie. SMSI : système de mise en sécurité incendie."},
  {"t": "Installations techniques", "q": "Que comprend un système de détection incendie (SDI) ?", "o": ["Des détecteurs automatiques", "Des déclencheurs manuels", "Un ECS (équipement de contrôle et de signalisation)", "Des RIA"], "a": [0, 1, 2], "e": "Le SDI détecte et signale. Le SMSI met le bâtiment en sécurité."},
  {"t": "Installations techniques", "q": "L'ECS est :", "o": ["L'équipement de contrôle et de signalisation", "L'éclairage de circulation de secours", "L'extincteur à charge sèche", "L'escalier de commande de secours"], "a": [0], "e": "Il reçoit les signaux des détecteurs et signale le feu au poste de sécurité."},
  {"t": "Installations techniques", "q": "Le CMSI est :", "o": ["Le centralisateur de mise en sécurité incendie", "Le contrôle manuel du système incendie", "Le comité de mise en sécurité", "Le centre médical de secours incendie"], "a": [0], "e": "Il commande les DAS (portes, clapets, désenfumage…) et l'alarme générale."},
  {"t": "Installations techniques", "q": "Un DAS est :", "o": ["Un dispositif actionné de sécurité", "Un détecteur automatique de signal", "Un déclencheur d'alarme sonore", "Un document d'alerte des secours"], "a": [0], "e": "Exemples : porte coupe-feu sur ventouse, clapet, volet de désenfumage, exutoire."},
  {"t": "Installations techniques", "q": "Un DM est :", "o": ["Un déclencheur manuel", "Un détecteur multiple", "Un dispositif mécanique", "Un disjoncteur magnétique"], "a": [0], "e": "Le boîtier rouge « bris de glace » ou réarmable."},
  {"t": "Installations techniques", "q": "Quelle est la catégorie de SSI la plus complète ?", "o": ["Catégorie A", "Catégorie B", "Catégorie D", "Catégorie E"], "a": [0], "e": "Le SSI de catégorie A comporte obligatoirement une détection automatique."},
  {"t": "Installations techniques", "q": "Un SSI de catégorie A comporte obligatoirement :", "o": ["Une détection automatique d'incendie", "Un sprinkler", "Un groupe électrogène", "Une colonne sèche"], "a": [0], "e": "Il est associé à un équipement d'alarme de type 1."},
  {"t": "Installations techniques", "q": "L'équipement d'alarme associé à un SSI de catégorie A est de type :", "o": ["1", "2a", "3", "4"], "a": [0], "e": "Le type 1 intègre la détection automatique."},
  {"t": "Installations techniques", "q": "Un équipement d'alarme de type 4 peut être :", "o": ["Un dispositif sonore simple (cloche, sifflet, corne)", "Un SSI de catégorie A", "Un sprinkler", "Un ECS"], "a": [0], "e": "C'est l'équipement le plus simple, à condition d'être audible de partout."},
  {"t": "Installations techniques", "q": "L'alarme restreinte :", "o": ["Prévient le personnel de sécurité (poste de sécurité) sans alerter le public", "Fait évacuer tout le bâtiment", "Appelle automatiquement le 18", "Déclenche le sprinkler"], "a": [0], "e": "Elle permet la levée de doute avant le déclenchement de l'alarme générale."},
  {"t": "Installations techniques", "q": "La temporisation de l'alarme générale ne peut pas dépasser :", "o": ["5 minutes", "1 minute", "10 minutes", "15 minutes"], "a": [0], "e": "Ce délai sert à la levée de doute. Passé 5 minutes, l'alarme générale se déclenche."},
  {"t": "Installations techniques", "q": "Un détecteur thermovélocimétrique réagit :", "o": ["À une élévation rapide de la température", "À une température fixe", "À la fumée visible", "Au rayonnement des flammes"], "a": [0], "e": "Le thermostatique, lui, réagit au dépassement d'un seuil fixe."},
  {"t": "Installations techniques", "q": "Un détecteur thermostatique réagit :", "o": ["Au dépassement d'une température fixe", "À une hausse rapide de température", "Aux fumées", "Aux flammes infrarouges"], "a": [0], "e": "Utile dans les locaux où il y a naturellement de la fumée ou de la poussière (cuisine, garage)."},
  {"t": "Installations techniques", "q": "Un détecteur de flammes réagit :", "o": ["Au rayonnement infrarouge ou ultraviolet des flammes", "À la fumée", "À une hausse de température", "Au CO"], "a": [0], "e": "Adapté aux grands volumes et aux feux de liquides qui font peu de fumée au départ."},
  {"t": "Installations techniques", "q": "Le détecteur ponctuel optique de fumée fonctionne :", "o": ["Par la diffusion de la lumière par les particules de fumée", "Par une source radioactive", "Par la mesure de la température", "Par le bruit"], "a": [0], "e": "C'est le détecteur le plus répandu. Les détecteurs ioniques (radioactifs) sont progressivement retirés."},
  {"t": "Installations techniques", "q": "Un DAS à sécurité positive :", "o": ["Se met en position de sécurité en cas de coupure de son alimentation", "Ne fonctionne qu'avec du courant", "Doit être actionné à la main", "Ne peut jamais être réarmé"], "a": [0], "e": "Exemple : une ventouse relâche la porte coupe-feu dès qu'elle n'est plus alimentée."},
  {"t": "Installations techniques", "q": "Sur une porte coupe-feu, la ventouse électromagnétique :", "o": ["Maintient la porte ouverte et la libère en cas d'alarme ou de coupure de courant", "Bloque la porte fermée à clé", "Ouvre la porte automatiquement en cas de feu", "Sert de poignée"], "a": [0], "e": "Un ferme-porte referme ensuite le battant."},
  {"t": "Installations techniques", "q": "Un clapet coupe-feu est installé :", "o": ["Dans les conduits de ventilation pour stopper la propagation du feu", "Sur les extincteurs", "Sur les portes d'entrée", "Dans les escaliers"], "a": [0], "e": "Il se ferme et rétablit le degré coupe-feu de la paroi traversée."},
  {"t": "Installations techniques", "q": "En SSI, une ZF est :", "o": ["Une zone de désenfumage", "Une zone de feu", "Une zone fermée", "Une zone de formation"], "a": [0], "e": "ZD : détection. ZA : diffusion d'alarme. ZC : compartimentage. ZF : désenfumage (fumée)."},
  {"t": "Installations techniques", "q": "En SSI, une ZD est :", "o": ["Une zone de détection", "Une zone de désenfumage", "Une zone dangereuse", "Une zone de dégagement"], "a": [0], "e": "L'ECS indique la zone de détection en alarme pour orienter la levée de doute."},
  {"t": "Installations techniques", "q": "Un exutoire de fumée est :", "o": ["Une ouverture en toiture qui évacue fumées et chaleur", "Une sortie de secours", "Un extincteur fixe", "Un détecteur"], "a": [0], "e": "Il s'ouvre automatiquement ou par commande manuelle (DCM)."},
  {"t": "Installations techniques", "q": "Un DCM est :", "o": ["Un dispositif de commande manuelle (par exemple du désenfumage)", "Un détecteur de chaleur et de mouvement", "Un disjoncteur", "Un déclencheur d'alarme sonore"], "a": [0], "e": "Il permet d'ouvrir à la main les exutoires ou ouvrants de désenfumage."},
  {"t": "Installations techniques", "q": "En cas d'incendie, les ascenseurs sont :", "o": ["Ramenés au niveau d'évacuation et ne doivent pas être utilisés", "Utilisés pour évacuer le public en priorité", "Bloqués à l'étage du feu", "Laissés en service normal"], "a": [0], "e": "Seuls les sapeurs-pompiers peuvent utiliser un ascenseur prioritaire pompiers."},
  {"t": "Installations techniques", "q": "Lors d'un incendie dans un local sprinklé :", "o": ["Seules les têtes exposées à la chaleur s'ouvrent", "Toutes les têtes s'ouvrent en même temps", "Aucune tête ne s'ouvre sans commande manuelle", "Les têtes s'ouvrent à la fumée"], "a": [0], "e": "Chaque tête possède son ampoule ou fusible qui casse à une température donnée."},
  {"t": "Installations techniques", "q": "Sur une tête de sprinkler, une ampoule rouge éclate vers :", "o": ["68 °C", "30 °C", "120 °C", "200 °C"], "a": [0], "e": "La couleur du liquide indique la température de déclenchement. Rouge = 68 °C, la plus courante."},
  {"t": "Installations techniques", "q": "Le RIA est :", "o": ["Un robinet d'incendie armé, avec un tuyau semi-rigide en eau en permanence", "Un réservoir d'eau pour les pompiers", "Un détecteur", "Un extincteur sur roues"], "a": [0], "e": "Il est utilisable par le personnel formé, sans attendre les pompiers."},

  {"t": "Installations techniques", "q": "Le gaz naturel (gaz de ville) est :", "o": ["Plus léger que l'air", "Plus lourd que l'air", "De même densité que l'air", "Toujours liquide"], "a": [0], "e": "Il s'accumule en partie haute. Butane et propane, plus lourds, s'accumulent en partie basse."},

  {"t": "Installations techniques", "q": "Une porte coupe-feu doit :", "o": ["Rester fermée ou se fermer automatiquement, et ne jamais être calée", "Être calée ouverte pour faciliter le passage", "Être verrouillée à clé en permanence", "Être retirée la nuit"], "a": [0], "e": "Une porte calée ouverte perd toute efficacité. C'est une anomalie à corriger et à noter."},

  {"t": "Installations techniques", "q": "En cas d'alarme, les issues verrouillées (contrôle d'accès) :", "o": ["Se déverrouillent automatiquement", "Restent verrouillées", "Se verrouillent encore plus", "Ne changent pas d'état"], "a": [0], "e": "Elles sont à sécurité positive : elles se déverrouillent aussi en cas de coupure de courant."},
  {"t": "Installations techniques", "q": "En cas d'incendie, la ventilation et la climatisation sont :", "o": ["Arrêtées, sauf si elles participent au désenfumage", "Mises à pleine puissance", "Laissées en fonctionnement normal", "Inversées"], "a": [0], "e": "Sinon, elles risquent de propager les fumées dans tout le bâtiment."},
  {"t": "Rôles et missions de l'agent", "q": "Quelles sont les missions d'un agent SSIAP 1 ?", "o": ["La prévention des incendies", "L'alerte et l'accueil des secours", "L'évacuation du public", "Les vérifications réglementaires annuelles des installations"], "a": [0, 1, 2], "e": "Les vérifications réglementaires sont faites par des techniciens compétents ou des organismes agréés."},
  {"t": "Rôles et missions de l'agent", "q": "Parmi ces tâches, laquelle fait partie des missions de l'agent SSIAP 1 ?", "o": ["L'entretien élémentaire des moyens concourant à la sécurité incendie", "La réparation du SSI", "La maintenance des ascenseurs", "Le contrôle de l'installation électrique"], "a": [0], "e": "Par exemple : vérifier qu'un extincteur est présent, accessible, plombé et sous pression."},
  {"t": "Rôles et missions de l'agent", "q": "Le but principal d'une ronde est :", "o": ["Prévenir et détecter les anomalies et les risques d'incendie", "Compter les clients", "Surveiller les horaires du personnel", "Faire du sport"], "a": [0], "e": "On vérifie aussi les moyens de secours, les portes coupe-feu et les dégagements."},
  {"t": "Rôles et missions de l'agent", "q": "La main courante est :", "o": ["Un registre où l'on note chronologiquement les événements, rondes et interventions", "Une rampe d'escalier", "Un plan d'évacuation", "Une consigne affichée"], "a": [0], "e": "Elle sert aussi à transmettre les informations entre équipes."},
  {"t": "Rôles et missions de l'agent", "q": "Sur une main courante, on ne doit jamais :", "o": ["Arracher une page ou utiliser du correcteur", "Noter l'heure", "Noter les mesures prises", "Signer"], "a": [0], "e": "C'est un document qui peut servir de preuve : une erreur se barre proprement et se signe."},
  {"t": "Rôles et missions de l'agent", "q": "Lors d'une ronde, vous constatez qu'un extincteur a disparu. Que faites-vous ?", "o": ["Je le signale à ma hiérarchie, je le note sur la main courante et je le fais remplacer", "Je ne dis rien", "J'attends la prochaine visite de la commission", "Je vais en acheter un"], "a": [0], "e": "Toute anomalie est signalée, notée et suivie jusqu'à sa correction."},

  {"t": "Rôles et missions de l'agent", "q": "Lors d'une ronde, une porte coupe-feu est calée ouverte. Que faites-vous ?", "o": ["Je retire la cale, je referme la porte et je le note", "Je la laisse, ça facilite le passage", "Je la démonte", "Je mets une seconde cale"], "a": [0], "e": "Une porte coupe-feu calée ne peut plus arrêter le feu ni les fumées."},
