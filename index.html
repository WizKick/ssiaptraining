  {"t": "Rôles et missions de l'agent", "q": "La levée de doute confirme un feu. Que faites-vous ?", "o": ["Je fais alerter les secours et déclencher l'alarme générale, puis j'attaque le feu si possible", "Je réarme le système", "Je retourne au PC sans rien dire", "J'attends la fin de la temporisation sans agir"], "a": [0], "e": "Alerte, alarme, attaque avec les moyens adaptés, puis accueil des secours."},
  {"t": "Rôles et missions de l'agent", "q": "À l'arrivée des sapeurs-pompiers, l'agent SSIAP 1 :", "o": ["Les accueille, les guide, les informe et se met à leur disposition", "Rentre chez lui", "Leur demande une pièce d'identité", "Continue sa ronde"], "a": [0], "e": "Il donne la localisation, la nature du sinistre, les victimes éventuelles, les plans et les clés."},
  {"t": "Rôles et missions de l'agent", "q": "Le COS est :", "o": ["Le commandant des opérations de secours", "Le chef d'équipe SSIAP 2", "Le directeur de l'établissement", "Le coordinateur de sécurité"], "a": [0], "e": "C'est l'officier sapeur-pompier qui dirige les opérations sur place."},
  {"t": "Rôles et missions de l'agent", "q": "Pour entrer en formation SSIAP 1, il faut notamment :", "o": ["Une attestation de secourisme valide (SST, PSC1 ou PSE)", "Le permis de conduire", "Le baccalauréat", "Avoir 25 ans"], "a": [0], "e": "Il faut aussi un certificat médical d'aptitude et savoir renseigner une main courante."},

  {"t": "Rôles et missions de l'agent", "q": "La formation initiale SSIAP 1 dure au minimum :", "o": ["67 heures (hors examen)", "35 heures", "120 heures", "15 heures"], "a": [0], "e": "Elle est complétée par l'examen (QCM et épreuve pratique)."},
  {"t": "Rôles et missions de l'agent", "q": "L'examen SSIAP 1 comporte :", "o": ["Un QCM de 30 questions et une épreuve pratique de ronde", "Un oral de 1 heure uniquement", "Un mémoire écrit", "Un test sportif"], "a": [0], "e": "La ronde comprend des anomalies et un sinistre, et se termine par une inscription sur la main courante."},

  {"t": "Rôles et missions de l'agent", "q": "Un agent SSIAP 1 doit suivre un recyclage :", "o": ["Tous les 3 ans", "Tous les ans", "Tous les 5 ans", "Jamais"], "a": [0], "e": "Sans recyclage dans les délais, il doit suivre une remise à niveau."},
  {"t": "Rôles et missions de l'agent", "q": "Un agent dont le dernier recyclage date de plus de 3 ans doit suivre :", "o": ["Une remise à niveau", "Rien du tout", "Une formation SSIAP 3", "Un simple entretien"], "a": [0], "e": "La remise à niveau est plus longue que le recyclage."},
  {"t": "Rôles et missions de l'agent", "q": "Le chef d'équipe de sécurité incendie est titulaire du :", "o": ["SSIAP 2", "SSIAP 1", "SSIAP 3", "CQP APS"], "a": [0], "e": "SSIAP 1 : agent. SSIAP 2 : chef d'équipe. SSIAP 3 : chef de service."},
  {"t": "Rôles et missions de l'agent", "q": "Le chef de service de sécurité incendie est titulaire du :", "o": ["SSIAP 3", "SSIAP 2", "SSIAP 1", "PSE 2"], "a": [0], "e": "Il encadre le service et conseille l'exploitant."},
  {"t": "Rôles et missions de l'agent", "q": "Le diplôme SSIAP 1 permet d'exercer :", "o": ["Dans les ERP et les IGH", "Uniquement dans les IGH", "Uniquement dans les hôpitaux", "Uniquement en extérieur"], "a": [0], "e": "L'agent travaille dans les établissements soumis à un service de sécurité incendie."},
  {"t": "Rôles et missions de l'agent", "q": "La sensibilisation des employés consiste notamment à :", "o": ["Leur apprendre à utiliser un extincteur et à réagir lors d'une évacuation", "Les surveiller", "Contrôler leurs horaires", "Leur faire passer le SSIAP"], "a": [0], "e": "C'est une des missions de l'agent : un personnel formé réagit plus vite."},
  {"t": "Rôles et missions de l'agent", "q": "Le PC de sécurité (poste central de sécurité) est :", "o": ["Le local où sont centralisés les reports du SSI et les moyens de communication", "Le bureau du directeur", "Le local de stockage des extincteurs", "Le parking des pompiers"], "a": [0], "e": "C'est le cœur du service : il ne doit pas être utilisé à d'autres fins."},
  {"t": "Rôles et missions de l'agent", "q": "Face à une victime, l'ordre des actions est :", "o": ["Protéger, alerter, secourir", "Secourir, protéger, alerter", "Alerter, secourir, protéger", "Secourir uniquement"], "a": [0], "e": "On évite d'abord le suraccident, puis on alerte, puis on porte secours."},
  {"t": "Rôles et missions de l'agent", "q": "Une consigne particulière concerne :", "o": ["Un local, un poste ou un risque précis", "Tout l'établissement de façon générale", "Uniquement le public", "Uniquement les pompiers"], "a": [0], "e": "La consigne générale, elle, s'applique à l'ensemble de l'établissement."},
  {"t": "Rôles et missions de l'agent", "q": "Lors d'une évacuation, une personne en fauteuil roulant se trouve à l'étage. L'agent :", "o": ["L'accompagne vers un espace d'attente sécurisé et signale sa position aux secours", "La laisse sur place sans rien dire", "La fait descendre par l'ascenseur", "Lui demande d'attendre la fin de l'alerte"], "a": [0], "e": "Les secours doivent savoir où se trouvent les personnes qui attendent une évacuation différée."},
  {"t": "Rôles et missions de l'agent", "q": "L'assistance à personnes consiste à :", "o": ["Porter secours aux victimes en attendant les secours spécialisés", "Servir de guide touristique", "Remplacer le médecin", "Transporter les blessés à l'hôpital"], "a": [0], "e": "D'où l'obligation d'une formation de secourisme valide."},
  {"t": "Le feu et ses conséquences", "q": "La pyrolyse, c'est :", "o": ["La décomposition d'un matériau par la chaleur, qui libère des gaz combustibles", "L'extinction par l'eau", "La propagation par les gaines", "Un type d'extincteur"], "a": [0], "e": "Un matériau chauffé dégage des gaz inflammables avant même de s'enflammer : c'est ce qui alimente les flammes."},
  {"t": "Le feu et ses conséquences", "q": "Une combustion lente (rouille, feu couvant) se caractérise par :", "o": ["Peu ou pas de flammes et un dégagement de chaleur faible", "De grandes flammes", "Une explosion", "L'absence totale de fumée"], "a": [0], "e": "La combustion vive produit des flammes ; l'explosion est une combustion extrêmement rapide."},
  {"t": "Le feu et ses conséquences", "q": "Une explosion est :", "o": ["Une combustion extrêmement rapide avec une onde de pression", "Une combustion lente", "Un feu de classe A", "Un feu couvant"], "a": [0], "e": "Elle survient notamment quand un mélange gaz-air est entre sa LIE et sa LSE."},
  {"t": "Le feu et ses conséquences", "q": "Sous l'effet d'un incendie, une structure en acier :", "o": ["Se dilate et perd sa résistance mécanique", "Devient plus solide", "Ne subit aucun effet", "Devient incombustible puis combustible"], "a": [0], "e": "L'acier ne brûle pas, mais il se déforme et perd sa résistance avec la chaleur, d'où les risques d'effondrement."},
  {"t": "Le feu et ses conséquences", "q": "Quels sont les produits de la combustion ?", "o": ["Des flammes", "De la chaleur", "Des fumées et des gaz", "De l'oxygène pur"], "a": [0, 1, 2], "e": "La combustion consomme de l'oxygène, elle n'en produit pas."},
  {"t": "Le feu et ses conséquences", "q": "Pour utiliser un extincteur à pression auxiliaire, l'ordre correct est :", "o": ["Dégoupiller, percuter, attendre quelques secondes, attaquer à la base des flammes", "Percuter, attaquer, puis dégoupiller", "Attaquer, puis dégoupiller", "Retourner l'extincteur puis secouer"], "a": [0], "e": "On s'approche progressivement et on éteint par balayage."},
  {"t": "Le feu et ses conséquences", "q": "Après avoir utilisé un extincteur, même partiellement :", "o": ["On ne le remet pas en place : on le signale pour le faire recharger", "On le remet à sa place", "On le jette", "On le revisse simplement"], "a": [0], "e": "Un extincteur entamé peut être vide au prochain feu."},
  {"t": "Le feu et ses conséquences", "q": "Une fois le feu éteint, l'agent :", "o": ["Surveille les lieux pour éviter une reprise de feu", "Part immédiatement", "Rouvre toutes les portes", "Réarme le SSI sans prévenir"], "a": [0], "e": "Un feu peut couver et repartir, surtout dans les matériaux de classe A."},
  {"t": "Sécurité incendie", "q": "Une voie engins est :", "o": ["Une voie accessible aux véhicules de secours, d'une hauteur libre d'au moins 3,50 m", "Une voie piétonne", "Un couloir intérieur", "Un escalier de secours"], "a": [0], "e": "Elle doit rester libre en permanence : aucun stationnement gênant."},
  {"t": "Sécurité incendie", "q": "La largeur minimale de la chaussée d'une voie échelles est de :", "o": ["4 mètres", "2 mètres", "8 mètres", "10 mètres"], "a": [0], "e": "La voie échelles est une partie de voie engins renforcée pour mettre en station les échelles aériennes."},
  {"t": "Sécurité incendie", "q": "Au sujet des voies réservées aux secours, l'agent SSIAP 1 doit :", "o": ["Veiller à ce qu'elles restent libres (pas de véhicules, pas d'obstacles)", "Y garer les véhicules de livraison", "Les fermer la nuit", "Les utiliser comme parking du personnel"], "a": [0], "e": "C'est la vacuité des dessertes : un camion de pompiers bloqué, ce sont des minutes perdues."},
  {"t": "Sécurité incendie", "q": "Une façade accessible comporte :", "o": ["Des baies permettant aux pompiers de pénétrer dans le bâtiment", "Uniquement des murs pleins", "Des fenêtres condamnées", "Des panneaux publicitaires"], "a": [0], "e": "Les baies accessibles ne doivent pas être obstruées (grilles, stores fixes, enseignes)."},
  {"t": "Sécurité incendie", "q": "Un poteau d'incendie normalisé de 100 mm fournit classiquement :", "o": ["60 m³/h pendant 2 heures", "10 m³/h pendant 1 heure", "200 m³/h pendant 10 minutes", "1 m³/h"], "a": [0], "e": "C'est la valeur de référence enseignée pour la défense extérieure contre l'incendie."},
  {"t": "Sécurité incendie", "q": "Un local à risques importants (chaufferie, grande réserve…) est isolé par :", "o": ["Des parois coupe-feu 2 heures et une porte coupe-feu 1 heure avec ferme-porte", "Une simple cloison", "Un rideau", "Une porte vitrée"], "a": [0], "e": "Parois REI/EI 120 et bloc-porte EI 60 muni d'un ferme-porte."},
  {"t": "Sécurité incendie", "q": "Un local à risques moyens est isolé par :", "o": ["Des parois coupe-feu 1 heure et une porte coupe-feu 1/2 heure avec ferme-porte", "Des parois coupe-feu 2 heures", "Aucune paroi particulière", "Un rideau métallique"], "a": [0], "e": "Parois REI/EI 60 et bloc-porte EI 30 muni d'un ferme-porte."},
  {"t": "Sécurité incendie", "q": "Quel local est généralement classé à risques ?", "o": ["Une chaufferie", "Un bureau", "Un couloir", "Un hall d'accueil"], "a": [0], "e": "Chaufferies, réserves, locaux poubelles, ateliers… Leurs portes doivent rester fermées."},
  {"t": "Sécurité incendie", "q": "Le cloisonnement traditionnel consiste à :", "o": ["Séparer les locaux des circulations par des parois et portes résistant au feu", "Supprimer toutes les cloisons", "Mettre des rideaux entre les locaux", "Ouvrir les portes en grand"], "a": [0], "e": "Il protège les circulations, qui servent à l'évacuation."},
  {"t": "Sécurité incendie", "q": "Un escalier encloisonné est :", "o": ["Un escalier protégé par des parois et des portes résistant au feu", "Un escalier extérieur", "Un escalier mécanique", "Un escalier sans porte"], "a": [0], "e": "Il reste praticable pendant l'évacuation et sert aux pompiers pour l'attaque."},
  {"t": "Sécurité incendie", "q": "Les escaliers encloisonnés sont désenfumés grâce à :", "o": ["Un ouvrant en partie haute d'au moins 1 m²", "Un ventilateur au rez-de-chaussée", "Des fenêtres fermées", "Un sprinkler"], "a": [0], "e": "L'ouvrant se commande depuis le niveau d'accès des secours."},
  {"t": "Sécurité incendie", "q": "La règle du « C + D » sert à limiter :", "o": ["La propagation du feu d'un étage à l'autre par la façade", "Le nombre de clients", "La largeur des couloirs", "La durée des rondes"], "a": [0], "e": "C = distance verticale entre deux baies, D = saillie (balcon, auvent) qui casse les flammes."},
  {"t": "Sécurité incendie", "q": "Un local accessible au public doit être désenfumé lorsqu'il dépasse :", "o": ["300 m² en rez-de-chaussée ou en étage, 100 m² en sous-sol", "50 m² partout", "1 000 m² en étage", "Il n'est jamais désenfumé"], "a": [0], "e": "Le sous-sol est plus pénalisant : les fumées s'y évacuent mal."},
  {"t": "Sécurité incendie", "q": "Les dégagements doivent être :", "o": ["Répartis, signalés, éclairés et libres en permanence", "Fermés à clé hors des heures d'ouverture même avec du public", "Encombrés si le magasin est plein", "Réservés au personnel"], "a": [0], "e": "Pendant la présence du public, les portes de sortie doivent s'ouvrir par une manœuvre simple."},
  {"t": "Sécurité incendie", "q": "Un dégagement accessoire est :", "o": ["Un dégagement supplémentaire, non pris en compte dans le calcul réglementaire", "Un dégagement interdit au public", "Le dégagement principal", "Un local de rangement"], "a": [0], "e": "Les dégagements normaux sont ceux qui comptent dans le calcul du nombre et de la largeur."},
  {"t": "Sécurité incendie", "q": "L'évacuation différée concerne surtout :", "o": ["Les établissements où le public ne peut pas évacuer seul (soins, personnes âgées)", "Les magasins", "Les bureaux", "Les restaurants"], "a": [0], "e": "Dans les types U et J, on transfère les personnes vers une zone protégée plutôt que de tout évacuer d'un coup."},
  {"t": "Sécurité incendie", "q": "Le signal sonore d'alarme générale est :", "o": ["Un son d'évacuation normalisé, différent des autres signaux", "Une sonnerie de téléphone", "Une musique d'ambiance", "Laissé au choix de l'agent"], "a": [0], "e": "Tout le monde doit pouvoir le reconnaître comme un ordre d'évacuer."},
  {"t": "Sécurité incendie", "q": "Dans un ERP, il faut au minimum un extincteur à eau pulvérisée de 6 litres pour :", "o": ["200 m² et par niveau", "1 000 m²", "Chaque local", "500 m² par bâtiment"], "a": [0], "e": "Plus des extincteurs adaptés aux risques particuliers (CO2 près des armoires électriques…)."},
  {"t": "Sécurité incendie", "q": "Un extincteur doit être vérifié au minimum :", "o": ["Une fois par an", "Une fois tous les 10 ans", "Une fois par mois par un organisme agréé", "Jamais"], "a": [0], "e": "La vérification est faite par un technicien compétent et notée dans le registre de sécurité."},
  {"t": "Sécurité incendie", "q": "Un extincteur mural est fixé de sorte que sa poignée soit au maximum à :", "o": ["1,20 mètre du sol", "2 mètres du sol", "0,20 mètre du sol", "1,80 mètre du sol"], "a": [0], "e": "Il doit être visible, signalé, accessible et facile à décrocher."},
  {"t": "Sécurité incendie", "q": "Le flux lumineux minimal d'un BAES d'évacuation est de :", "o": ["45 lumens", "5 lumens", "500 lumens", "1 lumen"], "a": [0], "e": "Les BAES d'ambiance, eux, assurent au moins 5 lumens par m² de surface."},
  {"t": "Sécurité incendie", "q": "Le système SATI sur des BAES permet :", "o": ["De tester automatiquement le bon fonctionnement des blocs", "D'éteindre le feu", "De diffuser l'alarme", "De désenfumer"], "a": [0], "e": "SATI : système automatique de test intégré. L'agent relève les défauts signalés par les voyants."},
  {"t": "Sécurité incendie", "q": "Le plan d'intervention est destiné :", "o": ["Aux sapeurs-pompiers", "Au public", "Aux clients", "Aux fournisseurs"], "a": [0], "e": "Il indique les accès, les locaux à risques, les organes de coupure et les moyens de secours."},
  {"t": "Installations techniques", "q": "Une personne est bloquée dans un ascenseur. L'agent :", "o": ["La rassure, reste en contact et fait appel à l'ascensoriste (ou aux pompiers si besoin)", "Force les portes palières lui-même", "Coupe l'électricité générale du bâtiment", "La laisse attendre sans contact"], "a": [0], "e": "Une manœuvre de dépannage ne peut être faite que par une personne formée et autorisée."},
  {"t": "Installations techniques", "q": "Un ascenseur doit être équipé :", "o": ["D'un dispositif d'alarme permettant de communiquer avec l'extérieur", "D'un extincteur dans la cabine", "D'un sprinkler", "D'un détecteur de flammes"], "a": [0], "e": "La téléalarme relie la cabine à un service d'intervention 24 h sur 24."},
  {"t": "Installations techniques", "q": "En cas d'incendie, les escaliers mécaniques :", "o": ["Sont arrêtés", "Accélèrent pour évacuer plus vite", "Changent de sens", "Restent en marche normale"], "a": [0], "e": "Un bouton d'arrêt d'urgence permet aussi de les stopper en cas d'accident."},
  {"t": "Installations techniques", "q": "Une nacelle d'entretien de façade, hors utilisation :", "o": ["Est garée à sa position de repos sans gêner l'évacuation ni les secours", "Peut rester devant les baies accessibles", "Sert de parking", "Reste au dernier étage en permanence"], "a": [0], "e": "Elle ne doit pas obstruer les baies que les pompiers utilisent."},
  {"t": "Installations techniques", "q": "L'électrocution désigne :", "o": ["Une électrisation qui entraîne la mort", "Une simple décharge sans conséquence", "Une coupure de courant", "Un court-circuit"], "a": [0], "e": "L'électrisation est le passage du courant dans le corps ; l'électrocution est une électrisation mortelle."},
  {"t": "Installations techniques", "q": "Face à une victime électrisée encore en contact avec le courant, on :", "o": ["Coupe le courant avant de la toucher", "La tire immédiatement à mains nues", "L'arrose d'eau", "Attend qu'elle se dégage seule"], "a": [0], "e": "Sinon, le sauveteur devient la deuxième victime."},
  {"t": "Installations techniques", "q": "Le dispositif de coupure générale électrique doit être :", "o": ["Accessible et signalé", "Caché au public et au personnel", "Fermé à clé sans double", "Placé sur le toit"], "a": [0], "e": "Les pompiers doivent pouvoir le trouver et l'actionner rapidement."},
  {"t": "Installations techniques", "q": "Un local de transformateur haute tension :", "o": ["Est interdit d'accès aux personnes non habilitées", "Peut servir de réserve", "Peut rester ouvert", "Doit être arrosé en cas de feu"], "a": [0], "e": "Danger électrique majeur : on n'y entre pas et on ne l'arrose jamais."},
  {"t": "Installations techniques", "q": "Sur une installation sprinkler, la vanne principale du poste de contrôle doit être :", "o": ["Ouverte en permanence (cadenassée ou plombée)", "Fermée hors des heures d'ouverture", "Ouverte seulement en cas de feu", "Démontée la nuit"], "a": [0], "e": "Une vanne fermée rend toute l'installation inutile. C'est un point de ronde."},
  {"t": "Installations techniques", "q": "Après un déclenchement de sprinkler, la vanne d'alimentation :", "o": ["N'est refermée que sur ordre des sapeurs-pompiers", "Est refermée tout de suite par l'agent", "Est refermée par le public", "Ne se referme jamais"], "a": [0], "e": "Fermer trop tôt peut laisser le feu repartir."},
  {"t": "Installations techniques", "q": "Quand un sprinkler fonctionne, l'alarme est souvent donnée par :", "o": ["Un gong hydraulique", "Un sifflet", "Une sonnerie de téléphone", "Rien du tout"], "a": [0], "e": "L'écoulement d'eau actionne le gong et un report d'alarme vers le poste de sécurité."},
  {"t": "Installations techniques", "q": "Lors de travaux, des détecteurs sont mis hors service. L'agent :", "o": ["Renforce la surveillance de la zone et veille à leur remise en service à la fin", "Laisse les détecteurs coupés", "Coupe tout le SSI", "Ne fait rien"], "a": [0], "e": "La mise hors service se note sur la main courante, comme la remise en service."},
  {"t": "Rôles et missions de l'agent", "q": "Pendant des travaux par points chauds, il faut :", "o": ["Un extincteur adapté à proximité immédiate", "Couper tous les BAES", "Retirer les extincteurs", "Ouvrir les portes coupe-feu"], "a": [0], "e": "On protège aussi les matériaux combustibles proches et on surveille après la fin des travaux."},
  {"t": "Rôles et missions de l'agent", "q": "Le permis de feu est signé par :", "o": ["Le donneur d'ordre et l'entreprise qui réalise les travaux", "Uniquement le public", "Le maire", "Personne"], "a": [0], "e": "Il est établi avant les travaux et précise les précautions de chaque partie."},
  {"t": "Rôles et missions de l'agent", "q": "Pour faciliter l'arrivée des secours, l'agent :", "o": ["Fait ouvrir les accès, dégage les voies et envoie quelqu'un au-devant d'eux", "Ferme le portail", "Attend au PC sans bouger", "Fait évacuer par les voies pompiers en voiture"], "a": [0], "e": "Chaque minute gagnée à l'accueil est une minute gagnée sur le feu."},
  {"t": "Rôles et missions de l'agent", "q": "On trouve notamment au poste de sécurité :", "o": ["Les plans, les consignes et les clés", "Le registre de sécurité ou les moyens de le consulter", "Les reports du SSI", "Le stock de marchandises"], "a": [0, 1, 2], "e": "Le PC doit aussi disposer d'un téléphone pour appeler les secours."},
  {"t": "Rôles et missions de l'agent", "q": "Le poste de sécurité doit disposer :", "o": ["D'une liaison téléphonique pour appeler les sapeurs-pompiers", "D'une télévision", "D'une caisse enregistreuse", "D'un accès réservé au public"], "a": [0], "e": "L'appel des secours doit pouvoir se faire sans délai."},
  {"t": "Rôles et missions de l'agent", "q": "Dans un IGH, le poste central de sécurité est :", "o": ["Occupé en permanence", "Occupé seulement la journée", "Fermé le week-end", "Facultatif"], "a": [0], "e": "L'IGH dispose toujours d'un service de sécurité incendie."},
  {"t": "Rôles et missions de l'agent", "q": "Les vêtements de travail de l'agent du service de sécurité incendie portent au niveau du buste la mention :", "o": ["« Sécurité incendie »", "« Police »", "« Pompier »", "« Surveillance »"], "a": [0], "e": "Le public et les secours doivent pouvoir l'identifier rapidement."},
  {"t": "Rôles et missions de l'agent", "q": "Un agent SSIAP qui n'a pas exercé au moins 1 607 heures sur les 36 derniers mois doit :", "o": ["Suivre une remise à niveau", "Repasser tout le SSIAP 1", "Ne rien faire", "Passer le SSIAP 2"], "a": [0], "e": "C'est la condition fixée par l'arrêté du 2 mai 2005 pour reprendre un poste."},
  {"t": "Rôles et missions de l'agent", "q": "Le personnel du service de sécurité incendie :", "o": ["Ne peut pas être distrait de ses missions spécifiques", "Peut tenir la caisse en même temps", "Peut être affecté au rayon", "Peut s'absenter du PC librement"], "a": [0], "e": "Ses missions de sécurité passent avant tout."},
  {"t": "Rôles et missions de l'agent", "q": "Face à une hémorragie externe, le premier geste est :", "o": ["La compression directe de la plaie", "Donner à boire", "Mettre la victime debout", "Attendre les secours sans agir"], "a": [0], "e": "On appuie fort sur la plaie, on allonge la victime et on alerte."},
  {"t": "Rôles et missions de l'agent", "q": "Une victime inconsciente qui respire est placée :", "o": ["En position latérale de sécurité (PLS)", "Sur le dos, jambes surélevées", "Assise", "Debout"], "a": [0], "e": "La PLS évite que la langue ou des vomissements bloquent les voies aériennes."},
  {"t": "Rôles et missions de l'agent", "q": "Une victime inconsciente qui ne respire pas :", "o": ["On alerte, on commence la réanimation cardio-pulmonaire et on utilise un défibrillateur", "On la met en PLS", "On attend", "On lui donne à boire"], "a": [0], "e": "Le défibrillateur automatisé externe (DAE) peut être utilisé par n'importe qui : il guide vocalement."},
  {"t": "Rôles et missions de l'agent", "q": "Face à une brûlure thermique, on :", "o": ["Refroidit immédiatement la zone à l'eau tempérée", "Applique de la glace directement", "Met du beurre ou de la crème", "Perce les cloques"], "a": [0], "e": "On refroidit le plus vite possible, puis on alerte selon la gravité."},
  {"t": "Rôles et missions de l'agent", "q": "Un adulte conscient s'étouffe et ne peut plus parler ni tousser. On :", "o": ["Donne des claques dans le dos puis des compressions abdominales", "Lui donne à boire", "L'allonge sur le dos", "Attend qu'il se dégage seul"], "a": [0], "e": "On alterne 5 claques dans le dos et 5 compressions abdominales jusqu'à la désobstruction."},
  {"t": "Rôles et missions de l'agent", "q": "Lors de l'épreuve pratique de ronde, le candidat doit à la fin :", "o": ["Renseigner la main courante sur une anomalie constatée", "Rédiger un mémoire", "Passer un oral de 30 minutes", "Éteindre un feu réel"], "a": [0], "e": "La ronde comporte des anomalies, la découverte d'un sinistre et des questions du jury."}
] };
</script>
<!-- MODULE OF : Questions d'examen officiel (QCM projetés en formation, corrections du formateur) -->
<script>
// Ajouter les prochaines questions officielles à la fin de cette liste, même format.
(window.SSIAP_MODULES = window.SSIAP_MODULES || {}).OF = { questions: [
  {"q": "Parmi ces propositions, quels sont les différents types de détecteurs automatiques d'incendie ?", "o": ["Thermostatique", "Tactile", "Thermovélocimétrique", "Olfactif", "Optique", "Aucune des réponses précédentes"], "a": [0, 2, 4], "e": "Thermostatique : réagit à un seuil de température. Thermovélocimétrique : réagit à une montée rapide de la température. Optique : réagit à la fumée. Il n'existe pas de détecteur olfactif ni tactile.", "t": "Détection"},
  {"q": "Indiquer ce que l'on doit inscrire sur la main courante ?", "o": ["Les alarmes feu", "Le nom des agents de sécurité incendie présents", "Les départs et retours de ronde", "L'heure d'arrivée et de départ du chef d'établissement", "La prise et la fin de service", "Aucune des réponses précédentes"], "a": [0, 1, 2, 4], "e": "La main courante retrace le service de sécurité : prise et fin de service, agents présents, rondes, alarmes et tout événement. Les allées et venues du chef d'établissement n'y figurent pas.", "t": "Main courante"},
  {"q": "Dans un I.G.H, l'alerte extérieure consiste à :", "o": ["Demander l'intervention du service de sécurité", "Demander l'intervention des services publics de secours", "Attirer l'attention de sa hiérarchie", "Prévenir les occupants d'un compartiment d'évacuer", "Aucune des réponses précédentes"], "a": [1], "e": "L'alerte, c'est appeler les sapeurs-pompiers (services publics de secours). Prévenir les occupants d'évacuer, c'est l'alarme.", "t": "IGH"},
  {"q": "Quels sont les dangers des fumées ?", "o": ["Elles engendrent des intoxications", "Elles favorisent le phénomène de panique", "Elles désorientent les personnes par manque de visibilité", "Elles provoquent l'effondrement du bâtiment", "Aucune des réponses précédentes"], "a": [0, 1, 2], "e": "Les fumées sont toxiques, opaques (perte de repères) et favorisent la panique. L'effondrement vient de la chaleur sur la structure, pas des fumées.", "t": "Le feu"},
  {"q": "Font partie des moyens d'extinction :", "o": ["Les extincteurs", "Le S.S.I", "Les poteaux d'incendie", "Le désenfumage", "L'éclairage de sécurité", "Aucune des réponses précédentes"], "a": [0, 2], "e": "Extincteurs et poteaux d'incendie servent à éteindre. Le SSI détecte et met en sécurité, le désenfumage évacue les fumées, l'éclairage de sécurité aide à évacuer : aucun n'éteint le feu.", "t": "Moyens de secours"},
  {"q": "Quels sont les dispositifs pouvant constituer une A.E.S ?", "o": ["Un groupe électrogène", "Des batteries d'accumulateurs", "Le réseau électrique de distribution publique", "Un onduleur", "Aucune des réponses précédentes"], "a": [0, 1], "e": "Une alimentation électrique de sécurité prend le relais du secteur : batteries d'accumulateurs ou groupe électrogène. Le réseau public est justement l'alimentation normale.", "t": "SSI"},
  {"q": "Qu'est-ce que la convection dans un feu ?", "o": ["C'est la transmission de la chaleur par la masse même du matériau", "C'est la transmission de la chaleur par l'intermédiaire de l'air", "C'est la transmission de la chaleur par l'intermédiaire d'ondes électromagnétiques", "C'est la transmission de la chaleur par l'intermédiaire de particules incandescentes", "Aucune des réponses précédentes"], "a": [1], "e": "Convection : l'air et les gaz chauds transportent la chaleur. La masse du matériau, c'est la conduction ; les ondes, le rayonnement ; les particules, les projections.", "t": "Le feu"},
  {"q": "En cours de ronde vous sentez une odeur suspecte. Vous :", "o": ["Effectuez la levée de doute", "Poursuivez votre ronde", "Prévenez votre PC Sécurité", "Prévenez les pompiers", "Aucune des réponses précédentes"], "a": [0, 2], "e": "On vérifie sur place (levée de doute) et on informe le PC Sécurité. Les pompiers ne sont appelés que si le sinistre est confirmé.", "t": "Rondes"},
  {"q": "Combien d'appareils émetteurs-récepteurs radio, le service de sécurité incendie d'un IGH doit-il pouvoir mettre à disposition des pompiers ?", "o": ["Deux", "Quatre", "Six", "Aucun", "Aucune des réponses précédentes"], "a": [1], "e": "Réponse retenue par la formation : quatre appareils.", "t": "IGH"},
  {"q": "Qu'indique l'Unité de Signalisation lorsqu'un « voyant rouge » clignote ?", "o": ["Un défaut de ligne", "Une zone mise hors service", "Les Dispositifs Actionnés de Sécurité en position de sécurité", "Les Dispositifs Actionnés de Sécurité en position d'attente", "Les lampes de l'unité de signalisation sont défectueuses", "Aucune des réponses précédentes"], "a": [5], "e": "Réponse retenue par la formation : aucune des propositions. Piège : ce n'est pas « DAS en position de sécurité ».", "t": "SSI"},
  {"q": "Quelle est l'utilité des baies accessibles ?", "o": ["Elles permettent l'intervention des équipes de sécurité", "Elles permettent l'intervention des services de secours", "Elles permettent l'évacuation normale du public", "Elles facilitent le nettoyage", "Elles permettent la ventilation", "Aucune des réponses précédentes"], "a": [1], "e": "Les baies accessibles en façade permettent aux sapeurs-pompiers d'entrer depuis l'extérieur (échelles).", "t": "ERP"},
  {"q": "Que comprend l'éclairage de sécurité ?", "o": ["L'éclairage de remplacement et l'éclairage normal", "L'éclairage de sécurité et l'éclairage d'ambiance", "L'éclairage d'évacuation et l'éclairage de remplacement", "L'éclairage d'ambiance et d'anti-panique", "L'éclairage d'évacuation et l'éclairage d'ambiance ou d'anti-panique", "Aucune des réponses précédentes"], "a": [4], "e": "L'éclairage de sécurité comprend l'éclairage d'évacuation et l'éclairage d'ambiance (ou anti-panique). L'éclairage de remplacement n'en fait pas partie.", "t": "Installations techniques"},
  {"q": "Indiquer les objectifs d'une ronde de sécurité incendie.", "o": ["Vérifier l'ouverture complète des dispositifs de désenfumage", "Effectuer le contrôle visuel de l'éclairage de sécurité", "Tester tous les détecteurs automatique d'incendie", "Vérifier les conditions de fermeture des portes coupe-feu", "Contrôler systématiquement le fonctionnement des interphones d'ascenseurs", "Aucune des réponses précédentes"], "a": [1, 3], "e": "En ronde : contrôle visuel de l'éclairage de sécurité et fermeture des portes coupe-feu. Tester les détecteurs ou ouvrir le désenfumage relève des essais et de la maintenance.", "t": "Rondes"},
  {"q": "Comment sont exprimées les durées de résistance au feu, dans les euroclasses ?", "o": ["En secondes", "En minutes", "En heures", "En heures et minutes", "Aucune des réponses précédentes"], "a": [1], "e": "En euroclasses, la durée est en minutes : REI 60 = 60 minutes, EI 30 = 30 minutes.", "t": "Le feu"},
  {"q": "L'accès au TGBT est :", "o": ["Réservé au public", "Réservé au public si celui-ci est habilité H0B0", "Interdit aux agents SSIAP", "Réservé aux personnes qualifiées", "Aucune des réponses précédentes"], "a": [3], "e": "Le tableau général basse tension est un local électrique : accès réservé aux personnes qualifiées.", "t": "Installations techniques"},
  {"q": "A quelle distance doit se trouver le raccord d'alimentation d'une colonne sèche ?", "o": ["20 m d'un véhicule d'incendie et de secours", "60 m maxi de l'entrée de l'établissement", "60 m maxi d'un poteau d'incendie", "100 m maxi d'un poteau d'incendie", "Aucune des réponses précédentes"], "a": [2], "e": "Réponse retenue par la formation : à 60 m maximum d'un poteau d'incendie.", "t": "Moyens de secours"},
  {"q": "Un conduit est :", "o": ["Un volume fermé servant au passage d'un fluide déterminé", "Un volume fermé généralement accessible et renfermant un ou plusieurs conduits", "Un dispositif d'évacuation des fumées situé en façade", "Un dispositif d'accès mobile fermé en position normale", "Aucune des réponses précédentes"], "a": [0], "e": "Un conduit sert au passage d'un fluide déterminé (air, fumée, gaz). Le volume qui renferme un ou plusieurs conduits, c'est une gaine.", "t": "Installations techniques"},
  {"q": "Sur une porte coupe-feu que puis-je trouver comme indication :", "o": ["Porte coupe-feu à ouverture automatique", "Porte coupe-feu à maintenir ouverte", "Porte coupe-feu à maintenir fermée", "Porte coupe-feu - Ne mettez pas d'obstacle à la fermeture", "Aucune des réponses précédentes"], "a": [2, 3], "e": "Deux signalétiques existent : « à maintenir fermée » (porte à fermeture manuelle) et « ne mettez pas d'obstacle à la fermeture » (porte à fermeture automatique).", "t": "Compartimentage"},
  {"q": "Qui assure la permanence au poste de sécurité ?", "o": ["L'agent de sécurité incendie SSIAP 1", "Le chef d'équipe sécurité incendie SSIAP 2", "Le directeur du site", "Tout le personnel de l'établissement", "Aucune des réponses précédentes"], "a": [0, 1], "e": "Réponse retenue par la formation : l'agent SSIAP 1 et le chef d'équipe SSIAP 2.", "t": "Rôle de l'agent"},
  {"q": "A quoi sert une U.C.M.C ?", "o": ["Centraliser les informations de la détection.", "Commander depuis le C.M.S.I les dispositifs actionnés de sécurité.", "Gérer les issues de secours.", "Visualiser les détections.", "Aucune des réponses précédentes"], "a": [1], "e": "L'UCMC (unité de commande manuelle centralisée) commande les DAS depuis le CMSI. Centraliser la détection, c'est l'ECS ; les issues de secours, c'est l'UGCIS.", "t": "SSI"},
  {"q": "Comment s'appelle la voie permettant aux véhicules de secours d'accéder au bâtiment ?", "o": ["Voie principale", "Voie secondaire", "Voie intérieure", "Voie lactée", "Voie engins", "Aucune des réponses précédentes"], "a": [4], "e": "La voie engins permet aux véhicules de secours d'arriver jusqu'au bâtiment. À ne pas confondre avec la voie échelle, qui permet de mettre en station les échelles aériennes.", "t": "ERP"},
  {"q": "Indiquer ce que l'on doit trouver au PCS", "o": ["Un coin repas", "La vidéosurveillance", "Les émetteurs récepteurs portatifs", "Le SSI", "Les clefs ou badges pour accéder à tous les locaux", "Aucune des réponses précédentes"], "a": [2, 3, 4], "e": "Au PCS : le SSI, les émetteurs-récepteurs portatifs et les clés ou badges de tous les locaux. La vidéosurveillance n'est pas obligatoire au PCS (correction de la formation).", "t": "Rôle de l'agent"},
  {"q": "En I.G.H, où trouve-t-on le dispositif de commande de désenfumage de secours des escaliers ?", "o": ["Près des moteurs de désenfumage", "Dans les circulations horizontales communes", "Au P.C.S", "Il n'y en a pas", "Aucune des réponses précédentes"], "a": [2], "e": "En IGH, la commande de désenfumage de secours des escaliers se trouve au poste central de sécurité.", "t": "IGH"},
  {"q": "Qu'est-ce que l'alarme générale ?", "o": ["Un signal sonore au poste central de sécurité", "Un appel direct au centre d'incendie et de secours", "Un signal sonore qui prévient les occupants d'avoir à évacuer les lieux", "Un appel téléphonique général pour éviter la panique en cas d'incendie", "Aucune des réponses précédentes"], "a": [2], "e": "L'alarme générale ordonne aux occupants d'évacuer. Le signal au PCS, c'est l'alarme restreinte ; l'appel aux pompiers, c'est l'alerte.", "t": "SSI"},
  {"q": "En IGH, où sont placés les dispositifs phoniques permettant de donner l'alerte intérieure au PCS ?", "o": ["Dans les circulations privatives", "Dans les locaux à risques", "Dans les locaux privatifs", "Dans les combles", "Aucune des réponses précédentes"], "a": [4], "e": "Réponse retenue par la formation : aucune des propositions. Piège : ce ne sont pas les locaux à risques.", "t": "IGH"},
  {"q": "Sauf dispositions particulières, quand un service sécurité est imposé avec des agents de sécurité incendie, il est composé au minimum de :", "o": ["3 agents dont 1 chef d'équipe", "3 agents et 1 chef d'équipe", "2 agents dont 1 chef d'équipe", "1 agent et 1 chef d'équipe", "Aucune des réponses précédentes"], "a": [0], "e": "Minimum : 3 personnes au total, dont 1 chef d'équipe. Piège : « 3 agents ET 1 chef d'équipe » ferait 4 personnes.", "t": "Rôle de l'agent"},
  {"q": "Afin d'empêcher les accidents de personnes, quels sont les dispositifs de protection équipant les ascenseurs ?", "o": ["Réducteur de vitesse", "Système « parachute »", "Système E.S.P.", "Système A.B.S.", "Porte palière avec sécurité anti-pincement", "Aucune des réponses précédentes"], "a": [0, 1, 4], "e": "Limiteur (réducteur) de vitesse, parachute qui bloque la cabine en cas de chute et porte palière anti-pincement. ESP et ABS sont des systèmes de voiture.", "t": "Installations techniques"},
  {"q": "Parmi les établissements suivants, lesquels sont des ERP ?", "o": ["Un train de voyageur", "Un parc d'exposition", "Une salle de concert", "Un dépôt de gaz", "Une menuiserie", "Aucune des réponses précédentes"], "a": [1, 2], "e": "Parc d'exposition (type T) et salle de concert (type L) reçoivent du public. Un train n'est pas un ERP ; un dépôt de gaz et une menuiserie sont des lieux de travail.", "t": "ERP"},
  {"q": "Qu'est-ce qu'un GH U ?", "o": ["Un IGH à usage d'habitation", "Un IGH à usage de bureaux", "Un IGH à usage mixte", "Un IGH à usage d'archives", "Aucune des réponses précédentes"], "a": [4], "e": "GHU = IGH à usage sanitaire. Habitation = GHA, bureaux = GHW, mixte = GHZ, archives = GHS.", "t": "IGH"},
  {"q": "Quelle couleur est interdite pour les effets portés au niveau du buste des agents SSIAP ?", "o": ["Jaune orange", "Bleu marine", "Rouge foncé", "Gris clair", "Bleu clair", "Aucune des réponses précédentes"], "a": [1], "e": "Réponse retenue par la formation : le bleu marine.", "t": "Rôle de l'agent"},
  {"q": "Indiquer les missions d'un agent S.S.I.A.P 1.", "o": ["Prévention des incendies.", "Évacuation du public.", "Intervention précoce face aux incendies.", "Assistance à personnes.", "Direction du P.C.Sécurité.", "Entretien élémentaire des moyens de secours.", "Aucune des réponses précédentes"], "a": [0, 1, 2, 3, 5], "e": "Prévention, évacuation, intervention précoce, assistance à personnes et entretien élémentaire des moyens de secours. Diriger le PC sécurité, c'est le rôle du chef d'équipe SSIAP 2.", "t": "Rôle de l'agent"},
  {"q": "Font partie des moyens de secours (au sens des articles MS) :", "o": ["Les extincteurs", "Le S.S.I", "Les poteaux d'incendie", "Le désenfumage", "L'éclairage de sécurité", "Aucune des réponses précédentes"], "a": [0, 1, 2], "e": "Au sens des articles MS : extincteurs, SSI, poteaux d'incendie. Piège : le SSI est un moyen de secours, mais pas un moyen d'extinction. Désenfumage et éclairage relèvent d'autres articles.", "t": "Moyens de secours"},
  {"q": "Un exutoire de fumée est :", "o": ["Un volume fermé servant au passage d'un fluide déterminé", "Un volume situé en sous face d'un plancher haut", "Un dispositif d'évacuation des fumées situé en toiture", "Un dispositif d'évacuation des fumées situé en façade", "Aucune des réponses précédentes"], "a": [2], "e": "L'exutoire est en toiture. En façade, on parle d'ouvrant. Le volume fermé pour un fluide, c'est un conduit.", "t": "Désenfumage"},
  {"q": "En E.R.P quelle doit-être la pression minimale d'un robinet d'incendie armé (RIA) ?", "o": ["1 bar", "2,5 bars au RIA le plus défavorisé", "2,5 bars au RIA le plus favorisé", "3 bars", "Aucune des réponses précédentes"], "a": [1], "e": "En ERP : 2,5 bars au RIA le plus défavorisé (le plus loin ou le plus haut). En IGH, c'est 4 bars.", "t": "Moyens de secours"},
  {"q": "Les dispositifs de coupure d'urgence électrique doivent :", "o": ["Être inaccessibles au public", "Être accessibles au public", "Être faciles à atteindre par les services de secours", "Être inaccessibles et autopilotés", "Aucune des réponses précédentes"], "a": [0, 2], "e": "Hors de portée du public, mais faciles à atteindre pour les secours.", "t": "Installations techniques"},
  {"q": "En IGH, la sensibilisation d'un D.A.I dans une circulation horizontale commune entraîne :", "o": ["L'évacuation du compartiment sinistré et des compartiments adjacents", "L'évacuation générale du bâtiment", "L'évacuation du compartiment sinistré", "Uniquement l'alarme restreinte au P.C.S.", "Aucune des réponses précédentes"], "a": [2], "e": "En IGH on n'évacue pas toute la tour : seul le compartiment sinistré est évacué.", "t": "IGH"},
  {"q": "En IGH quelle doit-être la pression minimale d'un robinet d'incendie armé (RIA) ?", "o": ["2,5 bars au RIA le plus défavorisé", "2,5 bars au RIA le plus favorisé", "4 bars au RIA le plus favorisé", "4 bars au RIA le plus défavorisé", "Aucune des réponses précédentes"], "a": [3], "e": "En IGH : 4 bars au RIA le plus défavorisé. En ERP : 2,5 bars.", "t": "IGH"},
  {"q": "Mon chef d'équipe me demande de contrôler un travail par point chaud venant de se terminer.", "o": ["Je remets en service la D.A.I.", "Je contrôle les lieux du travail", "J'inspecte les locaux avoisinants", "Je range les moyens d'extinction et de protection supplémentaires", "Aucune des réponses précédentes"], "a": [1, 2, 3], "e": "Contrôler la zone de travail et les locaux autour, puis ranger les moyens supplémentaires. Piège : remettre la détection en service n'est pas dans la correction retenue.", "t": "Rôle de l'agent"},
  {"q": "Quelle est la différence essentielle entre un S.S.I de catégorie A et un S.S.I de catégorie B ?", "o": ["Le centralisateur de mise en sécurité incendie", "Les dispositifs actionnés de sécurité", "Le système de détection d'incendie", "L'équipement de sécurité incendie", "Aucune des réponses précédentes"], "a": [2], "e": "Le SSI de catégorie A comporte un système de détection incendie (SDI) ; la catégorie B n'en a pas.", "t": "SSI"},
  {"q": "Le classement M1 correspond à :", "o": ["la manœuvre mensuelle obligatoire", "aucune des réponses précédentes", "le potentiel d'extinction d'un extincteur", "la résistance au feu d'une porte", "la réaction au feu d'un matériau"], "a": [4], "e": "Le classement M concerne la réaction au feu d'un matériau. La résistance au feu (portes, murs) se note EI, REI.", "t": "Le feu"},
  {"q": "Quelle est la largeur d'une circulation d'une Unité de Passage (UP) ?", "o": ["1,40 m", "1,80 m", "0,9 m", "0,6 m", "Aucune des réponses précédentes", "1,20 m"], "a": [2], "e": "1 UP = 0,90 m ; 2 UP = 1,40 m ; au-delà, 0,60 m par UP.", "t": "ERP"},

  {"q": "Pour qu'un feu soit inhibé, il faut ?", "o": ["aucune des réponses précédentes", "refroidir le combustible", "utiliser un RIA", "disperser le combustible", "arroser les flammes"], "a": [0], "e": "L'inhibition agit sur la réaction chimique : aucune proposition ne la décrit.", "t": "Le feu"},

uted);margin:0 0 16px;max-width:65ch}\n\n/* scenario picker */\n.scen{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}\n.chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-align:left;min-height:44px}\n.chip b{display:block;font:700 1rem var(--cond)}\n.chip small{color:var(--muted);font-size:.8rem}\n.chip.on{border-color:var(--gold);background:var(--surface2)}\n.brief{background:var(--surface);border-left:3px solid var(--gold);padding:12px 14px;border-radius:0 10px 10px 0;margin-bottom:12px}\n.brief strong{color:var(--gold)}\n.ldd-res{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}\n.ldd-res.neg{border-color:var(--ok)}\n.ldd-res.pos{border-color:var(--bad)}\n\n.tempo{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}\n.tempo .tt{display:flex;justify-content:space-between;gap:10px;font:600 .95rem var(--cond)}\n.tempo .bar{height:6px;background:var(--surface2);border-radius:3px;margin-top:8px;overflow:hidden}\n.tempo .bar i{display:block;height:100%;background:var(--gold);width:100%;transition:width 1s linear}\n.tempo.urgent .bar i{background:var(--bad)}\n.tempo small{color:var(--muted)}\n\n.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}\n.tbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:600 .95rem var(--cond);min-height:40px}\n.tbtn[aria-pressed=\"true\"]{border-color:var(--gold);color:var(--gold)}\n\n/* ===== KARA panel replica ===== */\n.kara{background:linear-gradient(#eef0ef,var(--plastic));border-radius:24px;padding:14px;box-shadow:inset 0 -6px 0 var(--plastic-d),0 2px 0 #fff3;color:#0d1f1e}\n.face{display:grid;grid-template-columns:1fr;gap:10px}\n.ecs,.side>div{background:var(--teal);border-radius:16px;border:2px solid var(--teal-d);color:#f3f7f6;padding:12px}\n.ecs{display:grid;gap:12px;grid-template-columns:1fr 1fr;grid-templa n}\n@container kara (min-width:560px){\n  .ecs{grid-template-columns:1.35fr 1fr .8fr;grid-template-areas:\"zones status ctrls\" \"abc consigne consigne\"}\n  .side{grid-template-columns:1fr 1fr}\n}\n@container kara (min-width:940px){\n  .face{grid-template-columns:1.65fr 1fr}\n  .side{grid-template-columns:1fr}\n}\n@media (min-width:760px){\n  .cols{grid-template-columns:1fr 1fr}\n}\n}\n@media (prefers-reduced-motion:reduce){\n  .led.blink.on{animation:none}\n  .tempo .bar i{transition:none}\n}\n";
const HTML="<nav class=\"tabs\" role=\"tablist\">\n    <button role=\"tab\" aria-selected=\"true\" data-tab=\"sim\">Simulateur SSI</button>\n    <button role=\"tab\" aria-selected=\"false\" data-tab=\"sch\">Schémas</button>\n    <button role=\"tab\" aria-selected=\"false\" data-tab=\"ronde\">Ronde</button>\n    <button role=\"tab\" aria-selected=\"false\" data-tab=\"alerte\">Alerte</button>\n  </nav>\n\n  <!-- ================= SIMULATEUR ================= -->\n  <section class=\"tab on\" id=\"t-sim\">\n    <h2>Le tableau du site</h2>\n    <p class=\"lead\">Réplique de l'ECS/CMSI KARA-8 UP de la salle, avec tous ses voyants et boutons. Choisis un scénario et gère-le comme le jour de l'examen. « Examen surprise » tire un événement au hasard : tu ne sais pas à l'avance si c'est un vrai feu.</p>\n\n    <div class=\"scen\" id=\"scen\"></div>\n    <div class=\"brief\" id=\"brief\">Choisis un scénario pour commencer. Active <strong>Mode explication</strong> pour découvrir à quoi sert chaque bouton et voyant.</div>\n    <div class=\"tempo\" id=\"tempo\" hidden>\n      <div class=\"tt\"><span id=\"tempoTxt\"></span><span id=\"tempoSec\"></span></div>\n      <div class=\"bar\"><i id=\"tempoBar\"></i></div>\n      <small>Raccourcie à 2 min pour l'entraînement. Sur site, jusqu'à 5 min. Seul l'acquittement du processus la stoppe.</small>\n    </div>\n\n    <div class=\"toolbar\">\n      <button class=\"tbtn\" id=\"explainBtn\" aria-pressed=\"false\">Mode explication</button>\n      <button class=\"tbtn\" id=\"examBtn\" aria-pressed=\"false\">Mode examen : sans aide</button>\n      <button class=\"tbtn\" id=\"muteBtn\" aria-pressed=\"false\">Couper le son</button>\n    </div>\n\n    <div class=\"hud\" id=\"hud\" aria-live=\"polite\">\n      <div class=\"hud-top\">\n        <span class=\"hud-led\" id=\"hudLed\"></span>\n        <div class=\"hud-txt\"><b id=\"hudTitle\">Veille</b><small id=\"hudSub\">Aucune alarme en cours</small></div>\n        <div class=\"hud-chips\"><span class=\"hchip\" id=\"hudNiv\">Niveau 1</span><span class=\"hchip\" id=\"hudSon\">Silence</span></div>\n      </div>\n      <div class=\"hud-bar\" id=\"hudBar\" hidden><i id=\"hudFill\"></i><span id=\"hudBarTxt\"></span></div>\n      <div class=\"seg\" role=\"tablist\" aria-label=\"Vue du simulateur\">\n        <button role=\"tab\" data-view=\"panel\" aria-selected=\"true\">Tableau</button>\n        <button role=\"tab\" data-view=\"acts\" aria-selected=\"false\">Terrain</button>\n        <button role=\"tab\" data-view=\"fiche\" aria-selected=\"false\">Fiche<span class=\"segn\" id=\"segN\"></span></button>\n      </div>\n    </div>\n\n    <div id=\"simBody\" data-view=\"panel\">\n    <div class=\"kara\" id=\"kara\" data-pane=\"panel\">\n      <div class=\"face\">\n        <div class=\"ecs\">\n          <div class=\"zones\">\n            <div class=\"zhead\" data-info=\"zone\"><span><i class=\"sym f\"></i>Hors service / essai</span><span><i class=\"sym b\"></i>Défaut</span></div>\n            <div id=\"zoneRows\"></div>\n          </div>\n          <div class=\"status\">\n            <div class=\"feu\"><span class=\"feutxt\" data-info=\"feu\">FEU <span class=\"flame\" aria-hidden=\"true\"></span></span><span class=\"feubar\" id=\"led-feu\" data-info=\"feu\"><i></i><i></i><i></i><i></i></span><span class=\"tension\" data-info=\"tension\"><span class=\"lbl\">Sous tension</span><span class=\"led g on\" id=\"led-tension\"></span></span></div>\n            <button class=\"srow\" data-info=\"defgen\" data-id=\"defgen\"><span class=\"led y\" id=\"led-defgen\"></span>Défaut général</button>\n            <button class=\"srow\" data-info=\"defsys\" data-id=\"defsys\"><span class=\"led y\" id=\"led-defsys\"></span><span>Défaut système<br>Tableau hors service</span></button>\n            <button class=\"srow\" data-info=\"defsect\" data-id=\"defsect\"><span class=\"led y\" id=\"led-defsect\"></span>Défaut secteur</button>\n            <button class=\"srow\" data-info=\"defbat\" data-id=\"defbat\"><span class=\"led y\" id=\"led-defbat\"></span>Défaut batterie</button>\n            <button class=\"srow\" data-info=\"defbatc\" data-id=\"defbatc\"><span class=\"led y\" id=\"led-defbatc\"></span>Défaut batterie CMSI</button>\n            <button class=\"srow\" data-info=\"hs\" data-id=\"hs\"><span class=\"led y\" id=\"led-hs\"></span>Hors service</button>\n            <button class=\"srow\" data-info=\"essai\" data-id=\"essai\"><span class=\"led y\" id=\"led-essai\"></span>Essai</button>\n            <div class=\"srow\" data-info=\"niveau\"><span class=\"led y\" id=\"led-n2\"></span><span class=\"niv\"><span><i class=\"sym f\"></i>Niveau 2</span><span><i class=\"sym b\"></i>Niveau 3</span></span></div>\n          </div>\n          <div class=\"ctrls\">\n            <div class=\"prow\"><span class=\"lbl\">Arrêt signaux sonores</span><button class=\"pbtn\" data-act=\"sonore\" data-info=\"sonore\" aria-label=\"Arrêt signaux sonores\"></button></div>\n            <div class=\"prow\"><span class=\"lbl\">Réarmement</span><button class=\"pbtn\" data-act=\"rearm\" data-info=\"rearm\" aria-label=\"Réarmement\"></button></div>\n            <div class=\"prow\"><span class=\"lbl\">Essai signalisations</span><button class=\"pbtn\" data-act=\"lamp\" data-info=\"lamp\" aria-label=\"Essai signalisations\"></button></div>\n          </div>\n          <div class=\"abc\" data-info=\"abc\">\n            <div class=\"keys\">\n              <div class=\"kk\"><button class=\"pbtn k\" data-key=\"A\">A</button><span class=\"arr\">↑</span></div>\n              <div class=\"kk\"><button class=\"pbtn k\" data-key=\"B\">B</button><span class=\"arr\">&nbsp;</span></div>\n              <div class=\"kk\"><button class=\"pbtn k\" data-key=\"C\">C</button><span class=\"arr\">↓</span></div>\n            </div>\n            <span class=\"lbl\">Diagnostic<br>en/hors service<br>essai</span>\n            <span class=\"codeview\" id=\"codeview\"></span>\n          </div>\n          <div class=\"consigne\" data-info=\"consigne\">\n            <b>En cas d'alarme feu</b>\n            Identifier la zone concernée et prévenir le service de sécurité. Arrêter le signal sonore. Après la disparition de la cause de l'alarme, accéder au niveau 2 et réarmer le tableau.\n            <span class=\"c2\">En cas de dérangement (voyant jaune allumé), prévenir immédiatement le service technique de l'établissement.</span>\n          </div>\n        </div>\n\n        <div class=\"side\">\n          <div class=\"uga\" data-info=\"uga\">\n            <div class=\"ttl\">UGA <small>NF S 61-936</small></div>\n            <div class=\"uga-top\">\n              <div class=\"ub\"><button class=\"pbtn\" data-act=\"acq\" data-info=\"acq\" aria-label=\"Acquittement processus\"></button><span class=\"lbl\">Acquittement processus</span></div>\n              <div class=\"ub\"><button class=\"pbtn\" data-act=\"veille\" data-info=\"veille\" aria-label=\"Veille restreinte\"></button><span class=\"lbl\">Veille restreinte</span></div>\n              <div class=\"ub\"><button class=\"evac-btn\" id=\"evacBtn\" data-info=\"evac\" aria-label=\"Commande évacuation générale, appuyer 3 secondes\"><span class=\"ring\">APPUYER 3 SECONDES</span><i id=\"evacFill\"></i></button><span class=\"lbl\">Commande évacuation générale</span><span class=\"evled\" data-info=\"evacled\"><span class=\"led r\" id=\"led-uevac\"></span><span class=\"lbl\">Évacuation générale</span></span></div>\n            </div>\n            <div class=\"uga-leds\">\n              <div class=\"srow\" data-info=\"ugaalarme\"><span class=\"led r\" id=\"led-ualarme\"></span>Alarme</div>\n              <div class=\"srow\" data-info=\"veille\"><span class=\"led y\" id=\"led-uveille\"></span>Veille restreinte</div>\n              <div class=\"srow\" data-info=\"diff\"><span class=\"led y\" id=\"led-udef\"></span>Défaut diffuseurs sonores</div>\n              <div class=\"srow\" data-info=\"diff\"><span class=\"led y\" id=\"led-uhs\"></span>Diffuseurs sonores hors service</div>\n              <div class=\"srow\" data-info=\"aux\"><span class=\"led y\" id=\"led-uaux\"></span>Contacts auxiliaires hors service</div>\n            </div>\n          </div>\n          <div class=\"cmsi\" data-info=\"cmsi\">\n            <div class=\"ttl\">CMSI <small>NF S 61-934 · NF S 61-935</small></div>\n            <div class=\"chead\"><span></span><span></span><span class=\"cl\"><i>Sécu.</i><i>Dér.</i><i>Bilan</i></span><span>Cde</span></div>\n            <div class=\"cmsi-rows\" id=\"cmsiRows\"></div>\n            <div class=\"bilanrow\"><button class=\"pbtn sm\" data-act=\"bilan\" data-info=\"bilan\" aria-label=\"Bilan\"></button><span class=\"lbl\">Bilan</span></div>\n          </div>\n        </div>\n      </div>\n      <div class=\"plate\">\n        <span class=\"code\" data-info=\"code\">CODE DE RÉARMEMENT : AABC</span>\n        <span class=\"brand\">KARA-8 UP · ECS/CMSI AB</span>\n      </div>\n    </div>\n\n    <div class=\"aesbox\" data-pane=\"panel\" data-info=\"aes\" id=\"aesBox\">\n      <div class=\"aes-l\">\n        <span class=\"aesled\"><span class=\"led g on\" id=\"aes-sect\"></span>Secteur</span>\n        <span class=\"aesled\"><span class=\"led g on\" id=\"aes-bat\"></span>Batterie</span>\n        <span class=\"aesled\"><span class=\"led g on\" id=\"aes-o1\"></span>Sortie 1</span>\n        <span class=\"aesled\"><span class=\"led g on\" id=\"aes-o2\"></span>Sortie 2</span>\n      </div>\n      <div class=\"aes-r\"><b>AES</b><small>Alimentation électrique de sécurité (SLAT), à côté du tableau</small></div>\n    </div>\n\n    <div class=\"card uslegend\" data-pane=\"panel\">\n      <h3>Lire les voyants des DAS (CMSI)</h3>\n      <p class=\"uslead\">D'après la notice Finsécur du KARA 8 UP : chaque fonction (VDF, CCF, PCF) a trois voyants. Sur ta façade, ils peuvent être cachés sous les étiquettes.</p>\n      <div class=\"usgrid\">\n        <div class=\"usrow\"><span class=\"ledbox\"><span class=\"led g on\"></span></span><div><b>Bilan vert</b><span>En appuyant sur « Bilan » : les DAS sont en position d'attente et aucune ligne n'est en défaut. Tout va bien.</span></div></div>\n        <div class=\"usrow\"><span class=\"ledbox\"><span class=\"led r on\"></span></span><div><b>Sécurité rouge fixe</b><span>Les DAS commandés ont atteint leur position de sécurité (porte et clapet fermés, volet ouvert).</span></div></div>\n        <div class=\"usrow\"><span class=\"ledbox\"><span class=\"led r on blink\"></span></span><div><b>Sécurité rouge clignotant</b><span>Les DAS ont été commandés mais ne sont pas tous arrivés en position de sécurité : aller voir sur place (porte bloquée, clapet coincé…).</span></div></div>\n        <div class=\"usrow\"><span class=\"ledbox\"><span class=\"led y on\"></span></span><div><b>Dérangement jaune fixe</b><span>Une liaison avec les DAS est coupée ou en court-circuit : main courante et technicien.</span></div></div>\n        <div class=\"usrow\"><span class=\"ledbox\"><span class=\"led y on blink\"></span></span><div><b>Dérangement jaune clignotant</b><span>Les DAS ne sont pas tous revenus en position d'attente : il faut les réarmer sur place (porte contre sa ventouse, clapet, volet).</span></div></div>\n      </div>\n      <p class=\"usnote\">Après le réarmement du tableau, le rouge s'éteint. Si une porte coupe-feu n'a pas été remise en place, le jaune clignote jusqu'à ce que tu la réarmes.</p>\n      <p class=\"usnote\">Piège du QCM : un rouge clignotant n'indique pas « DAS en position de sécurité », mais des DAS qui ne l'ont pas encore tous atteinte.</p>\n    </div>\n\n    <div class=\"acts\" data-pane=\"acts\">\n      <h3>Actions sur le terrain</h3>\n      <div class=\"grid\" id=\"actGrid\">\n        <button class=\"abtn\" data-act=\"ldd\">Levée de doute<small>Aller vérifier sur place</small></button>\n        <button class=\"abtn\" data-act=\"dmkey\">Réarmer le DM<small>Clé sous le boîtier</small></button>\n        <button class=\"abtn\" data-act=\"appel\">Appeler le 18 / 112<small>Message d'alerte</small></button>\n        <button class=\"abtn\" data-act=\"accueil\">Accueillir les secours<small>Guider jusqu'au sinistre</small></button>\n        <button class=\"abtn\" data-act=\"tech\">Prévenir le service technique<small>En cas de dérangement</small></button>\n        <button class=\"abtn\" data-act=\"dasreset\">Réarmer les DAS sur le terrain<small>Porte contre la ventouse, « clac »</small></button>\n        <button class=\"abtn\" data-act=\"mc\">Main courante<small>Rendre compte et noter</small></button>\n      </div>\n      <div class=\"free\" id=\"free\" hidden>\n        <h3 style=\"margin-top:14px\">Mode libre : déclencher un événement</h3>\n        <div class=\"grid\" id=\"freeGrid\"></div>\n      </div>\n    </div>\n\n    <div id=\"result\" data-pane=\"fiche\"></div>\n    <div class=\"cols\" data-pane=\"fiche\">\n      <div class=\"card m-only\">\n        <h3>Rappel du tableau</h3>\n        <p style=\"margin:0;font-size:.92rem\">Identifier la zone concernée et prévenir le service de sécurité. Arrêter le signal sonore. Après la disparition de la cause de l'alarme, accéder au niveau 2 et réarmer le tableau. En cas de dérangement (voyant jaune allumé), prévenir immédiatement le service technique.</p>\n      </div>\n      <div class=\"card\">\n        <h3>Fiche réflexe</h3>\n        <ol class=\"steps\" id=\"steps\"><li><span>Choisis un scénario.</span></li></ol>\n      </div>\n      <div class=\"card\">\n        <h3>Journal</h3>\n        <ul class=\"log\" id=\"log\"><li><span class=\"empty-note\">Les événements et tes actions s'afficheront ici.</span></li></ul>\n      </div>\n    </div>\n    </div>\n  </section>\n\n  <section class=\"tab\" id=\"t-sch\">\n    <h2>SSI = SDI + SMSI</h2>\n    <p class=\"lead\">Les schémas de la salle, en interactif. En mode révision, les cases sont masquées : retrouve chaque élément de tête, puis touche la case pour vérifier.</p>\n    <div class=\"modebar\">\n      <button class=\"tbtn\" id=\"revBtn\" aria-pressed=\"false\">Mode révision</button>\n      <button class=\"tbtn\" id=\"revReset\">Tout remasquer</button>\n    </div>\n\n    <div id=\"schemes\">\n      <div class=\"tree\">\n        <div class=\"box big\" data-a>SSI<small>Système de sécurité incendie</small></div>\n        <div aria-hidden=\"true\">↙ ↘</div>\n        <div class=\"row\">\n          <div class=\"box\" data-a>SDI<small>détecte, collecte</small></div>\n          <div class=\"box\" data-a>SMSI<small>traite, met en sécurité</small></div>\n        </div>\n      </div>\n\n      <div class=\"scheme\">\n        <h3>SDI</h3>\n        <p class=\"hand\">collecte</p>\n        <div class=\"flow\">\n          <div class=\"box blue\" data-a>DAI<small>détecteur auto</small></div><div class=\"arrow\">→</div><div class=\"box orange\" data-a>ECS<small>contrôle et signalisation</small></div>\n          <div class=\"note\">Zone surveillée : <span class=\"zone-tag\">ZDA</span> zone de détection automatique</div>\n          <div class=\"box blue\" data-a>DM<small>déclencheur manuel</small></div><div class=\"arrow\">→</div><div class=\"box orange\" data-a>ECS</div>\n          <div class=\"note\">Zone surveillée : <span class=\"zone-tag\">ZDM</span> zone de détection manuelle</div>\n          <div class=\"box blue\" data-a>AES<small>alimentation de sécurité</small></div><div class=\"arrow\">→</div><div class=\"box orange\" data-a>ECS</div>\n          <div class=\"note\">Autonomie AES du SDI (selon le schéma du cours) : <b>12 h + 10 min</b></div>\n        </div>\n        <div class=\"dots\"><span class=\"dot\" style=\"background:#e3271c\"></span><span class=\"dot\" style=\"background:#1d7a3a\"></span><span class=\"dot\" style=\"background:#f2cf1c\"></span></div>\n      </div>\n\n      <div class=\"scheme\">\n        <h3>SMSI</h3>\n        <p class=\"hand\">CMSI : traite · DAS : mise en sécurité</p>\n        <div class=\"flow\">\n          <div class=\"box blue\" data-a>AES</div><div class=\"arrow\">+</div><div class=\"box orange\" data-a>CMSI<small>centralisateur de mise en sécurité</small></div>\n          <div class=\"note\">Autonomie AES du CMSI (selon le schéma du cours) : <b>12 h + 1 h</b></div>\n          <div class=\"box blue\" data-a>US<small>unité de signalisation</small></div><div class=\"arrow\">=</div><div class=\"box\" data-a>État, position<small>des DAS, par voyants</small></div>\n          <div class=\"box blue\" data-a>UCMC<small>commande manuelle centralisée</small></div><div class=\"arrow\">→</div><div class=\"box blue\" data-a>1) Compartimentage<span class=\"zone-tag\">ZC</span></div>\n          <div class=\"box blue\" data-a>UCMC</div><div class=\"arrow\">→</div><div class=\"box blue\" data-a>2) Désenfumage<span class=\"zone-tag\">ZF</span></div>\n          <div class=\"box blue\" data-a>UGA<small>gestion d'alarme</small></div><div class=\"arrow\">→</div><div class=\"box dgreen\" data-a>3) Évacuation<span class=\"zone-tag\">ZA</span></div>\n          <div class=\"box blue\" data-a>UGCIS<small>gestion des issues de secours</small></div><div class=\"arrow\">→</div><div class=\"box dgreen\" data-a>4) Issues de secours</div>\n          <div class=\"note\">UCMC = les boutons rouges devant chaque DAS. UGA = processus d'alarme avec temporisation (5 min max). UGCIS = déverrouille les issues à ventouses ; en secours, BDIS vert à côté de la porte.</div>\n        </div>\n        <p style=\"text-align:center;margin:12px 0 0;font-weight:600\">Tout ça commande les <span class=\"box orange\" style=\"display:inline-block;padding:2px 10px\" data-a>DAS</span> (dispositifs actionnés de sécurité)</p>\n        <p style=\"font-size:.88rem;margin:10px 0 0;color:#333\">Compartimentage : portes et clapets coupe-feu. Désenfumage : exutoires, ouvrants, coffrets de relayage. Évacuation : déverrouillage des issues de secours.</p>\n      </div>\n    </div>\n\n    <div class=\"card\" style=\"margin-bottom:16px\">\n      <h3>Code couleur des voyants</h3>\n      <div class=\"vleg\">\n        <div><span class=\"dot\" style=\"background:#e3271c\"></span><span><b>Rouge</b> : alarme feu, une détection est en cours.</span></div>\n        <div><span class=\"dot\" style=\"background:#1d7a3a\"></span><span><b>Vert</b> : sous tension, fonctionnement normal.</span></div>\n        <div><span class=\"dot\" style=\"background:#f2cf1c\"></span><span><b>Jaune</b> : dérangement, défaut, hors service ou essai. On prévient le service technique.</span></div>\n      </div>\n      <h3 style=\"margin-top:16px\">Voyants des DAS au CMSI (notice KARA 8 UP)</h3>\n      <div class=\"usgrid\">\n        <div class=\"usrow\"><span class=\"ledbox\"><span class=\"led g on\"></span></span><div><b>Bilan vert</b><span>DAS en position d'attente, aucune ligne en défaut.</span></div></div>\n        <div class=\"usrow\"><span class=\"ledbox\"><span class=\"led r on\"></span></span><div><b>Sécurité rouge fixe</b><span>DAS en position de sécurité.</span></div></div>\n        <div class=\"usrow\"><span class=\"ledbox\"><span class=\"led r on blink\"></span></span><div><b>Sécurité rouge clignotant</b><span>DAS commandés mais pas tous arrivés en sécurité : aller voir sur place.</span></div></div>\n        <div class=\"usrow\"><span class=\"ledbox\"><span class=\"led y on\"></span></span><div><b>Dérangement jaune fixe</b><span>Ligne coupée ou en court-circuit : technicien.</span></div></div>\n        <div class=\"usrow\"><span class=\"ledbox\"><span class=\"led y on blink\"></span></span><div><b>Dérangement jaune clignotant</b><span>DAS pas tous revenus en position d'attente : les réarmer sur place.</span></div></div>\n      </div>\n      <p class=\"empty-note\" style=\"margin-top:10px\">Piège du QCM de la formation : à « que signifie un voyant rouge clignotant sur l'US », la réponse « DAS en position de sécurité » est fausse. La bonne réponse était « aucune des réponses précédentes ».</p>\n    </div>\n\n    <div class=\"card\" style=\"margin-bottom:16px\">\n      <h3>Niveaux d'accès du SSI</h3>\n      <ol class=\"msg\" style=\"counter-reset:m -1\">\n        <li><span><b>Tout public</b><br>Percuter un DM.</span></li>\n        <li><span><b>Agents de sécurité</b><br>Arrêter le signal sonore, acquitter le processus.</span></li>\n        <li><span><b>Code ou clé</b><br>Réarmer le système (ici le code AABC).</span></li>\n        <li><span><b>Techniciens de maintenance</b><br>Réglages poussés.</span></li>\n        <li><span><b>Fabricant</b><br>Programmation et modifications matérielles.</span></li>\n      </ol>\n    </div>\n    <div class=\"card\" style=\"margin-bottom:16px\">\n      <h3>DM rouge ou BDIS vert ?</h3>\n      <div class=\"vleg\">\n        <div><span class=\"dot\" style=\"background:#e3271c\"></span><span><b>DM, rouge</b> : fait partie du SDI. Placé près des portes, dans les circulations, dégagements et sorties. Sert à signaler un départ de feu.</span></div>\n        <div><span class=\"dot\" style=\"background:#1e7a46\"></span><span><b>BDIS, vert</b> : boîtier de déverrouillage d'issue de secours. Ne déclenche aucune alarme : il libère la ventouse d'une issue si l'UGCIS est défaillante.</span></div>\n      </div>\n    </div>\n\n    <h2>Sigles</h2>\n    <p class=\"lead\">Touche une carte pour voir la réponse.</p>\n    <div class=\"modebar\"><button class=\"tbtn\" id=\"fcShuffle\">Mélanger</button><button class=\"tbtn\" id=\"fcClose\">Tout retourner</button></div>\n    <div class=\"flash\" id=\"flash\"></div>\n  </section>\n\n  <!-- ================= RONDE ================= -->\n  <section class=\"tab\" id=\"t-ronde\">\n    <h2>Ronde : anomalies et sinistres</h2>\n    <p class=\"lead\">À l'épreuve pratique, tu fais une ronde avec des anomalies et un sinistre à gérer. Lis la situation, dis à voix haute ce que tu fais, puis vérifie.</p>\n    <div class=\"scorebar\" id=\"rscore\"></div>\n    <div class=\"modebar\"><button class=\"tbtn\" id=\"rShuffle\">Mélanger</button><button class=\"tbtn\" id=\"rReset\">Recommencer</button></div>\n    <div class=\"rcards\" id=\"rcards\"></div>\n  </section>\n\n  <!-- ================= ALERTE ================= -->\n  <section class=\"tab\" id=\"t-alerte\">\n    <h2>Numéros d'urgence</h2>\n    <p class=\"lead\">Les numéros de l'affiche de la salle. Touche une carte pour révéler le numéro.</p>\n    <div class=\"nums\" id=\"nums\"></div>\n\n    <h2>Le message d'alerte</h2>\n    <p class=\"lead\">Dans l'ordre, calmement, en articulant.</p>\n    <div class=\"card\">\n      <ol class=\"msg\">\n        <li><span><b>Qui tu es</b><br>Nom, fonction (agent de sécurité incendie), numéro où te rappeler.</span></li>\n        <li><span><b>Où</b><br>Adresse exacte, bâtiment, étage, local, accès le plus simple.</span></li>\n        <li><span><b>Quoi</b><br>Nature du sinistre : feu, fumée, malaise, fuite… et son évolution.</span></li>\n        <li><span><b>Victimes</b><br>Nombre, état apparent, gestes déjà faits.</span></li>\n        <li><span><b>Actions engagées</b><br>Évacuation lancée, extincteur utilisé, désenfumage, coupures.</span></li>\n        <li><span><b>Ne pas raccrocher le premier</b><br>Attendre que l'opérateur termine, répondre à ses questions.</span></li>\n      </ol>\n    </div>\n    <div class=\"card\" style=\"margin-top:12px\">\n      <h3>Accueil des secours</h3>\n      <p style=\"margin:0\">Envoyer quelqu'un les attendre à l'entrée, dégager l'accès, préparer clés et plans, les guider jusqu'au sinistre et leur faire un point rapide : ce qui s'est passé, victimes, personnes manquantes, actions faites.</p>\n    </div>\n  </section>\n</div>\n\n<div class=\"sheet\" id=\"sheet\" role=\"dialog\" aria-live=\"polite\"><button id=\"sheetClose\" aria-label=\"Fermer\">×</button><b id=\"sheetT\"></b><div id=\"sheetB\"></div></div>\n<div class=\"toast\" id=\"toast\" role=\"status\"></div>";
