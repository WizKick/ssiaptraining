let S, cur='libre', run=null, examMode=false;
function fresh(){return {kind:null,feu:null,cause:false,feuReel:false,dm:false,buzzer:false,niveau:1,code:'',t:0,acq:false,evac:false,
  das:{VDF:false,CCF:false,PCF:false},cmd:{VDF:false,CCF:false,PCF:false},mov:{VDF:0,CCF:0,PCF:0},bilan:false,evacT:0,evacDone:false,hsMode:false,def:null,defZone:null,hs:new Set(),sel:null,lamp:false,veille:false,ldd:'',lddMsg:'',lddNeg:true,appel:false,done:new Set(),errors:0,start:Date.now(),finished:false};}
S=fresh();

/* build zones + cmsi */
$('#zoneRows').innerHTML=ZONES.map(z=>`<div class="zrow${z.label?'':' unused'}"><button class="ztag ${z.label?'':'empty'}" data-zone="${z.n}" data-info="zone"><span class="bn">B${z.n}</span>${z.label||'&nbsp;'}</button><span class="led y" id="led-b${z.n}d" data-info="zone"></span><span class="led r" id="led-b${z.n}f" data-info="zone"></span><span class="lbl">Boucle ${z.n}</span></div>`).join('')+`<div class="zunused">Boucles 5 à 8 : non utilisées</div>`;
$('#cmsiRows').innerHTML=['VDF','CCF','PCF'].map(k=>`<div class="crow"><span class="ctag" data-info="${k}">${k}</span><span class="cstate" id="st-${k}">Attente</span><span class="cleds"><span class="led r" id="cs-${k}" data-info="secu"></span><span class="led y" id="cd-${k}" data-info="derang"></span><span class="led g" id="cb-${k}" data-info="bilan"></span></span><button class="rbtn" id="us-${k}" data-das="${k}" data-info="${k}" aria-label="Commande manuelle ${k}"></button></div>`).join('');
function cmdDas(k){S.das[k]=true;S.cmd[k]=true;S.mov[k]=2;}

/* scenario chips */
function chipSub(k){const b=store.get('ssiap1c_terrain_best_'+k);return SCEN[k].sub+(b?' · record : '+b.e+' erreur'+(b.e>1?'s':''):'');}
$('#scen').innerHTML=Object.keys(SCEN).map(k=>`<button class="chip${k===cur?' on':''}${k==='sur'?' sur':''}" data-sc="${k}"><b>${SCEN[k].name}</b><small>${chipSub(k)}</small></button>`).join('');
$('#scen').addEventListener('click',e=>{const b=e.target.closest('[data-sc]');if(b)startScen(b.dataset.sc);});

/* free mode buttons */
$('#freeGrid').innerHTML=ZONES.filter(z=>z.label).map(z=>`<button class="abtn" data-free="${z.n}">${z.type==='DM'?'Actionner le DM':'Déclencher le détecteur'}<small>${z.label}</small></button>`).join('')
 +`<button class="abtn" data-free="fr">Vrai feu au hasard<small>La levée de doute confirmera</small></button>`
 +`<button class="abtn" data-free="def">Coupure secteur<small>Défaut secteur</small></button>`
 +`<button class="abtn" data-free="bat">Batterie HS<small>Défaut batterie</small></button>`
 +`<button class="abtn" data-free="bcl">Détecteur arraché<small>Défaut sur une boucle</small></button>`;
$('#freeGrid').addEventListener('click',e=>{const b=e.target.closest('[data-free]');if(!b)return;ac();const f=b.dataset.free;
  if(f==='def'||f==='bat'||f==='bcl'){if(S.def){toast('Un dérangement est déjà en cours.');return;}triggerDef({def:'secteur',bat:'batterie',bcl:'boucle'}[f],rnd([1,2,4]));return;}
  if(S.feu){toast('Une alarme est déjà en cours : traite-la d\'abord.');return;}
  if(f==='fr'){S.kind='fr';triggerZone(rnd(USED));return;}
  const z=ZONES[+f-1];S.kind=z.type==='DM'?'dm':'fa';triggerZone(z.n);
});

function startScen(k){
  cur=k;S=fresh();
  const sc=SCEN[k];
  run=sc.surprise?Object.assign({},sc,rollSurprise()):Object.assign({},sc);
  if(run.kind==='fa'&&!sc.ldd)run.ldd=null;
  $$('#scen .chip').forEach(c=>c.classList.toggle('on',c.dataset.sc===k));
  $('#brief').innerHTML='<strong>Consigne</strong> : '+sc.brief;
  $('#free').hidden=k!=='libre';
  $('#result').innerHTML='';$('#log').innerHTML='';
  if(sc.surprise&&!examMode)setExam(true);
  renderSteps();render();ac();setView('panel');
  if(k==='libre'){log('Mode libre activé.');return;}
  log('Début du scénario : '+sc.name+'.');
  const delay=sc.surprise?2500+Math.random()*3500:1500;
  setTimeout(()=>{ if(cur!==k||S.feu||S.def)return;
    if(run.kind==='def')triggerDef(run.defType,run.defZone);
    else {S.kind=run.kind;triggerZone(run.zone);} },delay);
}

function triggerZone(n){
  const z=ZONES[n-1];
  if(S.hs.has(n)){log('Détection sur la boucle '+n+', mais elle est HORS SERVICE : rien ne remonte au tableau !','err');toast('Boucle '+n+' hors service : la détection ne remonte pas. Remets-la en service.',true);return;}
  S.feu=n;S.cause=true;S.buzzer=true;S.acq=false;S.evacDone=false;S.t=TEMPO;S.ldd='';S.lddMsg='';S.feuReel=false;S.start=Date.now();
  if(z.type==='DM')S.dm=true;
  ['VDF','CCF','PCF'].forEach(cmdDas);
  log('Alarme feu boucle '+n+'. Le CMSI commande automatiquement VDF, CCF et PCF (paramétrage par défaut : toutes les fonctions sur toutes les boucles).','err');
  render();
}
function triggerDef(type,zone){
  S.kind=S.kind||'def';S.def=type;S.defZone=type==='boucle'?zone:null;S.buzzer=true;S.start=Date.now();
  log('Dérangement signalé au tableau (voyant jaune).','err');render();
}

/* step tracking */
function renderSteps(){
  const st=stepsOf(run);const ol=$('#steps');
  if(!st.length){ol.innerHTML='<li><span>Pas de fiche en mode libre.</span></li>';return;}
  ol.innerHTML=st.map(([id,t])=>`<li class="${S.done.has(id)?'done':''}"><span>${t}</span></li>`).join('');
  ol.classList.toggle('hide',(examMode||!!(run&&run.surprise))&&!S.finished);
}
function step(id){
  const st=stepsOf(run);if(!st.length||S.finished)return;
  const ids=st.map(s=>s[0]);if(!ids.includes(id)||S.done.has(id))return;
  const FREE=new Set(['das','n2']);
  const expected=ids.find(x=>!S.done.has(x)&&!FREE.has(x));
  if(!FREE.has(id)&&expected!==id){const t=st.find(s=>s[0]===expected)[1];log('Fait, mais dans le désordre. Avant ça : « '+t+' ».','err');S.errors++;}
  S.done.add(id);renderSteps();renderHud();
  if(ids.every(x=>S.done.has(x)))finish();
}
function err(msg){S.errors++;log(msg,'err');toast(msg,true);}
function finish(){
  S.finished=true;
  const secs=Math.round((Date.now()-S.start)/1000);
  const e=S.errors;
  const key='ssiap1c_terrain_best_'+cur;const best=store.get(key);
  if(!best||e<best.e||(e===best.e&&secs<best.t))store.set(key,{e,t:secs});
  const what=run.surprise?`<p style="margin:0 0 6px"><b>C'était :</b> ${({fa:'une fausse alarme',fr:'un vrai feu',dm:'un DM actionné par malveillance',def:'un dérangement'})[run.kind]}.</p>`:'';
  const verdict=e===0?'Sans faute. C\'est exactement ce qu\'on attend le jour J.':e<=2?'Bien géré, quelques erreurs à corriger. Relis le journal.':'Trop d\'erreurs pour l\'examen. Relance le scénario en suivant la fiche réflexe.';
  $('#result').innerHTML=`<div class="result"><h3>Scénario terminé</h3>${what}<p style="margin:0">${e} erreur${e>1?'s':''}, ${Math.floor(secs/60)} min ${secs%60} s. ${verdict}</p><button class="tbtn" style="margin-top:10px" id="again">${run.surprise?'Nouvel événement surprise':'Recommencer'}</button></div>`;
  $('#again').onclick=()=>startScen(cur);
  renderSteps();
  log('Scénario terminé.','good');
  if(isMobile())setTimeout(()=>{setView('fiche');toTop();},900);
  const c=$('#scen [data-sc="'+cur+'"] small');if(c)c.textContent=chipSub(cur);
}

/* log */
function log(msg,cls){
  const ul=$('#log');if(ul.querySelector('.empty-note'))ul.innerHTML='';
  const d=new Date();const t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const li=document.createElement('li');li.innerHTML=`<time>${t}</time><span class="${cls||''}"></span>`;li.querySelector('span').textContent=msg;
  ul.prepend(li);
}

/* render panel */
function L(id,on,blink){const e=$('#led-'+id);if(!e)return;const o=!!(on||S.lamp);e.classList.toggle('on',o);e.classList.toggle('blink',o&&!S.lamp&&!!blink);}
function render(){
  ZONES.forEach(z=>{
    L('b'+z.n+'f',S.feu===z.n);
    const hs=S.hs.has(z.n),dz=S.def==='boucle'&&S.defZone===z.n;
    const cur_=S.hsMode&&S.sel===z.n;
    L('b'+z.n+'d',hs||dz||cur_,(dz&&!hs)||cur_);
    const t=$('[data-zone="'+z.n+'"]');t.classList.toggle('sel',cur_);t.classList.toggle('hs',hs);
  });
  $('#led-feu').classList.toggle('on',!!(S.feu||S.lamp));
  L('defgen',!!S.def);L('defsect',S.def==='secteur');L('defbat',S.def==='batterie');L('defsys',0);L('defbatc',0);
  L('hs',S.hs.size>0);L('essai',0);
  L('n2',S.niveau>=2,S.niveau===3);
  L('ualarme',S.feu||S.evac||S.evacDone);
  L('uveille',S.veille);L('udef',0);L('uhs',0);L('uaux',0);L('uevac',S.evac);
  ['VDF','CCF','PCF'].forEach(k=>{const e=$('#st-'+k);const on=S.das[k]||S.lamp;e.textContent=on?'Sécurité':'Attente';e.classList.toggle('sec',on);
    const cs=$('#cs-'+k),cd=$('#cd-'+k),cb=$('#cb-'+k);
    cs.classList.toggle('on',S.lamp||S.cmd[k]);cs.classList.toggle('blink',!S.lamp&&S.cmd[k]&&S.mov[k]>0);
    cd.classList.toggle('on',S.lamp||(!S.cmd[k]&&S.das[k]));cd.classList.toggle('blink',!S.lamp&&!S.cmd[k]&&S.das[k]);
    cb.classList.toggle('on',S.lamp||(S.bilan&&!S.das[k]&&!S.cmd[k]));});
  // AES
  const A=(id,cls)=>{const e=$('#'+id);e.className='led '+cls;};
  A('aes-sect',S.lamp?'g on':S.def==='secteur'?'g':'g on');
  A('aes-bat',S.lamp?'g on':S.def==='batterie'?'y on blink':'g on');
  A('aes-o1','g on');A('aes-o2','g on');
  $('#codeview').textContent=S.hsMode?'En/hors service · boucle '+S.sel+' · B = '+(S.hs.has(S.sel)?'remettre en service':'mettre hors service')+' · Réarmement = sortir':S.niveau>=2?'Niveau '+S.niveau+' · B = mode en/hors service':(S.code?'Code : '+'•'.repeat(S.code.length):'');
  const tp=$('#tempo');
  if(S.feu&&!S.evac&&!S.veille&&!S.acq){
    tp.hidden=false;const v=Math.max(0,S.t);
    $('#tempoTxt').textContent='Temporisation avant alarme générale';$('#tempoSec').textContent=Math.floor(v/60)+':'+String(v%60).padStart(2,'0');
    $('#tempoBar').style.width=(v/TEMPO*100)+'%';tp.classList.toggle('urgent',v<=15);
  } else tp.hidden=true;
  renderHud();
}
function renderHud(){
  const led=$('#hudLed'),t=$('#hudTitle'),s=$('#hudSub');
  let cls='',title='Veille',sub='Aucune alarme en cours';
  if(S.evac){cls='evac';title='ÉVACUATION GÉNÉRALE';sub=(S.feu?ZONES[S.feu-1].label+' · ':'')+'signal '+Math.floor(S.evacT/60)+':'+String(S.evacT%60).padStart(2,'0');}
  else if(S.feu){const z=ZONES[S.feu-1];cls='feu';title='FEU · Boucle '+z.n+' ('+z.type+')';sub=z.label;}
  else if(S.def){cls='def';title='DÉRANGEMENT';sub='Voyant jaune allumé au tableau';}
  else if(S.hs.size){title='Tableau en veille';sub='Attention : boucle hors service';}
  else if(Object.values(S.cmd).some(Boolean)){title='DAS commandés';sub='Voyants Sécurité allumés : réarmement niveau 2';}
  else if(Object.values(S.das).some(Boolean)){title='Tableau en veille';sub='DAS pas revenus en position d\'attente';}
  if(S.ldd==='cours')sub='Levée de doute en cours…';
  else if(S.ldd==='done'&&S.lddMsg&&(S.feu||S.evac))sub=S.lddNeg?'Levée de doute : NÉGATIVE':'Levée de doute : FEU CONFIRMÉ';
  if(examMode&&!S.finished){
    if(S.evac)title='ÉVACUATION GÉNÉRALE';else if(S.feu)title='Le tableau sonne';else if(S.def)title='Le tableau bipe';
    if(S.feu||S.def||S.evac){if(S.ldd!=='cours'&&!(S.ldd==='done'&&S.lddMsg))sub='Lis le tableau';}
  }
  led.className='hud-led'+(cls?' '+cls:'');t.textContent=title;s.textContent=sub;
  const n=$('#hudNiv');n.textContent='Niveau '+S.niveau;n.classList.toggle('on',S.niveau>=2);
  const so=$('#hudSon');so.textContent=S.evac?'Sirène':S.buzzer?'Buzzer':S.acq?'Acquitté':'Silence';so.className='hchip'+((S.buzzer||S.evac)?' alert':S.acq?' on':'');
  const bar=$('#hudBar');
  if(S.feu&&!S.evac&&!S.veille&&!S.acq){const v=Math.max(0,S.t);bar.hidden=false;$('#hudFill').style.width=(v/TEMPO*100)+'%';
    $('#hudBarTxt').textContent='Alarme générale dans '+Math.floor(v/60)+':'+String(v%60).padStart(2,'0');bar.classList.toggle('urgent',v<=15);}
  else bar.hidden=true;
  const st=stepsOf(run);$('#segN').textContent=st.length?S.done.size+'/'+st.length:'';
}

/* tick */
const iv1=setInterval(()=>{
  if(!host.isConnected){clearInterval(iv1);return;}
  let ch=false;
  ['VDF','CCF','PCF'].forEach(k=>{if(S.mov[k]>0){S.mov[k]--;ch=true;}});
  if(S.evac){S.evacT--;ch=true;if(S.evacT<=0){S.evac=false;S.evacDone=true;log('Fin du signal d\'évacuation générale (5 minutes).');}}
  if(S.feu&&!S.evac&&!S.evacDone&&!S.veille&&!S.finished&&!S.acq){S.t--;ch=true;if(S.t<=0)autoEvac('temporisation écoulée sans acquittement');}
  if(ch)render();
},1000);
function autoEvac(reason){
  S.evac=true;S.evacT=300;log('Alarme générale automatique : '+reason+'.','err');
  if(S.kind==='fr'){toast('Alarme générale partie toute seule. Sur feu confirmé, déclenche-la toi-même sans attendre.',true);S.errors++;step('evac');}
  else if(cur!=='libre'){err('Évacuation automatique : '+reason+'. Tout le bâtiment évacue pour rien.');}
  render();
}

/* actions */
const ACT={
  sonore(){ if(!S.buzzer){toast('Aucun signal sonore en cours sur le tableau.');return;} S.buzzer=false;log('Signaux sonores arrêtés.');step('sonore'); },
  acq(){
    if(!S.feu){toast('Aucun processus d\'alarme à acquitter.');return;}
    if(S.acq){toast('Déjà acquitté.');return;}
    if(S.evac||S.evacDone){toast('L\'alarme générale est déjà partie : plus rien à acquitter.');return;}
    if(S.feuReel){err('Feu confirmé : on n\'acquitte pas. On fait évacuer et on alerte les secours.');return;}
    if(S.niveau<2){toast('Acquittement refusé : sur ce tableau, il faut le niveau 2. Tape d\'abord le code AABC.',true);if(cur!=='libre')S.errors++;log('Acquittement tenté sans niveau 2.','err');return;}
    if(S.ldd!=='done'&&cur!=='libre')err('Acquittement avant la levée de doute : tu stoppes la temporisation sans savoir s\'il y a un feu.');
    S.acq=true;log('Processus acquitté : temporisation stoppée, pas d\'alarme générale.');step('acq');
  },
  veille(){ if(S.niveau<2){toast('Veille restreinte : niveau 2 requis (code AABC).');return;} S.veille=!S.veille;log('Veille restreinte '+(S.veille?'activée':'désactivée')+'.');if(S.veille&&cur!=='libre')err('Veille restreinte activée sans consigne : ce n\'est pas une façon de gérer une alarme.'); },
  lamp(){ S.lamp=true;render();tone(2200,2.4,'square',.03);log('Essai des signalisations.');setTimeout(()=>{S.lamp=false;render();},2500); },
  bilan(){ S.bilan=true;render();const ok=['VDF','CCF','PCF'].filter(k=>!S.das[k]&&!S.cmd[k]);
    toast(ok.length===3?'Bilan : les 3 fonctions sont en position d\'attente, sans défaut.':'Bilan : '+(ok.length?ok.join(', ')+' OK, ':'')+['VDF','CCF','PCF'].filter(k=>!ok.includes(k)).join(', ')+' pas en attente.');
    log('Bilan du CMSI.');setTimeout(()=>{S.bilan=false;render();},2500); },
  rearm(){
    if(S.hsMode){S.hsMode=false;S.sel=null;log('Sortie du mode en/hors service.');toast('Sortie du mode en/hors service.');return;}
    const anyCmd=Object.values(S.cmd).some(Boolean);
    if(!S.feu&&!S.evac&&!S.evacDone&&!anyCmd){toast(S.def?'Un dérangement ne se réarme pas : préviens le service technique.':'Rien à réarmer.');return;}
    if(S.niveau<2){err('Réarmement refusé : passe d\'abord en niveau 2 avec le code.');return;}
    if(!S.feu&&!S.evac&&!S.evacDone){S.cmd={VDF:false,CCF:false,PCF:false};S.buzzer=false;S.niveau=1;S.code='';log('Tableau réarmé : voyants Sécurité éteints. Réarmer maintenant les DAS sur le terrain.','good');toast('Réarmé. Les DAS restent à réarmer sur le terrain (voyant jaune clignotant).');return;}
    if(S.feuReel){err('Feu confirmé : on ne réarme pas. On fait évacuer et on alerte les secours.');return;}
    if(S.ldd!=='done'){err('Pas de réarmement sans levée de doute sur place.');return;}
    if(!S.acq&&!S.evac&&!S.evacDone){err('Acquitte d\'abord le processus, ensuite seulement réarmement.');return;}
    if(S.dm){err('Le DM est encore enfoncé : réarme-le d\'abord à la clé, sinon l\'alarme repart.');return;}
    if(S.cause){err('Le détecteur est toujours en alarme : la cause n\'a pas disparu.');return;}
    S.feu=null;S.evac=false;S.evacDone=false;S.acq=false;S.buzzer=false;S.niveau=1;S.code='';S.cmd={VDF:false,CCF:false,PCF:false};
    log('Tableau réarmé, retour en niveau 1. Ça ne suffit pas : il reste à réarmer les dispositifs sur le terrain.','good');
    toast('Tableau réarmé. Reste les portes coupe-feu sur le terrain.');step('rearm');
  },
  ldd(){
    if(S.def&&!S.feu){toast('Un dérangement se lit au tableau, pas besoin de levée de doute : préviens le service technique.');return;}
    if(!S.feu){toast('Aucune alarme : rien à vérifier.');return;}
    if(S.ldd==='cours'){toast('Levée de doute en cours…');return;}
    if(S.ldd==='done'){toast('Levée de doute déjà faite.');return;}
    S.ldd='cours';const z=ZONES[S.feu-1];log('Levée de doute en cours : '+z.label+'.');toast('Tu pars vérifier sur place…');render();
    setTimeout(()=>{
      if(S.ldd!=='cours')return;S.ldd='done';
      const neg=S.kind!=='fr';
      const msg=(cur!=='libre'&&run.ldd)?run.ldd:lddText(S.kind,z);
      if(S.kind==='fr')S.feuReel=true;else if(S.kind==='fa')S.cause=false;
      log(msg,neg?'good':'err');S.lddMsg=msg;S.lddNeg=neg;
      toast(msg,!neg,6500);
      $('#brief').insertAdjacentHTML('beforeend',`<div class="ldd-res ${neg?'neg':'pos'}">${msg}</div>`);
      step('ldd');render();
    },5000);
  },
  dmkey(){ if(!S.dm){toast('Aucun déclencheur manuel enfoncé.');return;} if(S.ldd!=='done'){err('Tu réarmes un DM sans avoir fait la levée de doute.');} S.dm=false;S.cause=false;log('DM réarmé : clé insérée sous le boîtier, la vitre est remontée.');step('dmkey'); },
  appel(){
    if(S.appel){toast('Les secours sont déjà prévenus.');return;}
    if(S.feuReel){S.appel=true;log('Appel 18 : message d\'alerte transmis.','good');step('appel');return;}
    if(S.feu&&S.ldd!=='done'){toast('Selon les consignes du site, l\'appel peut se faire dès le doute. Ici, fais d\'abord la levée de doute.');return;}
    if(cur!=='libre'&&(S.kind==='fa'||S.kind==='dm')&&S.ldd==='done'){err('Levée de doute négative : pas de raison d\'engager les pompiers.');return;}
    toast('Aucune situation ne justifie un appel aux secours.');
  },
  accueil(){ if(!S.appel){err('Les secours n\'ont pas été appelés.');return;} log('Secours accueillis et guidés jusqu\'au sinistre.','good');step('accueil'); },
  tech(){
    if(!S.def){toast('Aucun dérangement à signaler.');return;}
    const d=DEFS[S.def];log('Service technique prévenu : '+d.msg);step('tech');
    setTimeout(()=>{S.def=null;S.defZone=null;S.buzzer=false;log(d.fix,'good');render();},7000);
  },
  dasreset(){
    if(S.feu||S.evac||S.evacDone||Object.values(S.cmd).some(Boolean)){err('Le tableau commande encore les DAS : réarme d\'abord le tableau (niveau 2), ensuite les DAS sur le terrain.');return;}
    if(!S.das.VDF&&!S.das.CCF&&!S.das.PCF){toast('Les DAS sont déjà en position d\'attente.');return;}
    S.das={VDF:false,CCF:false,PCF:false};log('Portes coupe-feu ramenées contre leur ventouse (« clac »), DAS en position d\'attente.');step('das');
  },
  mc(){ log('Compte rendu fait et noté en main courante.');step('mc'); }
};
function doAct(a){ac();if(ACT[a]){ACT[a]();render();}}

/* mobile views */
function setView(v){$('#simBody').dataset.view=v;$$('#hud .seg button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));}
$('#hud .seg').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;setView(b.dataset.view);toTop();});

function keyPress(k){
  if(S.niveau>=2){
    if(!S.hsMode){
      if(k==='B'){S.hsMode=true;S.sel=1;log('Mode en/hors service : curseur sur la boucle 1.');}
      else toast('Niveau '+S.niveau+' actif. Touche B pour le mode en/hors service des boucles.');
      render();return;
    }
    if(k==='A')S.sel=S.sel<=1?8:S.sel-1;
    else if(k==='C')S.sel=S.sel>=8?1:S.sel+1;
    else{
      if(S.hs.has(S.sel)){S.hs.delete(S.sel);log('Boucle '+S.sel+' remise en service.','good');toast('Boucle '+S.sel+' remise en service.');}
      else{S.hs.add(S.sel);log('Boucle '+S.sel+' mise HORS SERVICE : la zone n\'est plus surveillée.','err');toast('Boucle '+S.sel+' hors service. Pense à la remettre en service après les travaux.');if(cur!=='libre')err('Mise hors service d\'une boucle pendant un scénario : la zone n\'est plus surveillée.');}
    }
    render();return;
  }
  S.code+=k;
  if(S.code.length>=4){
    if(S.code==='AABC'){S.niveau=2;log('Accès niveau 2.');step('n2');toast('Niveau 2 actif.');}
    else if(S.code==='AACC'){S.niveau=3;log('Accès niveau 3 (techniciens).');step('n2');toast('Niveau 3 : réservé aux techniciens (essais, paramétrage). À l\'examen, le niveau 2 suffit.');}
    else{toast('Code erroné.',true);log('Code erroné.','err');}
    S.code='';
  }
  render();
}

/* evac hold 3 s */
(function(){
  const b=$('#evacBtn'),f=$('#evacFill');let t0=0,raf=0;
  function down(e){if(explain)return;e.preventDefault();ac();t0=performance.now();tick();}
  function tick(){const p=Math.min(1,(performance.now()-t0)/3000);f.style.height=(p*100)+'%';if(p>=1){up();fire();return;}raf=requestAnimationFrame(tick);}
  function up(){cancelAnimationFrame(raf);f.style.height='0';t0=0;}
  function fire(){
    if(S.evac){toast('Alarme générale déjà en cours.');return;}
    if(S.evacDone&&S.feu){toast('Le signal d\'évacuation a déjà sonné 5 minutes.');}
    S.evac=true;S.evacT=300;log('Évacuation générale déclenchée manuellement : signal pendant 5 minutes.','err');
    if((S.kind==='fa'||S.kind==='dm')&&S.ldd==='done'&&cur!=='libre')err('Évacuation lancée alors que la levée de doute est négative.');
    else if(S.kind==='fr'&&!S.feuReel&&cur!=='libre')log('Évacuation avant confirmation : acceptable si le doute est sérieux.');
    step('evac');render();
  }
  b.addEventListener('pointerdown',down);
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(t0){up();if(!S.evac)toast('Maintiens 3 secondes pour déclencher.');}}));
  b.addEventListener('contextmenu',e=>e.preventDefault());
})();

let AC=null,muted=false;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,type,vol){if(muted||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const t=AC.currentTime;g.gain.setValueAtTime(vol,t);g.gain.setValueAtTime(0,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
let beat=0;
const iv2=setInterval(()=>{
  if(!host.isConnected){clearInterval(iv2);try{AC&&AC.close();}catch(e){}return;}
  beat++;
  if(S.evac){tone(554,.1,'sine',.09);setTimeout(()=>tone(440,.38,'sine',.09),100);}
  else if(S.buzzer){if(S.def&&!S.feu){if(beat%4===0)tone(1800,.12,'square',.03);}else tone(2200,.18,'square',.03);}
},500);

<script>
const META = window.SSIAP_META || [];
const DATA = window.SSIAP_MODULES || {};
const KEY_STATS="ssiap1c_stats", KEY_EX="ssiap1c_exams", KEY_SES="ssiap1c_session", KEY_SET="ssiap1c_settings", KEY_DAY="ssiap1c_days";
const KEY_PDF_HISTORY="ssiap1c_pdf2026_history";
const EXAM_N=30, EXAM_MIN=30, PASS=12, SMART_N=20, PAUSE_MIN=45;
const NONE=/^aucune?s? (des |de ces )?réponses? précédentes?\.?$/i;

function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function drop(k){try{localStorage.removeItem(k)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const plural=(n,w)=>n+" "+w+(n>1?"s":"");
const bonnes=n=>n+" bonne"+(n>1?"s":"")+" réponse"+(n>1?"s":"");
const n20txt=v=>String(v).replace(".",",");
function same(a,b){return [...a].sort().join()===[...b].sort().join()}
function dayKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

/* ---------- Réglages ---------- */
const SET=Object.assign({size:1,sound:true,exam:""},load(KEY_SET,{}));
delete SET.auto;
function saveSet(){save(KEY_SET,SET)}
let feedbackAudio=null,feedbackMaster=null;
async function playResultSound(color){
  if(!SET.sound)return;
  if(color==="orange")color="red";
  const melodies={green:[[784,0,.12],[988,.1,.12],[1175,.2,.18]],red:[[220,0,.18],[147,.17,.23]]};
  const notes=melodies[color];if(!notes)return;
  try{
    const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
    if(!feedbackAudio){feedbackAudio=new Audio();feedbackMaster=feedbackAudio.createGain();feedbackMaster.connect(feedbackAudio.destination)}
    if(feedbackAudio.state==="suspended")await feedbackAudio.resume();
    if(!SET.sound)return;
    feedbackMaster.gain.setValueAtTime(1,feedbackAudio.currentTime);
    const start=feedbackAudio.currentTime+.01;
    notes.forEach(([frequency,delay,duration])=>{
      const oscillator=feedbackAudio.createOscillator(),gain=feedbackAudio.createGain(),at=start+delay;
      oscillator.type=color==="red"?"triangle":"sine";
      oscillator.frequency.setValueAtTime(frequency,at);
      gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.12,at+.008);gain.gain.exponentialRampToValueAtTime(.001,at+duration);
      oscillator.connect(gain);gain.connect(feedbackMaster);oscillator.start(at);oscillator.stop(at+duration+.015);
      oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()};
    });
  }catch(e){}
}
function applySize(){document.documentElement.className=SET.size>1?"t"+SET.size:""}
applySize();
function daysLeft(){
  if(!SET.exam)return null;
  const [y,m,d]=SET.exam.split("-").map(Number);if(!y)return null;
  const t=new Date();t.setHours(0,0,0,0);
  return Math.round((new Date(y,m-1,d)-t)/86400000);
}

/* ---------- Questions ---------- */
const QS=[], problems=[], seenIds=new Set();
const isComp=id=>{const m=META.find(x=>x.id===id);return !!(m&&m.complement)};
META.forEach(m=>{
  const d=DATA[m.id];if(!d||!Array.isArray(d.questions))return;
  d.questions.forEach((r,i)=>{
    const ok=r&&typeof r.q==="string"&&Array.isArray(r.o)&&r.o.length>=2&&Array.isArray(r.a)&&r.a.length>0&&r.a.every(x=>Number.isInteger(x)&&x>=0&&x<r.o.length);
    if(!ok){problems.push(m.id+" n°"+(i+1));return}
    const id=hash(r.q+"|"+[...r.o].sort().join("|"));
    if(seenIds.has(id))return;seenIds.add(id);
    QS.push({id,mod:m.id,t:r.t||"",q:r.q,o:r.o,a:r.a,e:r.e||""});
  });
});
const PDF2026=window.SSIAP_OFFICIAL_2026 || [];
const BY_ID=Object.fromEntries(QS.concat(PDF2026).map(q=>[q.id,q]));
const OFFICIAL=QS.filter(q=>!isComp(q.mod));
const metaOf=id=>id==="OF2026"?{id,title:"OFFICIEL 2026",short:"OFFICIEL 2026"}:META.find(x=>x.id===id)||{id,title:id,short:id};
function errorIds(){const st=load(KEY_STATS,{});return Object.keys(st).filter(id=>st[id].last===0&&BY_ID[id])}
function optionOrder(q){
  if(q.mod==="OF2026")return q.o.map((_,i)=>i);
  const idx=q.o.map((_,i)=>i),none=idx.filter(i=>NONE.test(q.o[i].trim()));
  return shuffle(idx.filter(i=>!none.includes(i))).concat(none);
}
function record(q,ok){
  const st=load(KEY_STATS,{}),s=st[q.id]||{ok:0,ko:0,last:0};
  if(ok)s.ok++;else s.ko++;s.last=ok?1:0;s.t=Date.now();st[q.id]=s;save(KEY_STATS,st);
  const days=load(KEY_DAY,{}),k=dayKey();days[k]=(days[k]||0)+1;save(KEY_DAY,days);
}
function streak(){
  const days=load(KEY_DAY,{}),d=new Date();let n=0;
  if(!days[dayKey(d)])d.setDate(d.getDate()-1);
  while(days[dayKey(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}

/* ---------- Rendu ---------- */
const app=document.getElementById("app");
function paint(html,top){app.innerHTML=html;if(top&&window.scrollTo)window.scrollTo(0,0)}
let S=null,tick=null,armed=false,resetArmed=false,confirmOpen=false,wake=null;
async function keepAwake(on){
  try{
    if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}
    if(!on&&wake){await wake.release();wake=null}
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S)keepAwake(true)});
function stopAll(){clearInterval(tick);keepAwake(false)}

/* ---------- Accueil ---------- */
function home(){
  S=null;stopAll();armed=false;resetArmed=false;confirmOpen=false;
  const st=load(KEY_STATS,{}),exams=load(KEY_EX,[]),errs=errorIds().length,days=load(KEY_DAY,{});
  const nOff=OFFICIAL.length,nAll=QS.length,nComp=nAll-nOff;
  let mastered=0,seen=0;OFFICIAL.forEach(q=>{const s=st[q.id];if(s){seen++;if(s.last===1)mastered++}});
  const today=days[dayKey()]||0,str=streak(),left=daysLeft();
  const toGo=nOff-mastered;
  const perDay=left!==null&&left>0?Math.ceil(toGo/left):null;

  let chip;
  if(left===null||left<0)chip=`<button class="chip" id="chip">Date d'examen</button>`;
  else if(left===0)chip=`<button class="chip set" id="chip"><b>Jour J</b></button>`;
  else chip=`<button class="chip set" id="chip">J-<b>${left}</b></button>`;

  const goal=perDay!==null
    ?`<div class="fact"><b class="num">${perDay}</b><span>à maîtriser par jour d'ici l'examen</span></div>`
    :`<div class="fact"><b>${left===0?"Jour J":"–"}</b><span>${left===0?"Bon courage":"Fixe ta date d'examen en bas"}</span></div>`;

  const last=exams[exams.length-1];
  let sheet="",cap="Aucun examen blanc pour l'instant.";
  for(let i=0;i<EXAM_N;i++){const v=last&&last.r?last.r[i]:undefined;sheet+=`<i class="${v===1?"r":v===0?"w":""}"></i>`}
  if(last){const v=Math.round(last.c/last.n*200)/10;cap=`Dernier examen : <b class="num">${n20txt(v)}/20</b>, le ${new Date(last.d).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}.`}

  const offL=officialExamList();let offOk=0;offL.forEach(q=>{const s=st[q.id];if(s&&s.last===1)offOk++});
  const offRow=offL.length?`<section class="block">
    <h3>Questions d'examen officiel</h3>
    <p class="sub">Les QCM projetés en salle, avec la correction du formateur.</p>
    <div class="modes">
      <button class="mode wide" id="go-offexam"><span class="n num">${offL.length}</span><span class="tt">S'entraîner sur les questions officielles</span><span class="s num">${offOk}/${offL.length} maîtrisées</span></button>
    </div>
  </section>`:"";
  const ses=load(KEY_SES,null);
  const sesOk=ses&&Array.isArray(ses.items)&&ses.items.length&&ses.items.every(x=>BY_ID[x.id]);
  const resume=sesOk?`<div class="resume"><div><b>Reprendre : ${esc(ses.label)}</b><small class="num">${ses.master.length}/${ses.total} réussies</small></div>
    <button class="btn" id="resume">Reprendre</button><button class="x" id="drop">Abandonner</button></div>`:"";

  const rows=META.map(m=>{
    const qs=QS.filter(q=>q.mod===m.id),n=qs.length;if(m.complement&&!n)return "";
    let sn=0,ok=0;qs.forEach(q=>{const s=st[q.id];if(s){sn++;if(s.last===1)ok++}});
    const pct=n?Math.round(ok/n*100):0;
    return `<button class="mod${m.complement?" comp":""}${pct===100?" done":""}" ${n?`data-mod="${esc(m.id)}"`:"disabled"}>
      <span class="id">${m.complement?"+":esc(m.id)}</span>
      <span><span class="tl">${esc(m.title)}</span><span class="mm num">${ok}/${n} maîtrisées${m.complement?", à vérifier avec ton formateur":""}</span></span>
      <span class="st">${sn?`<span class="pc num">${pct} %</span><span class="bar"><span style="width:${pct}%"></span></span>`:`<span class="pc none">À faire</span>`}</span>
    </button>`}).join("");

  const hist=exams.slice(-5).reverse().map(x=>{const v=Math.round(x.c/x.n*200)/10;
    return `<li><span>${new Date(x.d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}, ${new Date(x.d).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</span><span class="num ${v>=PASS?"ok":"ko"}">${n20txt(v)}/20</span></li>`}).join("");

  paint(`
  <header class="brand"><h1>SSIAP 1</h1>${chip}</header>
  ${problems.length?`<p class="warn">Questions ignorées car mal formées : ${esc(problems.join(", "))}.</p>`:""}
  <section class="today">
    <div class="big"><strong class="num">${mastered}</strong><span class="num">sur ${nOff} questions maîtrisées</span></div>
    <div class="track" aria-hidden="true"><i class="m" style="width:${mastered/nOff*100}%"></i><i class="s" style="width:${(seen-mastered)/nOff*100}%"></i></div>
    <div class="facts">
      <div class="fact"><b class="num">${today}</b><span>réponses aujourd'hui</span></div>
      <div class="fact"><b class="num">${str}</b><span>jour${str>1?"s":""} d'affilée</span></div>
      ${goal}
    </div>
    <button class="btn" id="go-smart" ${nOff?"":"disabled"}>Séance de ${SMART_N} questions</button>
    <p class="hint">${errs?"Tes erreurs d'abord, puis":"D'abord"} les questions jamais vues, puis celles revues il y a le plus longtemps.</p>
  </section>
  ${resume}
  <section class="block official-2026" aria-labelledby="official-2026-title">
    <h3 id="official-2026-title">OFFICIEL 2026</h3>
    <p class="sub">Les ${PDF2026.length} questions du PDF fourni, de Q1 à Q216, avec les corrections du document et les choix dans leur ordre d’origine.</p>
    ${pdfCounters(pdfCounts(pdfGlobalResults()),"Maîtrise des 216 questions · dernier premier essai")}
    <div class="modes">
      <button class="mode wide" id="go-pdf2026"><span class="n num">${PDF2026.length}</span><span class="tt">S’entraîner dans l’ordre du PDF</span><span class="s num">216 questions · compteur vert / orange / rouge</span></button>
      <button class="mode wide" id="go-pdf2026-random"><span class="n">↝</span><span class="tt">S’entraîner en aléatoire</span><span class="s">Les 216 questions, mélangées à chaque nouvelle session</span></button>
      <button class="mode wide" id="read-pdf2026"><span class="n">Q/R</span><span class="tt">Lire les questions et réponses</span><span class="s">Les 9 chapitres dans l’ordre du document</span></button>
      <button class="mode wide" id="go-pdf2026-history"><span class="n">↗</span><span class="tt">Historique et progression</span><span class="s">Comparer mes sessions et retrouver les questions à retravailler</span></button>
    </div>
    ${pdfHistoryPreview()}
    <p class="pdf-source">✓ Vert : tout juste · ◐ Orange : partiellement juste · ✕ Rouge : aucun bon choix. Les reprises après correction ne modifient pas le résultat du premier essai.</p>
  </section>
  <section class="block">
    <div class="exam">
      <div class="t"><h4>Examen blanc</h4><p>${EXAM_N} questions tirées dans tous les modules, ${EXAM_MIN} minutes, correction à la fin. Il faut ${PASS}/20 pour valider.</p></div>
      <div class="sheet" aria-hidden="true">${sheet}</div>
      <div class="sheet-cap">${cap}</div>
      <button class="btn" id="go-exam" ${nAll?"":"disabled"}>Commencer l'examen</button>
    </div>
  </section>
  ${offRow}
  <section class="block">

function pdfColor(q,selected){

}
const PDF_LABELS={green:"Correcte",orange:"Partielle",red:"Aucun bon choix",unseen:"Pas encore répondue"};
function pdfCounts(results,total=PDF2026.length){
  const counts={green:0,orange:0,red:0,unseen:total};

}
function pdfCounters(counts,label){

}
function pdfGlobalResults(){

}
function pdfGrid(results,current){

}
function pdfSessionResults(){return S.items.filter(x=>!x.retry).map(x=>({n:x.q.n,color:x.done?pdfColor(x.q,x.sel):null,selected:x.done?x.sel.slice():[]}))}
function pdfSnapshot(completed=false){
  if(!isPDFSession())return null;
  const results=pdfSessionResults(),counts=pdfCounts(results,S.total);
  if(counts.unseen===S.total)return null;
  const entry={id:S.sessionId,d:S.sessionDate||S.start,updated:Date.now(),mode:S.src.kind==="pdf2026random"?"random":"ordered",total:S.total,counts,results,completed,duration:Date.now()-S.start,mastered:S.master.size};
  const history=load(KEY_PDF_HISTORY,[]),index=history.findIndex(x=>x.id===entry.id);
  if(index<0)history.push(entry);else history[index]=entry;
  save(KEY_PDF_HISTORY,history);
  return entry;
}
function pdfSessionPanel(){
  const results=pdfSessionResults(),counts=pdfCounts(results,S.total);

}
function pdfHistoryCard(h,previous,activeId){
  const answered=h.total-h.counts.unseen,pct=answered?Math.round(h.counts.green/answered*100):0;

  const progress=delta===null?"":`<p class="pdf-trend num">${delta>0?"+":""}${delta} points de réussite face à ta précédente session complète dans ce mode.</p>`;
  return `<details class="pdf-history-card"><summary><span><b>${h.mode==="random"?"Aléatoire":"Ordre du PDF"}</b><small>${new Date(h.d).toLocaleString("fr-FR")} · ${h.completed?"Terminée":h.id===activeId?"En cours / à reprendre":"Interrompue"} · ${answered}/${h.total} évaluées</small></span><span class="pdf-mini-scores num"><b class="green">✓ ${h.counts.green}</b><b class="orange">◐ ${h.counts.orange}</b><b class="red">✕ ${h.counts.red}</b></span></summary><div class="pdf-history-body">${pdfCounters(h.counts,"Résultats au premier essai")}<p class="num">${pct} % entièrement correctes sur les ${answered} questions évaluées${h.completed?" · "+h.mastered+"/"+h.total+" réussies après correction":""}.</p>${progress}<p class="pdf-source">Les nombres ci-dessous sont les numéros du PDF, affichés dans l’ordre de cette session.</p>${pdfGrid(h.results)}${h.results.some(r=>r.color&&r.color!=="green")?`<div class="pdf-history-corrections"><h4>Questions à retravailler au premier essai</h4>${h.results.filter(r=>r.color&&r.color!=="green").map(r=>{const q=PDF2026.find(q=>q.n===r.n);return `<details><summary><span class="${r.color}">${r.color==="orange"?"◐":"✕"} Q${r.n}</span> ${esc(q.q)}</summary><div><p>Ton choix : ${esc((r.selected||[]).map(i=>q.o[i]).join(" · ")||"Non enregistré")}</p><p>Correction : <b>${esc(q.a.map(i=>q.o[i]).join(" · "))}</b></p></div></details>`}).join("")}</div>`:""}</div></details>`;
}
function showPDFHistory(){
  if(isPDFSession())persist();

  document.getElementById("pdf-history-back").onclick=home;
}

function startModule(id){const m=metaOf(id);train(shuffle(QS.filter(q=>q.mod===id)),m.complement?"Complément":id==="OF"?"Questions d'examen officiel":"Module "+id+" : "+(m.short||m.title),{kind:"module",id})}

function officialExamList(){

function startOffExam(){const l=officialExamList();if(l.length)train(shuffle(l),"Questions d'examen officiel",{kind:"offexam"})}

function startSmart(){
  const st=load(KEY_STATS,{});
  const err=[],fresh=[],old=[];
  OFFICIAL.forEach(q=>{const s=st[q.id];if(!s)fresh.push(q);else if(s.last===0)err.push(q);else old.push(q)});
  old.sort((a,b)=>(st[a.id].t||0)-(st[b.id].t||0));
  const list=shuffle(err).concat(shuffle(fresh),old).slice(0,SMART_N);

}
function restart(src){
  const k=src&&src.kind;
  if(k==="module")startModule(src.id);else if(k==="official")startOfficial();else if(k==="everything")startEverything();
  else if(k==="pdf2026")startPDF2026();else if(k==="pdf2026random")startPDF2026Random();else if(k==="errors")startErrors();else if(k==="smart")startSmart();else if(k==="exam")startExam();else if(k==="offexam")startOffExam();else home();
}
function drawExam(){
  const pool=OFFICIAL.length?OFFICIAL:QS,by={};
  pool.forEach(q=>(by[q.mod]=by[q.mod]||[]).push(q));
  const N=Math.min(EXAM_N,pool.length);
  const alloc=Object.keys(by).map(m=>{const x=by[m].length/pool.length*N;return {m,n:Math.floor(x),r:x-Math.floor(x)}});
  let rest=N-alloc.reduce((s,a)=>s+a.n,0);
  shuffle(alloc).sort((a,b)=>b.r-a.r).forEach(a=>{if(rest>0){a.n++;rest--}});
  let list=[];alloc.forEach(a=>{list=list.concat(shuffle(by[a.m]).slice(0,a.n))});
  if(list.length<EXAM_N){const ids=new Set(list.map(q=>q.id));list=list.concat(shuffle(QS.filter(q=>!ids.has(q.id))).slice(0,EXAM_N-list.length))}
  return shuffle(list);
}

/* ---------- Révision ---------- */
function train(list,label,src){
  if(!list.length){home();return}
  S={mode:"train",label,src,i:0,total:list.length,master:new Set(),combo:0,start:Date.now(),brk:Date.now(),
    items:list.map(q=>({q,order:optionOrder(q),sel:[],done:false,ok:false,retry:false}))};
  if(isPDFSession()){S.sessionId="pdf2026-"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);S.sessionDate=S.start}
  persist();beginTicks();showTrain(true);
}
function beginTicks(){stopAll();armed=false;keepAwake(true);tick=setInterval(()=>S&&(S.mode==="train"?updClock():updTimer()),1000)}
function persist(){
  if(!S||S.mode!=="train")return;
  pdfSnapshot();
  save(KEY_SES,{label:S.label,src:S.src,i:S.i,total:S.total,master:[...S.master],sessionId:S.sessionId,sessionDate:S.sessionDate,elapsedMs:Date.now()-S.start,
    items:S.items.map(x=>({id:x.q.id,order:x.order,sel:x.sel,done:x.done,ok:x.ok,retry:x.retry}))});
}
function resumeSession(s){
  S={mode:"train",label:s.label,src:s.src,i:Math.min(s.i,s.items.length-1),total:s.total,master:new Set(s.master),combo:0,start:Date.now()-(s.elapsedMs||0),brk:Date.now(),sessionId:s.sessionId||"pdf2026-"+Date.now().toString(36),sessionDate:s.sessionDate||Date.now(),
    items:s.items.map(x=>({q:BY_ID[x.id],order:x.order,sel:x.sel||[],done:!!x.done,ok:!!x.ok,retry:!!x.retry}))};
  beginTicks();showTrain(true);
}
function clockTxt(){const s=Math.floor((Date.now()-S.start)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?h+" h "+String(m).padStart(2,"0"):m+":"+String(x).padStart(2,"0")}
function updClock(){
  const el=document.getElementById("clock");if(el)el.textContent=clockTxt();
  if(Date.now()-S.brk>PAUSE_MIN*60000&&!document.getElementById("pause"))showTrain(false);
}
function optionsHtml(it,reveal){
  const q=it.q,multi=q.a.length>1;
  return `<div class="opts${multi?" multi":""}" role="${multi?"group":"radiogroup"}">`+it.order.map((oi,k)=>{
    let cls="opt",g="";
    if(reveal){if(q.a.includes(oi)){cls+=" good";g="✓"}else if(it.sel.includes(oi)){cls+=" bad";g="✕"}else cls+=" dim"}
    else if(it.sel.includes(oi)){cls+=" sel";g="✓"}
    return `<button class="${cls}" data-oi="${oi}" role="${multi?"checkbox":"radio"}" aria-checked="${it.sel.includes(oi)}" ${reveal?"disabled":""}><span class="mk">${g}</span><span class="txt">${esc(q.o[oi])}</span>${k<7?`<span class="key">${k+1}</span>`:""}</button>`;
  }).join("")+`</div>`;
}
function showTrain(top){
  const it=S.items[S.i],q=it.q,multi=q.a.length>1,last=S.i===S.items.length-1;
  const m=metaOf(q.mod);
  const tired=Date.now()-S.brk>PAUSE_MIN*60000;
  let fb="",nav="";
  if(it.done){
    const color=q.mod==="OF2026"?pdfColor(q,it.sel):null;
    const verdict=color==="orange"?"◐ Réponse partielle":color==="red"?"✕ Aucun bon choix":it.ok?"✓ Bonne réponse":"✕ Ce n'est pas ça";
    fb=`<div class="fb ${color?"pdf-feedback "+color:it.ok?"ok":"ko"}"><div class="v">${verdict}</div>
      ${color?`<p class="num">${it.sel.filter(i=>q.a.includes(i)).length}/${q.a.length} bons choix sélectionnés${it.sel.some(i=>!q.a.includes(i))?" · "+it.sel.filter(i=>!q.a.includes(i)).length+" choix incorrect(s)":""}.</p>`:""}
      ${it.ok?"":`<p>À retenir : <b>${esc(q.a.map(i=>q.o[i]).join(" · "))}</b>. Cette question revient juste après.</p>`}
      ${q.e?`<p>${esc(q.e)}</p>`:""}</div>`;
    nav=`<button class="btn" id="next">${last?"Voir mon résultat":"Question suivante"}</button>`;
  }else if(multi){nav=`<button class="btn" id="validate" ${it.sel.length?"":"disabled"}>Valider</button>`}
  paint(`
  <div class="bar-top"><button class="quit" id="quit">Accueil</button><span class="where num"><b>${S.master.size}</b>/${S.total} réussies</span><span class="clock num" id="clock">${clockTxt()}</span></div>
  <div class="prog"><span style="width:${S.master.size/S.total*100}%"></span></div>
  ${tired?`<div class="pause" id="pause"><span>Ça fait ${PAUSE_MIN} minutes d'affilée. Une pause de 5 minutes aide à mieux retenir.</span><button id="pause-ok">C'est noté</button></div>`:""}
  <p class="qmeta"><span>${m.complement?"Complément":q.mod==="OF2026"?"OFFICIEL 2026 · Q"+q.n+"/216 · "+esc(q.section)+" – "+esc(q.sectionTitle):q.mod==="OF"?"Examen officiel":"Module "+esc(q.mod)}</span><span>${multi?"Plusieurs réponses possibles":"Une seule réponse"}${it.retry?", deuxième essai":""}</span>${S.combo>=3?`<span class="streak num">${S.combo} de suite</span>`:""}</p>
  ${isPDFSession()?pdfSessionPanel():""}
  <h2 class="qtext">${esc(q.q)}</h2>
  ${optionsHtml(it,it.done)}
  ${fb}
  ${nav?`<div class="act">${nav}</div>`:""}`,top);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickTrain(+b.dataset.oi));
  const v=document.getElementById("validate");if(v)v.onclick=validateTrain;
  const n=document.getElementById("next");if(n){n.onclick=nextTrain;n.focus({preventScroll:true});const f=app.querySelector(".fb");if(f&&f.scrollIntoView)f.scrollIntoView({block:"nearest",behavior:"smooth"})}
  const p=document.getElementById("pause-ok");if(p)p.onclick=()=>{S.brk=Date.now();showTrain(false)};
  document.getElementById("quit").onclick=home;
}
function pickTrain(oi){
  const it=S.items[S.i];if(it.done)return;
  if(it.q.a.length>1){it.sel=it.sel.includes(oi)?it.sel.filter(x=>x!==oi):[...it.sel,oi];showTrain(false)}
  else{it.sel=[oi];validateTrain()}
}
function validateTrain(){
  const it=S.items[S.i];if(!it.sel.length||it.done)return;
  it.done=true;it.ok=same(it.q.a,it.sel);record(it.q,it.ok);
  playResultSound(it.q.mod==="OF2026"?pdfColor(it.q,it.sel):it.ok?"green":"red");
  if(it.q.mod==="OF2026"&&!it.retry){const stats=load(KEY_STATS,{});stats[it.q.id].pdfColor=pdfColor(it.q,it.sel);save(KEY_STATS,stats)}
  if(it.ok){S.master.add(it.q.id);S.combo++}
  else{S.combo=0;S.items.splice(S.i+1,0,{q:it.q,order:optionOrder(it.q),sel:[],done:false,ok:false,retry:true})}
  persist();showTrain(false);
}
function nextTrain(){if(S.i>=S.items.length-1)finishTrain();else{S.i++;persist();showTrain(true)}}
function finishTrain(){
  const pdfEntry=pdfSnapshot(true);
  drop(KEY_SES);stopAll();
  const base=S.items.filter(x=>!x.retry),N=base.length,c=base.filter(x=>x.ok).length,pct=Math.round(c/N*100);
  const wrong=base.filter(x=>!x.ok),src=S.src,label=S.label,time=clockTxt();
  S=null;
  paint(`
  <div class="res">
    <p class="lbl">${esc(label)}</p>
    <div class="score num">${c}<small>/${N}</small></div>
    <span class="verdict ${pct>=60?"":"ko"}">${pct>=60?"Bon niveau":"À retravailler"}</span>
    <p class="sum">${bonnes(c)} du premier coup, soit ${pct} %, en ${time}. Toutes les questions sont maintenant réussies.</p>
    ${pdfEntry?pdfCounters(pdfEntry.counts,"Bilan de session · premier essai")+pdfGrid(pdfEntry.results):""}
    ${wrong.length?`<section class="corr"><h3>Ratées au premier essai</h3>${wrong.map((x,k)=>corrItem(x,k+1)).join("")}</section>`:""}
    <div class="act"><button class="btn" id="again">${src.kind==="smart"?"Encore "+SMART_N+" questions":"Recommencer"}</button><button class="btn ghost" id="home">Accueil</button>${pdfEntry?'<button class="btn ghost" id="result-pdf-history">Historique 2026</button>':""}</div>
  </div>`,true);
  if(pdfEntry)document.getElementById("result-pdf-history").onclick=showPDFHistory;
  document.getElementById("again").onclick=()=>restart(src);
  document.getElementById("home").onclick=home;
}

/* ---------- Examen blanc ---------- */
function startExam(){
  const list=drawExam();if(!list.length)return;
  S={mode:"exam",label:"Examen blanc",src:{kind:"exam"},i:0,deadline:Date.now()+EXAM_MIN*60000,items:list.map(q=>({q,order:optionOrder(q),sel:[]}))};
  confirmOpen=false;beginTicks();showExam(true);
}
function fmt(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+":"+String(s).padStart(2,"0")}
function updTimer(){
  if(!S||S.mode!=="exam")return;
  const left=S.deadline-Date.now(),el=document.getElementById("timer");
  if(el){el.textContent=fmt(left);el.classList.toggle("low",left<5*60000)}
  if(left<=0)finishExam(true);
}
function openConfirm(){confirmOpen=true;showExam(false);const c=document.getElementById("confirm");if(c&&c.scrollIntoView)c.scrollIntoView({block:"center",behavior:"smooth"})}
function showExam(top){
  const N=S.items.length,it=S.items[S.i],q=it.q,multi=q.a.length>1;
  const answered=S.items.filter(x=>x.sel.length).length,blank=N-answered;
  const cells=S.items.map((x,k)=>`<button class="cell num${x.sel.length?" on":""}${k===S.i?" cur":""}" data-go="${k}" aria-label="Question ${k+1}${x.sel.length?", répondue":""}">${k+1}</button>`).join("");
  paint(`
  <div class="bar-top"><button class="quit${armed?" armed":""}" id="quit">${armed?"Confirmer l'abandon":"Quitter"}</button>
    <span class="where num">Question <b>${S.i+1}</b>/${N}</span><span class="timer num" id="timer" aria-label="Temps restant">${fmt(S.deadline-Date.now())}</span></div>
  <div class="prog"><span style="width:${answered/N*100}%"></span></div>
  <p class="qmeta"><span>${multi?"Plusieurs réponses possibles":"Une seule réponse"}</span></p>
  <h2 class="qtext">${esc(q.q)}</h2>
  ${optionsHtml(it,false)}
  <div class="act"><button class="btn ghost" id="prev" ${S.i?"":"disabled"}>Précédente</button><button class="btn" id="nxt">${S.i===N-1?"Terminer":"Suivante"}</button></div>
  <div class="grid30">${cells}</div>
  <div class="legend"><span><i class="l-on"></i>Répondue</span><span><i></i>Sans réponse</span><span class="num">${answered}/${N} répondues</span></div>
  ${confirmOpen?`<div class="confirm" id="confirm">${blank?`Il reste ${plural(blank,"question")} sans réponse. Une question sans réponse compte comme fausse.`:"Toutes les questions ont une réponse."} Rendre la copie maintenant ?
    <div class="act"><button class="btn ghost" id="cancel">Continuer</button><button class="btn" id="hand">Rendre la copie</button></div></div>`
    :`<button class="btn ghost submit" id="submit">Rendre la copie</button>`}`,top);
  updTimer();
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickExam(+b.dataset.oi));
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  document.getElementById("prev").onclick=()=>go(S.i-1);
  document.getElementById("nxt").onclick=()=>{if(S.i===N-1)openConfirm();else go(S.i+1)};
  const sb=document.getElementById("submit");if(sb)sb.onclick=openConfirm;
  const cc=document.getElementById("cancel");if(cc)cc.onclick=()=>{confirmOpen=false;showExam(false)};
  const h=document.getElementById("hand");if(h)h.onclick=()=>finishExam(false);
  document.getElementById("quit").onclick=()=>{if(!armed){armed=true;showExam(false);return}home()};
}
function pickExam(oi){
  const it=S.items[S.i];armed=false;
  if(it.q.a.length>1)it.sel=it.sel.includes(oi)?it.sel.filter(x=>x!==oi):[...it.sel,oi];else it.sel=[oi];
  showExam(false);
}
function go(k){if(!S||k<0||k>=S.items.length)return;armed=false;confirmOpen=false;S.i=k;showExam(true)}
function finishExam(timeout){
  if(!S||S.mode!=="exam")return;
  stopAll();
  const items=S.items,N=items.length;
  items.forEach(x=>{x.ok=x.sel.length>0&&same(x.q.a,x.sel);if(x.sel.length)record(x.q,x.ok)});
  const c=items.filter(x=>x.ok).length,v=Math.round(c/N*200)/10,pass=v>=PASS;
  const ex=load(KEY_EX,[]);ex.push({d:Date.now(),c,n:N,r:items.map(x=>x.ok?1:0)});save(KEY_EX,ex.slice(-30));
  const need=Math.max(0,Math.ceil(N*PASS/20)-c),blank=items.filter(x=>!x.sel.length).length;
  const per=META.map(m=>{const its=items.filter(x=>x.q.mod===m.id);if(!its.length)return "";const ok=its.filter(x=>x.ok).length;
    return `<div><span>${m.complement?"Complément":esc(m.id)+". "+esc(m.short||m.title)}</span><b class="num${ok/its.length<.6?" low":""}">${ok}/${its.length}</b></div>`}).join("");
  const cells=items.map((x,k)=>x.ok?`<span class="cell num r">${k+1}</span>`:`<a class="cell num w${x.sel.length?"":" e"}" href="#c${k+1}">${k+1}</a>`).join("");
  const wrong=items.map((x,k)=>({x,k})).filter(o=>!o.x.ok);
  S=null;
  paint(`
  <div class="res">
    <p class="lbl">Examen blanc${timeout?", temps écoulé":""}</p>
    <div class="score num">${n20txt(v)}<small>/20</small></div>
    <span class="verdict ${pass?"":"ko"}">${pass?"Examen réussi":"Pas encore validé"}</span>
    <p class="sum">${bonnes(c)} sur ${N}.${pass?"":` Il manquait ${bonnes(need)} pour atteindre ${PASS}/20.`}${blank?` ${plural(blank,"question")} sans réponse.`:""}</p>
    <div class="grid30">${cells}</div>
    <div class="legend"><span><i class="l-r"></i>Juste</span><span><i class="l-w"></i>Faux, touche pour voir la correction</span></div>
    <div class="break">${per}</div>
    ${wrong.length?`<section class="corr"><h3>Correction</h3>${wrong.map(o=>corrItem(o.x,o.k+1)).join("")}</section>`:""}
    <div class="act"><button class="btn" id="again">Nouvel examen</button><button class="btn ghost" id="home">Accueil</button></div>
  </div>`,true);
  document.getElementById("again").onclick=startExam;
  document.getElementById("home").onclick=home;
  app.querySelectorAll("a.cell").forEach(a=>a.onclick=()=>{const d=document.querySelector(a.getAttribute("href"));if(d)d.open=true});
}
function corrItem(x,num){
  const q=x.q;
  return `<details id="c${num}"><summary><span class="q num">${num}</span><span>${esc(q.q)}</span></summary><div class="in">
    <p class="you">${x.sel.length?"Ta réponse : "+esc(x.sel.map(i=>q.o[i]).join(" · ")):"Pas de réponse"}</p>
    <p class="ans">Bonne réponse : ${esc(q.a.map(i=>q.o[i]).join(" · "))}</p>
    ${q.e?`<p class="ex">${esc(q.e)}</p>`:""}</div></details>`;
}

/* ---------- Clavier : 1 à 7 pour répondre, Entrée pour valider ou continuer, flèches en examen ---------- */
document.addEventListener("keydown",e=>{
  if(!S||e.metaKey||e.ctrlKey||e.altKey)return;
  const it=S.items[S.i];if(!it)return;
  const map={"1":0,"2":1,"3":2,"4":3,"5":4,"6":5,"7":6};
  if(e.key in map&&it.order[map[e.key]]!==undefined&&!it.done){
    e.preventDefault();const oi=it.order[map[e.key]];
    if(S.mode==="train")pickTrain(oi);else pickExam(oi);
  }else if(e.key==="Enter"&&(document.activeElement===document.body||document.activeElement===null)){
    if(S.mode==="train"){if(it.done){e.preventDefault();nextTrain()}else if(it.sel.length){e.preventDefault();validateTrain()}}
    else if(S.i<S.items.length-1){e.preventDefault();go(S.i+1)}
  }else if(S.mode==="exam"&&e.key==="ArrowRight")go(S.i+1);
  else if(S.mode==="exam"&&e.key==="ArrowLeft")go(S.i-1);
});
home();
</script>
</body>
