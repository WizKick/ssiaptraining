<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>SSIAP 1 · OFFICIEL 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Fond noir, textes blanc cassé : moins de fatigue visuelle sur de longues séances qu'un blanc pur. */
:root{
  --page:#000; --s1:#121212; --s2:#1B1B1B; --s3:#262626;
  --line:#242424; --line-2:#383838;
  --text:#ECECEC; --dim:#B4B4B4; --mute:#8A8A8A; --soft:#5C5C5C;
  --hi:#FFFFFF; --on-hi:#000;
  --bad:#F0605B; --bad-bg:#2A1312;
  --q:22px; --o:16.5px;
  --font:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
}
html.t2{--q:25px;--o:18.5px}
html.t3{--q:28px;--o:20.5px}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);background:var(--page)}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--hi);outline-offset:3px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 64px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Boutons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;
  font-weight:700;font-size:16px;background:var(--hi);color:var(--on-hi);text-align:center;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn.ghost:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--dim)}
.btn:disabled{opacity:.3}

/* ---------- Accueil ---------- */
.brand{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
.brand h1{margin:0 auto 0 0;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--hi)}
.chip{display:inline-flex;align-items:center;gap:1px;height:34px;line-height:1;padding:0 14px;border-radius:999px;background:var(--s2);color:var(--dim);font-size:14px;font-weight:600}
.chip b{color:var(--hi);font-weight:800}
.chip.set{background:var(--hi);color:var(--on-hi)}
.chip.set b{color:var(--on-hi)}

.resume{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--s1);border:1.5px solid var(--dim);border-radius:18px;padding:14px 16px;margin-top:12px}
.resume div{flex:1 1 100%;min-width:0}
.resume b{display:block;font-size:15.5px;color:var(--hi)}
.resume small{color:var(--mute);font-size:13.5px}
.resume .btn{min-height:42px;padding:0 18px;font-size:15px}
.resume .x{color:var(--mute);font-size:13.5px;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.block{margin-top:30px}
.block h3{margin:0 0 10px;font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--hi)}
.block .sub{margin:-6px 0 12px;color:var(--mute);font-size:14.5px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;min-height:120px;transition:border-color .15s}
.mode:hover:not(:disabled){border-color:var(--line-2)}
.mode .n{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:auto;color:var(--hi)}
.mode .tt{font-weight:700;font-size:15.5px;margin-top:10px;line-height:1.25;color:var(--hi)}
.mode .s{font-size:13.5px;color:var(--mute);line-height:1.35}
.mode.wide{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center}
.mode.wide .n{font-size:28px;margin:0;grid-row:span 2;min-width:1.6ch}
.mode.wide .tt{margin:0}
.mode:disabled{opacity:.45}
.settings{background:var(--s1);border:1px solid var(--line);border-radius:18px}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-top:1px solid var(--line);font-size:15.5px}
.set:first-child{border-top:0}
.set small{display:block;color:var(--mute);font-size:13px}
.sound-buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sound-buttons .chip{font-size:12px;padding:0 10px;min-height:34px}
.sound-preview{flex-wrap:wrap}
.seg{display:flex;background:var(--s2);border-radius:999px;padding:3px;flex:none}
.seg button{min-width:42px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--mute);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--hi);color:var(--on-hi)}
.seg .a1{font-size:13px}.seg .a2{font-size:16px}.seg .a3{font-size:19px}
.sw{flex:none;width:50px;height:30px;border-radius:999px;background:var(--s3);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mute);transition:transform .15s,background .15s}
.sw[aria-checked="true"]{background:var(--hi)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-hi)}
.foot{margin-top:30px;color:var(--mute);font-size:13.5px;text-align:center}
.foot button{color:var(--mute);text-decoration:underline;text-underline-offset:3px;padding:8px;font-size:13.5px}
.warn{background:var(--bad-bg);border:1px solid var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
/* ---------- Séance ---------- */
.bar-top{position:sticky;top:0;z-index:5;background:var(--page);padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px;margin:-20px 0 8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.quit{font-size:15px;font-weight:600;padding:8px 2px;min-height:40px;color:var(--dim)}
.quit.armed{color:var(--bad)}
.where{font-size:15px;color:var(--mute)}
.where b{color:var(--hi)}
.clock{font-size:14px;color:var(--mute);min-width:44px;text-align:right}
.timer{font-weight:800;font-size:19px;letter-spacing:-.01em;background:var(--hi);color:var(--on-hi);border-radius:999px;padding:4px 12px}
.timer.low{background:var(--bad);color:#000}
.prog{height:4px;background:var(--s3);border-radius:4px;overflow:hidden;margin:4px 0 20px}
.prog span{display:block;height:100%;background:var(--hi);transition:width .25s}
.qmeta{font-size:13.5px;color:var(--mute);margin:0 0 8px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.streak{color:var(--hi);font-weight:700}
.qtext{font-size:var(--q);line-height:1.32;font-weight:700;letter-spacing:-.015em;margin:0 0 20px;max-width:34em;color:var(--hi)}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:flex-start;gap:13px;width:100%;min-height:54px;padding:14px 16px;background:var(--s1);
  border:1.5px solid var(--line);border-radius:14px;font-size:var(--o);line-height:1.42;color:var(--text);transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--line-2);background:var(--s2)}
.mk{flex:none;width:22px;height:22px;margin-top:2px;border:1.75px solid var(--line-2);border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;line-height:1}
.multi .mk{border-radius:6px}
.key{display:none;flex:none;margin-left:auto;color:var(--soft);font-size:13px;font-weight:600;padding-top:3px}
@media (hover:hover) and (pointer:fine){.key{display:block}}
.opt.sel{border-color:var(--hi);background:var(--s2)}
.opt.sel .mk{background:var(--hi);border-color:var(--hi);color:var(--on-hi)}
.opt.good{background:#22c55e;border-color:#22c55e;color:#031b0b}
.opt.good .mk{background:#031b0b;border-color:#031b0b;color:#22c55e}
.opt.good .key{color:#134e25}
.opt.bad{border-color:#dc2626;background:#dc2626;color:#fff}
.opt.bad .txt{text-decoration:line-through;text-decoration-color:#fff;color:#fff}
.opt.bad .mk{border-color:#fff;background:#fff;color:#dc2626}
.opt.bad .key{color:#fff}
.opt.dim{opacity:.4}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;background:var(--s1);border:1px solid var(--line)}
.fb .v{font-weight:800;font-size:17px;color:var(--hi)}
.fb.ko{border-color:var(--bad)}
.fb.ko .v{color:var(--bad)}
.fb p{margin:6px 0 0;font-size:15.5px;color:var(--dim)}
.fb p b{color:var(--hi)}
.act{display:flex;gap:10px;margin-top:18px}
.act .btn{flex:1}
.pause{display:flex;gap:12px;align-items:center;background:var(--s2);border-radius:14px;padding:12px 14px;margin:0 0 16px;font-size:14.5px;color:var(--dim)}
.pause span{flex:1}
.pause button{color:var(--hi);font-weight:700;padding:6px 4px}
/* ---------- Résultat ---------- */
.res .lbl{color:var(--mute);font-size:15px;margin:10px 0 0}
.score{font-size:84px;font-weight:800;letter-spacing:-.05em;line-height:1;margin:6px 0 6px;color:var(--hi)}
.score small{font-size:32px;color:var(--soft);letter-spacing:-.02em;font-weight:700}
.verdict{display:inline-flex;align-items:center;font-weight:700;font-size:16px;border-radius:999px;padding:6px 14px;background:var(--hi);color:var(--on-hi)}
.verdict.ko{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.res .sum{color:var(--dim);margin:14px 0 0;max-width:52ch}
.break{background:var(--s1);border:1px solid var(--line);border-radius:18px;margin-top:24px}
.break div{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:15px;color:var(--dim)}
.break div:first-child{border-top:0}
.break b{font-weight:700;color:var(--hi)}
.break b.low{color:var(--bad)}
.corr{margin-top:26px}
.corr h3{font-size:18px;margin:0 0 10px;color:var(--hi)}
.corr details{background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.corr summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;gap:10px;color:var(--text)}
.corr summary::-webkit-details-marker{display:none}
.corr summary .q{color:var(--mute);font-weight:700;min-width:2.2ch;flex-shrink:0}
.corr summary .q.orange{color:var(--pdf-orange)}
.corr summary .q.red{color:var(--pdf-red)}
.corr .in{padding:0 16px 14px;font-size:15px}
.corr .in p{margin:6px 0 0}
.corr .you{color:var(--bad)}
.corr .ans{font-weight:700;color:var(--hi)}
.corr .ex{color:var(--dim)}
@media (min-width:640px) {
  .wrap{padding:28px 24px 72px}
  .brand h1{font-size:32px}
  .modes{grid-template-columns:repeat(3,1fr)}
  .mode.wide{grid-column:auto;display:flex;flex-direction:column;align-items:stretch;min-height:120px}
  .mode.wide .n{font-size:32px;margin-bottom:auto}
  .mode.wide .tt{margin-top:10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- OFFICIEL 2026 ---------- */
.official-2026{border:1px solid var(--line-2);border-radius:22px;padding:20px;background:var(--s1)}
.official-2026 .mode{background:var(--s2)}
.pdf-intro,.pdf-source{color:var(--mute);font-size:14px}
.pdf-tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.pdf-tools .btn{min-height:44px;padding:0 16px;font-size:14px}
.pdf-tools form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.pdf-tools input{width:72px;background:var(--s2);border:1px solid var(--line-2);border-radius:8px;padding:8px;color:var(--text)}
.pdf-chapters{display:flex;gap:8px;flex-wrap:wrap}
.pdf-chapters a{height:auto;min-height:34px;line-height:1.3;padding:8px 12px;text-decoration:none;font-size:12px}
.pdf-chapter{margin:30px 0 12px;font-size:18px;color:var(--hi)}
.pdf-card{background:var(--s1);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
.pdf-card summary{cursor:pointer;display:flex;gap:12px;padding:16px;align-items:flex-start;font-size:15px;list-style:none}
.pdf-card summary::-webkit-details-marker{display:none}
.pdf-card summary::after{content:"+";margin-left:auto;color:var(--mute);flex-shrink:0}
.pdf-card[open] summary::after{content:"−"}
.pdf-number{font-weight:800;color:var(--hi);flex-shrink:0;min-width:40px}
.pdf-answer{border-top:1px solid var(--line);padding:10px 16px 16px}
.pdf-options{list-style:none;padding:0;margin:0;font-size:15px}
.pdf-options li{display:flex;gap:10px;padding:8px 10px;margin:4px 0;border-radius:8px;color:var(--dim)}
.pdf-options .pdf-correct{background:#22c55e;color:#031b0b;font-weight:700}
.pdf-source{font-size:12px;margin:10px 0 0}

/* ---------- Suivi OFFICIEL 2026 ---------- */
:root{--pdf-green:#58d68d;--pdf-orange:#ffb454;--pdf-red:#ff7474}
.pdf-scoreboard{margin:14px 0}
.pdf-counter-label{font-size:12px;color:var(--dim);margin:0 0 8px}
.pdf-counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.pdf-count{border:1px solid var(--line-2);border-radius:12px;padding:11px 8px;background:var(--s2);min-width:0}
.pdf-count strong{display:block;font-size:21px;line-height:1.2;white-space:nowrap}
.pdf-count span{display:block;font-size:11px;color:var(--dim);line-height:1.3;margin-top:5px;overflow-wrap:anywhere}
.green{color:var(--pdf-green)}.orange{color:var(--pdf-orange)}.red{color:var(--pdf-red)}.unseen{color:var(--mute)}
.pdf-count.green,.pdf-result-cell.green{background:#10271b;border-color:#2e7650}
.pdf-count.orange,.pdf-result-cell.orange{background:#2d2112;border-color:#8a6230}
.pdf-count.red,.pdf-result-cell.red{background:#2d1515;border-color:#8b4040}
.pdf-session-panel{margin:0 0 20px;padding:0 0 12px;border-bottom:1px solid var(--line)}
.pdf-live-note{font-size:12px;color:var(--dim);margin:5px 0}
.pdf-map summary{font-size:12px;color:var(--dim);cursor:pointer;padding:6px 0}
.pdf-result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:5px;margin:14px 0}
.pdf-result-cell{display:flex;align-items:center;justify-content:center;min-height:30px;font-size:11px;border:1px solid var(--line-2);border-radius:5px;background:var(--s2)}
.pdf-result-cell.current{outline:2px solid var(--hi);outline-offset:1px}
.fb.pdf-feedback.green{border-color:var(--pdf-green);background:#10271b}
.fb.pdf-feedback.orange{border-color:var(--pdf-orange);background:#2d2112}
.fb.pdf-feedback.red{border-color:var(--pdf-red);background:#2d1515}
.fb.pdf-feedback .v{color:inherit}
.res .act{flex-wrap:wrap}
.res .act .btn{flex:1 1 160px}
.pdf-history-empty{font-size:13px;color:var(--mute);margin:16px 0 0}
.pdf-history-preview{margin:16px 0 0;border-top:1px solid var(--line-2)}
.pdf-mini-session{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-size:13px;border-bottom:1px solid var(--line)}
.pdf-mini-session small,.pdf-history-card summary small{display:block;font-size:11px;color:var(--mute);margin-top:3px}
.pdf-mini-scores{display:flex;gap:12px;flex-wrap:wrap;flex-shrink:0;font-size:13px}
.pdf-history-card{border:1px solid var(--line-2);border-radius:16px;background:var(--s1);margin:14px 0;overflow:hidden}
.pdf-history-card>summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;cursor:pointer;list-style:none;font-size:14px}
.pdf-history-card>summary::after{content:"+";color:var(--mute)}
.pdf-history-card[open]>summary::after{content:"−"}
.pdf-history-card>summary::-webkit-details-marker{display:none}
.pdf-history-body{border-top:1px solid var(--line);padding:0 16px 16px;font-size:14px}
.pdf-trend{font-size:13px;color:var(--dim)}
.pdf-history-corrections h4{font-size:15px;margin:20px 0 10px}
.pdf-history-corrections details{border-top:1px solid var(--line);padding:12px 0}
.pdf-history-corrections summary{cursor:pointer;font-size:13px}
.pdf-history-corrections p{font-size:12px;color:var(--dim)}
@media(max-width:480px){.pdf-history-card>summary{flex-wrap:wrap}.pdf-mini-scores{gap:8px}.pdf-counters{gap:5px}.pdf-count strong{font-size:19px}.pdf-count{padding:10px 6px}.pdf-count span{font-size:10px}}
.pdf-timed-rule{font-size:13px;color:var(--dim);margin:0 0 12px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px}
</style>
</head>

<main class="wrap" id="app" aria-live="polite"></main>

"use strict";
const KEY_STATS="ssiap1c_stats", KEY_SES="ssiap1c_session", KEY_SET="ssiap1c_settings";

function optionOrder(q){return q.o.map((_,i)=>i)}
function record(q,ok){
  const st=load(KEY_STATS,{}),s=st[q.id]||{ok:0,ko:0,last:0};
  if(ok)s.ok++;else s.ko++;s.last=ok?1:0;s.t=Date.now();st[q.id]=s;save(KEY_STATS,st);
}
const SET=Object.assign({size:1,sound:true},load(KEY_SET,{}));
function saveSet(){save(KEY_SET,SET)}
let feedbackAudio=null,feedbackMaster=null;
async function playResultSound(color){
  if(!SET.sound)return;
  if(color==="orange")color="red";
  const melodies={green:[[784,0,.12],[988,.1,.12],[1175,.2,.18]],red:[[220,0,.18],[147,.17,.23]]};
  const notes=melodies[color];if(!notes)return;
  try{
    const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
    if(!feedbackAudio){feedbackAudio=new Audio();feedbackMaster=feedbackAudio.createGain();feedbackMaster.connect(feedbackAudio.destination)}
    if(feedbackAudio.state==="suspended")await feedbackAudio.resume();
    if(!SET.sound)return;
    feedbackMaster.gain.setValueAtTime(1,feedbackAudio.currentTime);
    const start=feedbackAudio.currentTime+.01;
    notes.forEach(([frequency,delay,duration])=>{
      const oscillator=feedbackAudio.createOscillator(),gain=feedbackAudio.createGain(),at=start+delay;
      oscillator.type=color==="red"?"triangle":"sine";
      oscillator.frequency.setValueAtTime(frequency,at);
      gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.12,at+.008);gain.gain.exponentialRampToValueAtTime(.001,at+duration);
      oscillator.connect(gain);gain.connect(feedbackMaster);oscillator.start(at);oscillator.stop(at+duration+.015);
      oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()};
    });
  }catch(e){}
}

function home(){

      <div class="modes">

        <button class="mode wide" id="go-pdf2026-random"><span class="n">↝</span><span class="tt">S’entraîner en aléatoire</span><span class="s">Les 216 questions, mélangées à chaque session</span></button>
        <button class="mode wide" id="go-pdf2026-timed"><span class="n num">30</span><span class="tt">Examen 20/20 · 30 questions</span><span class="s">60 secondes par question · sans-faute obligatoire</span></button>

        <button class="mode wide" id="go-pdf2026-history"><span class="n">↗</span><span class="tt">Historique et progression</span><span class="s">Comparer les sessions et retravailler les erreurs</span></button>
      </div>

      </div>
    </section>
    <p class="foot"><button id="reset">Réinitialiser ma progression OFFICIEL 2026</button></p>
  `,true);
  document.getElementById("go-pdf2026").onclick=startPDF2026;
  document.getElementById("go-pdf2026-random").onclick=startPDF2026Random;
  document.getElementById("go-pdf2026-timed").onclick=startPDFTimed;
  document.getElementById("read-pdf2026").onclick=readPDF2026;
  document.getElementById("go-pdf2026-history").onclick=showPDFHistory;
  if(canResume){document.getElementById("resume").onclick=()=>resumeSession(saved);document.getElementById("drop").onclick=()=>{drop(KEY_SES);home()}}
  if(document.getElementById("resume-pdf-timed"))document.getElementById("resume-pdf-timed").onclick=resumePDFTimed;
  if(document.getElementById("drop-pdf-timed"))document.getElementById("drop-pdf-timed").onclick=()=>{drop(KEY_PDF_TIMED);home()};

function pdfCounts(results,total=PDF2026.length){
  const counts={green:0,orange:0,red:0,unseen:total};
  results.forEach(r=>{if(r&&["green","orange","red"].includes(r.color)){counts[r.color]++;counts.unseen--}});
  return counts;
}
function pdfCounters(counts,label,redLabel="Sans bon choix"){
  return `<section class="pdf-scoreboard" aria-label="${esc(label)}"><p class="pdf-counter-label">${esc(label)}</p><div class="pdf-counters">${[["green","✓","Correctes"],["orange","◐","Partielles"],["red","✕",redLabel],["unseen","·","À répondre"]].map(([color,icon,title])=>`<div class="pdf-count ${color}"><strong class="num">${icon} ${counts[color]}</strong><span>${title}</span></div>`).join("")}</div></section>`;
}
function pdfGlobalResults(){
  const stats=load(KEY_STATS,{});
  return PDF2026.map(q=>{const stat=stats[q.id];return {n:q.n,color:stat?(stat.pdfColor||(stat.last===1?"green":"red")):null}});
}
function pdfGrid(results,current){
  return `<div class="pdf-result-grid" aria-label="Résultats par question">${results.map(r=>`<span class="pdf-result-cell num ${r.color||"unseen"}${r.n===current?" current":""}" title="Q${r.n} : ${PDF_LABELS[r.color||"unseen"]}" aria-label="Q${r.n} : ${PDF_LABELS[r.color||"unseen"]}">${r.n}</span>`).join("")}</div>`;
}
function pdfSessionResults(){return S.items.filter(x=>!x.retry).map(x=>({n:x.q.n,color:x.done?pdfColor(x.q,x.sel):null,selected:x.done?x.sel.slice():[]}))}
function pdfSnapshot(completed=false){
  if(!isPDFSession())return null;
  const results=pdfSessionResults(),counts=pdfCounts(results,S.total);
  if(counts.unseen===S.total)return null;
  const entry={id:S.sessionId,d:S.sessionDate||S.start,updated:Date.now(),mode:S.src.kind==="pdf2026review"?"review":S.src.kind==="pdf2026random"?"random":"ordered",sourceSessionId:S.src.sourceSessionId||null,total:S.total,counts,results,completed,duration:Date.now()-S.start,mastered:S.master.size};
  const history=load(KEY_PDF_HISTORY,[]),index=history.findIndex(x=>x.id===entry.id);
  if(index<0)history.push(entry);else history[index]=entry;
  save(KEY_PDF_HISTORY,history);
  return entry;
}
function pdfSessionPanel(){
  const results=pdfSessionResults(),counts=pdfCounts(results,S.total);
  return `<div class="pdf-session-panel">${pdfCounters(counts,"Cette session · résultats au premier essai")}<p class="pdf-live-note num">${S.total-counts.unseen}/${S.total} questions évaluées · ${S.master.size}/${S.total} réussies après correction</p><details class="pdf-map"><summary>Voir les ${S.total} résultats par question</summary>${pdfGrid(results,S.items[S.i].q.n)}</details></div>`;
}
function pdfModeLabel(mode){return mode==="review"?"Révision · orange et rouge":mode==="timed30"?"Examen 30 · objectif 20/20":mode==="random"?"Aléatoire":"Ordre du PDF"}
function pdfHistoryPreview(){
  const history=load(KEY_PDF_HISTORY,[]);
  if(!history.length)return `<p class="pdf-history-empty">Ton historique apparaîtra dès ta première réponse validée.</p>`;
  return `<div class="pdf-history-preview">${history.slice(-3).reverse().map(h=>`<div class="pdf-mini-session"><span>${pdfModeLabel(h.mode)}<small>${new Date(h.d).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} · ${h.mode==="timed30"&&h.completed?n20txt(h.score20)+"/20 · "+(h.passed?"Validé":"Non validé"):h.completed?"Terminée":"Partielle"}</small></span><span class="pdf-mini-scores num"><b class="green">✓ ${h.counts.green}</b><b class="orange">◐ ${h.counts.orange}</b><b class="red">✕ ${h.counts.red}</b></span></div>`).join("")}</div>`;
}
function pdfReviewQuestions(h){
  const seen=new Set();
  return (h.results||[]).filter(r=>r.color==="orange"||r.color==="red").map(r=>PDF2026.find(q=>q.n===r.n)).filter(q=>q&&!seen.has(q.id)&&seen.add(q.id));
}
function pdfReviewButton(h){
  const count=pdfReviewQuestions(h).length;
  return count?`<div class="act"><button class="btn" data-pdf-review="${esc(h.id)}">Retravailler les orange et rouges (${count})</button></div><p class="pdf-source">Une nouvelle session avec uniquement ces ${count} questions. Le test d’origine reste conservé.</p>`:"";

function bindPDFReviewButtons(){

function startPDFReview(sessionId){

function pdfHistoryCard(h,previous,activeId){
  const answered=h.total-h.counts.unseen,pct=answered?Math.round(h.counts.green/answered*100):0;
  const delta=h.completed&&previous?Math.round(h.counts.green/h.total*100)-Math.round(previous.counts.green/previous.total*100):null;
  const progress=delta===null?"":`<p class="pdf-trend num">${delta>0?"+":""}${delta} points de réussite face à ta précédente session complète dans ce mode.</p>`;
  return `<details class="pdf-history-card"><summary><span><b>${pdfModeLabel(h.mode)}</b><small>${new Date(h.d).toLocaleString("fr-FR")} · ${h.completed?"Terminée":h.id===activeId?"En cours / à reprendre":"Interrompue"} · ${answered}/${h.total} évaluées</small></span><span class="pdf-mini-scores num"><b class="green">✓ ${h.counts.green}</b><b class="orange">◐ ${h.counts.orange}</b><b class="red">✕ ${h.counts.red}</b></span></summary><div class="pdf-history-body">${pdfCounters(h.counts,"Résultats au premier essai",h.mode==="timed30"?"Erreurs / délai":"Sans bon choix")}<p class="num">${pct} % entièrement correctes sur les ${answered} questions évaluées${h.mode==="timed30"?" · "+n20txt(Math.round(h.counts.green/h.total*200)/10)+"/20"+(h.completed?" · "+(h.passed?"Validé":"Non validé"):""):h.completed?" · "+h.mastered+"/"+h.total+" réussies après correction":""}.</p>${progress}${pdfReviewButton(h)}<p class="pdf-source">Les nombres ci-dessous sont les numéros du PDF, affichés dans l’ordre de cette session.</p>${pdfGrid(h.results)}${h.results.some(r=>r.color&&r.color!=="green")?`<div class="pdf-history-corrections"><h4>Questions à retravailler au premier essai</h4>${h.results.filter(r=>r.color&&r.color!=="green").map(r=>{const q=PDF2026.find(q=>q.n===r.n);return `<details><summary><span class="${r.color}">${r.color==="orange"?"◐":"✕"} Q${r.n}</span> ${esc(q.q)}</summary><div>${r.timedOut?'<p class="red">Temps écoulé : réponse non validée dans la minute.</p>':""}<p>Ton choix : ${esc((r.selected||[]).map(i=>q.o[i]).join(" · ")||"Non enregistré")}</p><p>Correction : <b>${esc(q.a.map(i=>q.o[i]).join(" · "))}</b></p></div></details>`}).join("")}</div>`:""}</div></details>`;
}
function showPDFHistory(){

  document.getElementById("pdf-history-back").onclick=home;
  bindPDFReviewButtons();

function train(list,label,src){
  if(!list.length){home();return}
  S={mode:"train",label,src,i:0,total:list.length,master:new Set(),combo:0,start:Date.now(),brk:Date.now(),
    items:list.map(q=>({q,order:optionOrder(q),sel:[],done:false,ok:false,retry:false}))};
  if(isPDFSession()){S.sessionId="pdf2026-"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);S.sessionDate=S.start}
  persist();beginTicks();showTrain(true);
}
function beginTicks(){stopAll();armed=false;keepAwake(true);tick=setInterval(()=>S&&(S.mode==="train"?updClock():S.mode==="pdftimed"?updPDFTimed():null),250)}
function persist(){
  if(!S||S.mode!=="train")return;
  pdfSnapshot();
  save(KEY_SES,{label:S.label,src:S.src,i:S.i,total:S.total,master:[...S.master],sessionId:S.sessionId,sessionDate:S.sessionDate,elapsedMs:Date.now()-S.start,
    items:S.items.map(x=>({id:x.q.id,order:x.order,sel:x.sel,done:x.done,ok:x.ok,retry:x.retry}))});
}
function resumeSession(s){
  S={mode:"train",label:s.label,src:s.src,i:Math.min(s.i,s.items.length-1),total:s.total,master:new Set(s.master),combo:0,start:Date.now()-(s.elapsedMs||0),brk:Date.now(),sessionId:s.sessionId||"pdf2026-"+Date.now().toString(36),sessionDate:s.sessionDate||Date.now(),
    items:s.items.map(x=>({q:BY_ID[x.id],order:x.order,sel:x.sel||[],done:!!x.done,ok:!!x.ok,retry:!!x.retry}))};
  beginTicks();showTrain(true);
}
function clockTxt(){const s=Math.floor((Date.now()-S.start)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?h+" h "+String(m).padStart(2,"0"):m+":"+String(x).padStart(2,"0")}
function updClock(){
  const el=document.getElementById("clock");if(el)el.textContent=clockTxt();
}
function optionsHtml(it,reveal){
  const q=it.q,multi=q.a.length>1;
  return `<div class="opts${multi?" multi":""}" role="${multi?"group":"radiogroup"}">`+it.order.map((oi,k)=>{
    let cls="opt",g="";
    if(reveal){if(q.a.includes(oi)){cls+=" good";g="✓"}else if(it.sel.includes(oi)){cls+=" bad";g="✕"}else cls+=" dim"}
    else if(it.sel.includes(oi)){cls+=" sel";g="✓"}
    return `<button class="${cls}" data-oi="${oi}" role="${multi?"checkbox":"radio"}" aria-checked="${it.sel.includes(oi)}" ${reveal?"disabled":""}><span class="mk">${g}</span><span class="txt">${esc(q.o[oi])}</span>${k<7?`<span class="key">${k+1}</span>`:""}</button>`;
  }).join("")+`</div>`;
}
function showTrain(top){
  const it=S.items[S.i],q=it.q,multi=q.a.length>1,last=S.i===S.items.length-1;
  let fb="",nav="";
  if(it.done){
    const color=pdfColor(q,it.sel);
    const verdict=color==="orange"?"◐ Réponse partielle":color==="red"?"✕ Aucun bon choix":it.ok?"✓ Bonne réponse":"✕ Ce n'est pas ça";
    fb=`<div class="fb ${color?"pdf-feedback "+color:it.ok?"ok":"ko"}"><div class="v">${verdict}</div>
      ${color?`<p class="num">${it.sel.filter(i=>q.a.includes(i)).length}/${q.a.length} bons choix sélectionnés${it.sel.some(i=>!q.a.includes(i))?" · "+it.sel.filter(i=>!q.a.includes(i)).length+" choix incorrect(s)":""}.</p>`:""}
      ${it.ok?"":`<p>À retenir : <b>${esc(q.a.map(i=>q.o[i]).join(" · "))}</b>. Cette question revient juste après.</p>`}
      ${q.e?`<p>${esc(q.e)}</p>`:""}</div>`;
    nav=`<button class="btn" id="next">${last?"Voir mon résultat":"Question suivante"}</button>`;
  }else if(multi){nav=`<button class="btn" id="validate" ${it.sel.length?"":"disabled"}>Valider</button>`}
  paint(`
  <div class="bar-top"><button class="quit" id="quit">Accueil</button><span class="where num"><b>${S.master.size}</b>/${S.total} réussies</span><span class="clock num" id="clock">${clockTxt()}</span></div>
  <div class="prog"><span style="width:${S.master.size/S.total*100}%"></span></div>
  <p class="qmeta"><span>${"OFFICIEL 2026 · Q"+q.n+"/"+PDF2026.length+" · "+esc(q.section)+" – "+esc(q.sectionTitle)}</span><span>${multi?"Plusieurs réponses possibles":"Une seule réponse"}${it.retry?", deuxième essai":""}</span>${S.combo>=3?`<span class="streak num">${S.combo} de suite</span>`:""}</p>
  ${isPDFSession()?pdfSessionPanel():""}
  <h2 class="qtext">${esc(q.q)}</h2>
  ${optionsHtml(it,it.done)}
  ${fb}
  ${nav?`<div class="act">${nav}</div>`:""}`,top);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickTrain(+b.dataset.oi));
  const v=document.getElementById("validate");if(v)v.onclick=validateTrain;
  const n=document.getElementById("next");if(n){n.onclick=nextTrain;n.focus({preventScroll:true});const f=app.querySelector(".fb");if(f&&f.scrollIntoView)f.scrollIntoView({block:"nearest",behavior:"smooth"})}
  document.getElementById("quit").onclick=home;
}
function pickTrain(oi){
  const it=S.items[S.i];if(it.done)return;
  if(it.q.a.length>1){it.sel=it.sel.includes(oi)?it.sel.filter(x=>x!==oi):[...it.sel,oi];showTrain(false)}
  else{it.sel=[oi];validateTrain()}
}
function validateTrain(){
  const it=S.items[S.i];if(!it.sel.length||it.done)return;
  it.done=true;it.ok=same(it.q.a,it.sel);record(it.q,it.ok);
  playResultSound(it.q.mod==="OF2026"?pdfColor(it.q,it.sel):it.ok?"green":"red");
  if(!it.retry){const stats=load(KEY_STATS,{});stats[it.q.id].pdfColor=pdfColor(it.q,it.sel);save(KEY_STATS,stats)}
  if(it.ok){S.master.add(it.q.id);S.combo++}
  else{S.combo=0;S.items.splice(S.i+1,0,{q:it.q,order:optionOrder(it.q),sel:[],done:false,ok:false,retry:true})}
  persist();showTrain(false);
}
function nextTrain(){if(S.i>=S.items.length-1)finishTrain();else{S.i++;persist();showTrain(true)}}
function finishTrain(){
  const pdfEntry=pdfSnapshot(true);
  drop(KEY_SES);stopAll();
  const base=S.items.filter(x=>!x.retry),N=base.length,c=base.filter(x=>x.ok).length,pct=Math.round(c/N*100);
  const wrong=base.filter(x=>!x.ok),src=S.src,label=S.label,time=clockTxt();
  S=null;
  paint(`
  <div class="res">
    <p class="lbl">${esc(label)}</p>
    <div class="score num">${c}<small>/${N}</small></div>
    <span class="verdict ${pct>=60?"":"ko"}">${pct>=60?"Bon niveau":"À retravailler"}</span>
    <p class="sum">${bonnes(c)} du premier coup, soit ${pct} %, en ${time}. Toutes les questions sont maintenant réussies.</p>
    ${pdfEntry?pdfCounters(pdfEntry.counts,"Bilan de session · premier essai")+pdfGrid(pdfEntry.results)+pdfReviewButton(pdfEntry):""}
    ${wrong.length?`<section class="corr"><h3>Ratées au premier essai</h3>${wrong.map((x,k)=>corrItem(x,k+1)).join("")}</section>`:""}
    <div class="act"><button class="btn" id="again">Recommencer</button><button class="btn ghost" id="home">Accueil</button>${pdfEntry?'<button class="btn ghost" id="result-pdf-history">Historique 2026</button>':""}</div>
  </div>`,true);
  if(pdfEntry)document.getElementById("result-pdf-history").onclick=showPDFHistory;
  bindPDFReviewButtons();
  document.getElementById("again").onclick=()=>restart(src);
  document.getElementById("home").onclick=home;
}

function unlockResultAudio(){
  if(!SET.sound)return;
  try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
    if(!feedbackAudio){feedbackAudio=new Audio();feedbackMaster=feedbackAudio.createGain();feedbackMaster.connect(feedbackAudio.destination)}
    if(feedbackAudio.state==="suspended")feedbackAudio.resume().catch(()=>{});
  }catch(e){}
}
function pdfTimedStoredOK(saved){return saved&&Array.isArray(saved.items)&&saved.items.length===30&&saved.items.every(x=>BY_ID[x.id]&&BY_ID[x.id].mod==="OF2026")}
function pdfTimedResumeHTML(){
  const saved=load(KEY_PDF_TIMED,null);if(!pdfTimedStoredOK(saved))return "";
  const evaluated=saved.items.filter(x=>x.done).length;
  return `<div class="resume"><div><b>Reprendre : Examen 20/20 · 30 questions</b><small class="num">${evaluated}/30 évaluées · le délai de la question en cours continue</small></div><button class="btn" id="resume-pdf-timed">Reprendre</button><button class="x" id="drop-pdf-timed">Abandonner</button></div>`;
}
function startPDFTimed(){
  const list=shuffle(PDF2026).slice(0,30);if(list.length!==30)return;
  const now=Date.now();
  S={mode:"pdftimed",label:"OFFICIEL 2026 · Examen 20/20",src:{kind:"pdftimed"},sessionId:"timed30-"+now.toString(36)+Math.random().toString(36).slice(2,8),sessionDate:now,start:now,i:0,total:30,deadline:now+60000,
    items:list.map(q=>({q,order:optionOrder(q),sel:[],done:false,ok:false,color:null,timedOut:false}))};
  unlockResultAudio();persistPDFTimed();beginTicks();showPDFTimed(true);

function pdfTimedResults(){return S.items.map(it=>({n:it.q.n,color:it.done?it.color:null,selected:it.sel.slice(),timedOut:!!it.timedOut}))}
function pdfTimedSnapshot(completed=false){
  if(!S||S.mode!=="pdftimed")return null;
  const results=pdfTimedResults(),counts=pdfCounts(results,30),score20=Math.round(counts.green/30*200)/10;
  const entry={id:S.sessionId,d:S.sessionDate,updated:Date.now(),mode:"timed30",total:30,counts,results,completed,duration:Date.now()-S.start,mastered:counts.green,score20,passed:completed&&counts.green===30};
  const history=load(KEY_PDF_HISTORY,[]),index=history.findIndex(h=>h.id===entry.id);
  if(index<0)history.push(entry);else history[index]=entry;
  save(KEY_PDF_HISTORY,history);return entry;
}
function persistPDFTimed(){
  if(!S||S.mode!=="pdftimed")return;
  save(KEY_PDF_TIMED,{sessionId:S.sessionId,sessionDate:S.sessionDate,start:S.start,i:S.i,deadline:S.deadline,items:S.items.map(it=>({id:it.q.id,order:it.order,sel:it.sel,done:it.done,ok:it.ok,color:it.color,timedOut:it.timedOut}))});
  pdfTimedSnapshot();
}
function resumePDFTimed(){
  const saved=load(KEY_PDF_TIMED,null);if(!pdfTimedStoredOK(saved)){drop(KEY_PDF_TIMED);home();return}
  S={...saved,mode:"pdftimed",label:"OFFICIEL 2026 · Examen 20/20",src:{kind:"pdftimed"},total:30,i:Math.max(0,Math.min(saved.i,29)),items:saved.items.map(it=>({...it,q:BY_ID[it.id]}))};
  unlockResultAudio();beginTicks();
  if(!S.items[S.i].done&&Date.now()>=S.deadline)validatePDFTimed(true);else showPDFTimed(true);

function updPDFTimed(){
  if(!S||S.mode!=="pdftimed"||S.items[S.i].done)return;
  const left=S.deadline-Date.now(),timer=document.getElementById("pdf-question-timer");
  if(timer){timer.textContent=fmt(Math.ceil(Math.max(0,left)/1000)*1000);timer.classList.toggle("low",left<=10000)}
  if(left<=0)validatePDFTimed(true);
}
function showPDFTimed(top){
  const it=S.items[S.i],q=it.q,counts=pdfCounts(pdfTimedResults(),30);
  let feedback="";
  if(it.done){const title=it.timedOut?"✕ Temps écoulé · erreur":it.ok?"✓ Bonne réponse":it.color==="orange"?"◐ Réponse partielle · erreur":"✕ Aucun bon choix · erreur";
    feedback=`<div class="fb pdf-feedback ${it.color}"><div class="v">${title}</div><p>${it.timedOut?"La réponse devait être validée avant la fin de la minute.":it.ok?"Tous les bons choix, sans erreur.":"Il faut sélectionner toutes les bonnes réponses, sans choix incorrect."}</p>${!it.ok?`<p>À retenir : <b>${esc(q.a.map(i=>q.o[i]).join(" · "))}</b>.</p>`:""}<p>La correction reste affichée jusqu’à ton clic. La prochaine question aura sa propre minute.</p></div>`;
  }
  paint(`<div class="bar-top"><button class="quit" id="pdf-timed-quit">Accueil</button><span class="where num">Question <b>${S.i+1}</b>/30</span><span class="timer num${!it.done&&S.deadline-Date.now()<=10000?" low":""}" id="pdf-question-timer" aria-label="Temps pour cette question">${it.done?"Arrêté":fmt(Math.ceil(Math.max(0,S.deadline-Date.now())/1000)*1000)}</span></div><div class="prog"><span style="width:${(30-counts.unseen)/30*100}%"></span></div><p class="qmeta"><span>OFFICIEL 2026 · Examen 20/20 · Q${q.n}</span><span>${q.a.length>1?"Plusieurs réponses possibles":"Une seule réponse"}</span></p><p class="pdf-timed-rule">60 secondes par question. Valide ta réponse avant la fin. Objectif : 30/30 correctes = 20/20.</p>${pdfCounters(counts,"Cette session · 30 questions sans reprise","Erreurs / délai")}<h2 class="qtext">${esc(q.q)}</h2>${optionsHtml(it,it.done)}${feedback}<div class="act"><button class="btn" id="pdf-timed-action" ${!it.done&&!it.sel.length?"disabled":""}>${it.done?(S.i===29?"Voir mon résultat":"Question suivante"):"Valider ma réponse"}</button></div>`,top);
  app.querySelectorAll(".opt").forEach(button=>button.onclick=()=>pickPDFTimed(+button.dataset.oi));
  document.getElementById("pdf-timed-action").onclick=()=>it.done?nextPDFTimed():validatePDFTimed();
  document.getElementById("pdf-timed-quit").onclick=()=>{persistPDFTimed();home()};
}
function pickPDFTimed(index){
  if(!S||S.mode!=="pdftimed")return;
  const it=S.items[S.i];if(it.done)return;if(Date.now()>=S.deadline){validatePDFTimed(true);return}
  it.sel=it.q.a.length>1?(it.sel.includes(index)?it.sel.filter(i=>i!==index):it.sel.concat(index)):[index];
  persistPDFTimed();showPDFTimed(false);
}
function validatePDFTimed(expired=false){
  if(!S||S.mode!=="pdftimed")return;
  const it=S.items[S.i];if(it.done)return;
  expired=expired||Date.now()>=S.deadline;if(!expired&&!it.sel.length)return;
  it.done=true;it.timedOut=expired;it.ok=!expired&&same(it.q.a,it.sel);it.color=expired?"red":pdfColor(it.q,it.sel);
  record(it.q,it.ok);const stats=load(KEY_STATS,{});stats[it.q.id].pdfColor=it.color;save(KEY_STATS,stats);
  playResultSound(it.color);persistPDFTimed();showPDFTimed(false);
  const feedback=app.querySelector(".fb");if(feedback)feedback.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function nextPDFTimed(){
  if(!S||S.mode!=="pdftimed"||!S.items[S.i].done)return;
  if(S.i===29){finishPDFTimed();return}
  S.i++;S.deadline=Date.now()+60000;persistPDFTimed();showPDFTimed(true);
}
function finishPDFTimed(){
  if(!S||S.mode!=="pdftimed"||S.items.some(it=>!it.done))return;
  const entry=pdfTimedSnapshot(true),items=S.items.slice();drop(KEY_PDF_TIMED);stopAll();S=null;
  const wrong=items.filter(it=>!it.ok);
  paint(`<div class="res"><p class="lbl">OFFICIEL 2026 · Examen de 30 questions</p><div class="score num">${n20txt(entry.score20)}<small>/20</small></div><span class="verdict ${entry.passed?"":"ko"}">${entry.passed?"✓ Validé · sans-faute":"Non validé · objectif 20/20"}</span><p class="sum num">${entry.counts.green}/30 entièrement correctes. ${entry.passed?"Les 30 questions ont été réussies dans leur délai.":"Une réponse partielle, incorrecte ou hors délai empêche la validation."}</p>${pdfCounters(entry.counts,"Bilan de l’examen · premier essai","Erreurs / délai")}${pdfGrid(entry.results)}${pdfReviewButton(entry)}${wrong.length?`<section class="corr"><h3>Questions à retravailler</h3>${wrong.map(it=>`<details><summary><span class="q num ${it.color}">Q${it.q.n}</span><span>${esc(it.q.q)}</span></summary><div class="in">${it.timedOut?'<p class="red">Temps écoulé : réponse non validée dans la minute.</p>':""}<p class="you">Ton choix : ${esc(it.sel.map(i=>it.q.o[i]).join(" · ")||"Aucune réponse")}</p>${optionsHtml(it,true)}</div></details>`).join("")}</section>`:""}<div class="act"><button class="btn" id="pdf-timed-again">Nouveau tirage de 30</button><button class="btn ghost" id="pdf-timed-history">Historique 2026</button><button class="btn ghost" id="pdf-timed-home">Accueil</button></div></div>`,true);
  document.getElementById("pdf-timed-again").onclick=startPDFTimed;
  document.getElementById("pdf-timed-history").onclick=showPDFHistory;
  bindPDFReviewButtons();
  document.getElementById("pdf-timed-home").onclick=home;
}


document.addEventListener("keydown",e=>{
  if(!S||e.metaKey||e.ctrlKey||e.altKey)return;
  if(document.activeElement&&document.activeElement!==document.body)return;
  const it=S.items[S.i];if(!it)return;
  const map={"1":0,"2":1,"3":2,"4":3,"5":4,"6":5,"7":6};
  if(e.key in map&&it.order[map[e.key]]!==undefined&&!it.done){
    e.preventDefault();const oi=it.order[map[e.key]];
    if(S.mode==="train")pickTrain(oi);else if(S.mode==="pdftimed")pickPDFTimed(oi);
  }else if(e.key==="Enter"){
    if(S.mode==="train"){if(it.done){e.preventDefault();nextTrain()}else if(it.sel.length){e.preventDefault();validateTrain()}}
    else if(S.mode==="pdftimed"){e.preventDefault();if(it.done)nextPDFTimed();else if(it.sel.length)validatePDFTimed()}
  }
});
home();

</script>
</body>
</html>
